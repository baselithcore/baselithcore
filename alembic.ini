# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# timezone = UTC

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples
#
# A generated revision is a source file like any other, and it used to arrive
# unformatted and unlinted — so the first `pre-commit run` after `alembic
# revision` reformatted a file nobody had written, and a `git diff` on the new
# migration mixed the author's edits with the formatter's. Running the same two
# tools the pre-commit hooks run, in the same order (fix, then format), means
# the file is already in its final shape when the author opens it.
#
# `type = exec` runs `ruff` from PATH rather than a `console_scripts` entry
# point: ruff ships as a standalone binary in many environments and registers
# no such entry point there, which would make revision generation fail on a
# machine where ruff is perfectly well installed. Keep this list in lockstep
# with the ruff hooks in .pre-commit-config.yaml.
hooks = ruff_fix, ruff_format

ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME

ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
