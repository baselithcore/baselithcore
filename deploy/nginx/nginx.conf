
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # WebSocket upgrade passthrough that does NOT defeat the upstream
    # keepalive pool. The textbook value for the no-Upgrade case is `close`,
    # but a `Connection: close` sent upstream on every ordinary request makes
    # nginx open (and tear down) a fresh TCP connection to uvicorn per
    # request — the `keepalive 32` pool below never holds a socket. An empty
    # value drops the header from the proxied request (proxy_set_header with
    # "" omits it), which is exactly what upstream keepalive requires.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' "";
    }
    # === Client address and scheme: who is allowed to vouch for them ===
    #
    # The app trusts X-Forwarded-For / -Proto from this gateway only
    # (FORWARDED_ALLOW_IPS in compose.prod.yaml) and keys the per-IP rate
    # limits, the failed-auth throttle and the admin lockout on the address
    # it finds there. So this gateway must never relay what the *caller*
    # put in those headers: appending to a client-supplied X-Forwarded-For
    # ($proxy_add_x_forwarded_for) let anyone pick their own rate-limit
    # bucket, and passing X-Forwarded-Proto through let them claim https.
    #
    # Default (gateway directly exposed): nothing is trusted. $remote_addr is
    # the TCP peer and the scheme is this listener's own ($scheme).
    #
    # Behind a load balancer / TLS terminator: uncomment set_real_ip_from
    # with the LB's address or CIDR, AND add the same range to the geo block
    # below — keep the two lists identical. realip then replaces
    # $remote_addr with the client address the LB reported (walking
    # X-Forwarded-For right to left past trusted hops only), and the LB's
    # X-Forwarded-Proto / -Port are honoured — but only when the TCP peer
    # itself is the LB. Never list a range that untrusted clients can
    # connect from.
    # set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 1 when the TCP peer (before realip rewrote it) is a trusted LB.
    geo $realip_remote_addr $from_trusted_lb {
        default 0;
        # 10.0.0.0/8 1;
    }
    map "$from_trusted_lb:$http_x_forwarded_proto" $proxy_forwarded_proto {
        default $scheme;
        "~^1:(?<lb_proto>https?)$" $lb_proto;
    }
    map "$from_trusted_lb:$http_x_forwarded_port" $proxy_forwarded_port {
        default $server_port;
        "~^1:(?<lb_port>[0-9]{1,5})$" $lb_port;
    }
    # Edge/app log correlation. The app honours a caller-supplied
    # X-Request-ID only when it is a bounded ASCII token
    # ([A-Za-z0-9._-]{1,128}, core/middleware/observability.py) and mints a
    # UUID otherwise — so an id forwarded unchecked would appear in this
    # access log and nowhere else. Same rule here: keep a well-formed caller
    # id, replace anything else with nginx's own $request_id (32 hex chars,
    # always well-formed), send the result upstream and log it, so the edge
    # line and every app log line for the request carry ONE id.
    map $http_x_request_id $req_id {
        default $request_id;
        "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
    }

    # === Edge rate and concurrency limits ===
    #
    # Keyed on $binary_remote_addr, which the realip module above has already
    # rewritten to the client address when a trusted LB sits in front (realip
    # runs in the post-read phase, before limit_req / limit_conn). Without a
    # trusted LB it is the TCP peer. Either way a caller cannot pick its own
    # bucket: X-Forwarded-For from an untrusted peer is ignored.
    #
    # These are a coarse, cheap first line — they shed floods in C before a
    # request costs the app a worker, a quota lookup or a Redis round trip.
    # The app's own per-key/per-tenant quotas and failed-auth throttle stay
    # the precise layer behind them. 16 bytes per IPv4 state; 10m holds
    # ~160k addresses.
    #
    #   api_req   generous: a dashboard SPA fetches dozens of assets on load.
    #   auth_req  strict: admin Basic-auth and token/login endpoints are the
    #             brute-force targets.
    #   conn_per_ip  concurrent in-flight requests per client, all paths;
    #             long-lived streams are held to it too (they are exempt from
    #             limit_req, which counts request *starts*, not duration).
    limit_req_zone $binary_remote_addr zone=api_req:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_req:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_zone $binary_remote_addr zone=stream_conn:10m;
    # 429 (not the default 503): clients and SDKs treat 503 as "server down"
    # and retry at once; 429 tells them the limit is theirs.
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" "$req_id"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    # Slowloris: a client that trickles its request line/headers or body
    # holds a worker connection for the default 60s; cut that to 15s and
    # free the socket immediately instead of lingering in FIN_WAIT.
    client_header_timeout 15s;
    client_body_timeout 15s;
    reset_timedout_connection on;
    client_max_body_size 10m;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # application/problem+json: the RFC 9457 error envelope every 4xx/5xx
    # carries (core/api/errors.py). image/svg+xml: console icons. Streaming
    # types (text/event-stream, application/x-ndjson) are deliberately absent —
    # gzip would buffer the live stream.
    gzip_types text/plain text/css application/json application/problem+json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream backend_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        # "0" (disable the legacy auditor) is the modern guidance and matches
        # what the application itself sends; "1; mode=block" re-enabled a
        # filter that has been used to *introduce* XSS on otherwise safe pages.
        add_header X-XSS-Protection "0" always;
        # Mirror the application's own baseline (SecurityHeadersMiddleware) so
        # a response served from the edge — an error page, a 413, a redirect —
        # is not weaker than one that reached the app.
        # Must equal the value SecurityHeadersMiddleware emits: add_header
        # APPENDS a second Referrer-Policy rather than replacing the upstream
        # one, and browsers apply the LAST valid policy — a looser value here
        # silently overrides the stricter one the app already sent.
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

        # Inherited by every location that declares no limit_conn of its own
        # (only the streaming location below does). limit_req is NOT set here
        # on purpose: it is inherited the same way and nginx has no
        # `limit_req off`, so setting it per location is the only way to keep
        # /health, /metrics and the streams out of it.
        limit_conn conn_per_ip 64;

        location / {
            # 30 r/s sustained, bursts of 120 served without queueing delay;
            # beyond that, 429.
            limit_req zone=api_req burst=120 nodelay;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Compress here, not in the app: gzip in nginx runs in C off the
            # application's event loop, while the app's gzip middleware runs
            # zlib *on* it for every response above 500 bytes. Stripping the
            # client's Accept-Encoding from the upstream request makes the app
            # send identity and lets nginx (gzip on, above) do the work.
            proxy_set_header Accept-Encoding "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
            proxy_set_header X-Request-ID $req_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket Support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Synchronous chat (POST /chat, POST /v1/chat) answers only once the
        # whole LLM turn is done, and the provider call alone may take up to
        # LLM_REQUEST_TIMEOUT (120s default, core/config/services.py) — the
        # 60s read timeout of `location /` turned every slow answer into a
        # 504 while the app was still working on it. 180s = LLM timeout plus
        # room for retrieval and tool calls; raise it with the LLM timeout.
        location ~ ^(/v1)?/chat$ {
            limit_req zone=api_req burst=120 nodelay;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
            proxy_set_header X-Request-ID $req_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 180s;
        }

        # SSE/chat streaming must bypass proxy buffering to preserve low latency.
        # Regex so the versioned alias (/v1/chat/stream, mounted by the app
        # factory) gets the same treatment — a plain `location /chat/stream`
        # let it fall through to `location /` and its 60s read timeout.
        # The other long-lived streams the app serves are listed too: the run
        # event feed (GET /runs/{id}/events, api_routers plugin), the MCP
        # Streamable HTTP transport (POST /mcp, SSE responses; MCP_HTTP_PATH
        # default) and the baselithbot dashboard feed (GET
        # /baselithbot/dash/events/stream — the plugin mounts at /baselithbot,
        # its dashboard router at /dash; plugin routes get no /v1 alias).
        # Their `X-Accel-Buffering: no` already switched buffering off under
        # `location /`, but the 60s read timeout there still cut every stream
        # that stayed idle for a minute — an agent waiting on a slow LLM call
        # does exactly that.
        location ~ ^(/v1)?/(chat/stream|runs/[^/]+/events|mcp)$|^/baselithbot/dash/events/stream$ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
            proxy_set_header X-Request-ID $req_id;
            # HTTP/1.1 alone does not reuse the upstream keepalive pool: nginx
            # still sends `Connection: close` unless told otherwise. None of
            # these paths is a WebSocket (those — /chat/ws, /baselithbot/ws/pair
            # — go through `location /`, which keeps the Upgrade handling).
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            # No limit_req: a stream is one request that lives for minutes,
            # so a per-second rate says nothing about its cost — concurrency
            # does. Declaring limit_conn here stops the server-level one from
            # being inherited, so both are listed: the overall per-client cap
            # and a tighter one on simultaneous streams.
            limit_conn conn_per_ip 64;
            limit_conn stream_conn 16;
            # nginx strips X-Accel-* from upstream responses; pass this one
            # through so a CDN or proxy in front of us also stops buffering.
            # It replaces the directive that used to set the same header
            # here, which had the same client-facing effect but cancelled
            # EVERY header inherited from the server block — declaring one
            # header inside a location does that, so the SSE responses were
            # shipping without any of the security headers.
            # Buffering here is already off via `proxy_buffering off` above,
            # and the application emits the header on every stream
            # (plugins/api_routers/chat.py, core/mcp/sse.py, core/a2a/router.py).
            proxy_pass_header X-Accel-Buffering;
        }

        # Auth-sensitive paths: the admin console and API (Basic-auth, the
        # target of credential stuffing; /v1/admin/tenants is the versioned
        # alias the app factory mounts) and the token/login endpoints an auth
        # plugin serves under /api/auth/ (e.g. /api/auth/oauth/token, the
        # token_endpoint advertised by core/auth/oauth). 30 r/min with a burst
        # of 20 leaves an operator's admin dashboard usable and makes an
        # online password guess cost ~2 s per attempt at the edge — the app's
        # failed-auth throttle and admin lockout remain behind it.
        location ~ ^((/v1)?/admin(/|$)|/api/auth/) {
            limit_req zone=auth_req burst=20 nodelay;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
            proxy_set_header X-Request-ID $req_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint. HTTP/1.1 + empty Connection so the probe
        # (every 30s from compose, plus the LB) reuses the keepalive pool
        # instead of opening a fresh upstream socket per poll.
        location /health {
            proxy_pass http://backend_api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Metrics for Prometheus — scrape-network only. The app also demands
        # admin Basic-auth on /metrics (METRICS_AUTH_REQUIRED), but a public
        # edge should not even offer the endpoint to the internet. Regex so
        # the versioned alias the app factory also mounts (/v1/metrics) is
        # held to the same rule instead of falling through to `location /`.
        location ~ ^(/v1)?/metrics/?$ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
