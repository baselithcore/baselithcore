
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_x_forwarded_proto $proxy_forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }
    map $http_x_forwarded_port $proxy_forwarded_port {
        default $http_x_forwarded_port;
        '' $server_port;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 10m;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream backend_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        # "0" (disable the legacy auditor) is the modern guidance and matches
        # what the application itself sends; "1; mode=block" re-enabled a
        # filter that has been used to *introduce* XSS on otherwise safe pages.
        add_header X-XSS-Protection "0" always;

        location / {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Compress here, not in the app: gzip in nginx runs in C off the
            # application's event loop, while the app's gzip middleware runs
            # zlib *on* it for every response above 500 bytes. Stripping the
            # client's Accept-Encoding from the upstream request makes the app
            # send identity and lets nginx (gzip on, above) do the work.
            proxy_set_header Accept-Encoding "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket Support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # SSE/chat streaming must bypass proxy buffering to preserve low latency
        location /chat/stream {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $proxy_forwarded_port;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            # nginx strips X-Accel-* from upstream responses; pass this one
            # through so a CDN or proxy in front of us also stops buffering.
            # It replaces the directive that used to set the same header
            # here, which had the same client-facing effect but cancelled
            # EVERY header inherited from the server block — declaring one
            # header inside a location does that, so the SSE responses were
            # shipping without any of the security headers.
            # Buffering here is already off via `proxy_buffering off` above,
            # and the application emits the header on every stream
            # (plugins/api_routers/chat.py, core/mcp/sse.py, core/a2a/router.py).
            proxy_pass_header X-Accel-Buffering;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://backend_api/health;
        }

        # Metrics for Prometheus — scrape-network only. The app also demands
        # admin Basic-auth on /metrics (METRICS_AUTH_REQUIRED), but a public
        # edge should not even offer the endpoint to the internet.
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://backend_api/metrics;
        }
    }
}
