# Production overlay example. Apply with:
#   helm upgrade --install baselithcore deploy/helm/baselithcore \
#     -n baselithcore --create-namespace -f values-production.yaml
#
# Secrets are intentionally NOT set here — use an existing Secret managed by
# External Secrets Operator / Vault / sealed-secrets and reference it below.

image:
  repository: ghcr.io/baselithcore/baselithcore
  # Empty on purpose: the tag then comes from Chart.appVersion, which the
  # release commit rewrites. A hardcoded tag here was a SECOND place to bump
  # and it had already drifted a release behind the chart it shipped with.
  # For a real pin use the digest — a tag is a mutable pointer, so the image
  # an admission controller verified and the one that starts weeks later after
  # a re-push are not necessarily the same bytes.
  tag: ""
  # digest: "sha256:…"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# uvicorn trusts X-Forwarded-* only from these peers. Use the ingress
# controller's pod CIDR (cluster-specific — this is a placeholder); leaving it
# unset makes every request look like it came from the controller and
# collapses per-IP rate limiting / admin lockout into a single bucket.
forwardedAllowIps: "10.244.0.0/16"

# Measured on a local k3d install, not guessed: core's own document ingestion
# alone peaks at 1.1-1.45Gi, so the old 1Gi request understated the pod both to
# the scheduler and to the kernel's OOM victim score, which ranks a cgroup by
# how far it exceeds its request. No CPU limit: CPU is compressible, so a cap
# cannot prevent exhaustion — it only throttles, and the cold start an
# autoscaler just triggered is the worst moment for that. Re-measure against
# your own plugin set before pinning these.
resources:
  requests:
    cpu: "500m"
    memory: 2Gi
  limits:
    memory: 4Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"   # required for /chat/stream SSE
    # Buffering off is only half of what a stream needs: ingress-nginx also
    # applies proxy-read-timeout, which defaults to 60s, so any stream idle
    # for a minute — an agent waiting on a slow LLM call — was cut by the
    # ingress even with buffering disabled. Covers every streaming path the
    # app serves (/chat/stream and its /v1 alias, /runs/{id}/events, /mcp),
    # since this Ingress routes them all under one `/` prefix rule.
    # Also covers the synchronous POST /chat, which answers only after the
    # whole LLM turn (LLM_REQUEST_TIMEOUT alone is 120s by default).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # ingress-nginx caps request bodies at 1m by default, so anything between
    # 1 and 10 MiB — a document upload the app accepts — died with a 413 at
    # the edge. Keep equal to MAX_REQUEST_SIZE_BYTES (10485760 by default),
    # the app's own cap.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: baselithcore-tls
      hosts:
        - api.example.com

worker:
  enabled: true
  replicaCount: 2

serviceMonitor:
  enabled: true

networkPolicy:
  enabled: true
  # Required with ingress/serviceMonitor on (the chart refuses to render
  # without it): both callers live outside this namespace, and the empty
  # default ("any pod in this namespace") would lock them out. The namespace
  # names are the common defaults — adjust to where your ingress controller
  # and Prometheus actually run.
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring

config:
  CORE_LOG_LEVEL: INFO
  LOG_JSON: "true"
  APP_ENV: production
  AUTH_REQUIRED: "true"
  JWT_STRICT_VALIDATION: "true"
  # SECRETS_BACKEND defaults to 'env' in code; set via extraEnv if you need
  # 'file' (kept out of the ConfigMap to avoid Trivy KSV-0109 false positive).

secrets:
  create: false
  existingSecret: baselithcore-secrets   # SECRET_KEY, DATA_ENCRYPTION_KEYS, DB_PASSWORD, *_API_KEY,
  # plus the authenticated CACHE_/QUEUE_REDIS_URL, GRAPH_DB_URL and QDRANT_API_KEY
