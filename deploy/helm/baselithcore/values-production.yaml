# Production overlay example. Apply with:
#   helm upgrade --install baselithcore deploy/helm/baselithcore \
#     -n baselithcore --create-namespace -f values-production.yaml
#
# Secrets are intentionally NOT set here — use an existing Secret managed by
# External Secrets Operator / Vault / sealed-secrets and reference it below.

image:
  repository: ghcr.io/baselithcore/baselithcore
  tag: "0.31.0"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# uvicorn trusts X-Forwarded-* only from these peers. Use the ingress
# controller's pod CIDR (cluster-specific — this is a placeholder); leaving it
# unset makes every request look like it came from the controller and
# collapses per-IP rate limiting / admin lockout into a single bucket.
forwardedAllowIps: "10.244.0.0/16"

# Measured on a local k3d install, not guessed: core's own document ingestion
# alone peaks at 1.1-1.45Gi, so the old 1Gi request understated the pod both to
# the scheduler and to the kernel's OOM victim score, which ranks a cgroup by
# how far it exceeds its request. No CPU limit: CPU is compressible, so a cap
# cannot prevent exhaustion — it only throttles, and the cold start an
# autoscaler just triggered is the worst moment for that. Re-measure against
# your own plugin set before pinning these.
resources:
  requests:
    cpu: "500m"
    memory: 2Gi
  limits:
    memory: 4Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"   # required for /chat/stream SSE
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: baselithcore-tls
      hosts:
        - api.example.com

worker:
  enabled: true
  replicaCount: 2

serviceMonitor:
  enabled: true

networkPolicy:
  enabled: true

config:
  CORE_LOG_LEVEL: INFO
  CORE_LOG_FORMAT: json
  CORE_LOG_STRUCTURED: "true"
  APP_ENV: production
  AUTH_REQUIRED: "true"
  JWT_STRICT_VALIDATION: "true"
  # SECRETS_BACKEND defaults to 'env' in code; set via extraEnv if you need
  # 'file' (kept out of the ConfigMap to avoid Trivy KSV-0109 false positive).

secrets:
  create: false
  existingSecret: baselithcore-secrets   # SECRET_KEY, DATA_ENCRYPTION_KEYS, DB_PASSWORD, *_API_KEY
