# Default values for the BaselithCore Helm chart.
# Override with `-f my-values.yaml` or `--set key=value`.

# -- Number of API replicas. Ignored when autoscaling.enabled=true.
replicaCount: 2

image:
  repository: ghcr.io/baselithcore/baselithcore
  # There is ONE image. This used to say "`slim` excludes heavy browser/OCR
  # extras; use `full` if you need them" — no build ever produced either tag,
  # and the two Dockerfiles behind those names installed the same Playwright,
  # Chromium and pytesseract. Both are gone; the repository has one Dockerfile.
  tag: ""              # defaults to .Chart.AppVersion when empty
  # Pin by content, not by name. A tag is a mutable pointer: the image the
  # admission controller verified and the image that starts three weeks later
  # after a re-push are not necessarily the same bytes, and nothing in the
  # cluster notices. Set this to the digest your release pipeline signed
  # ("sha256:…") and it wins over `tag`, which is then only documentation.
  digest: ""
  pullPolicy: IfNotPresent
pullSecrets: []

# Kept ReplicaSets per Deployment. The default of 10 keeps ten rollouts' worth
# of pod templates around in etcd for no operational benefit; three is enough
# to roll back the mistake you just made.
revisionHistoryLimit: 3

# PriorityClass for the API and worker pods. Empty means the global default,
# which on a contended node makes the API exactly as evictable as any batch
# job that happens to share it. Point this at a cluster PriorityClass to say
# otherwise (the chart does not create one — priority is a cluster-wide policy
# decision, not a per-release one).
priorityClassName: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}      # e.g. IAM role ARN for IRSA / Workload Identity
  # The app never calls the Kubernetes API, so no pod needs a projected SA
  # token. Set true only for a sidecar/operator integration that does.
  automountToken: false

# Container port (matches Dockerfile EXPOSE 8000 / PORT env).
containerPort: 8000

# uvicorn workers per pod. Scale pods (replicaCount / the HPA) before workers:
# each worker is a full process that loads its own embedder/reranker (several
# hundred MB with the `full` image), so two of them multiply the memory the
# resources block below is sized for. Raise this only together with
# resources, and then also set PROMETHEUS_MULTIPROC_DIR (the chart does when
# webConcurrency > 1).
webConcurrency: 1

# Peers whose X-Forwarded-For / X-Forwarded-Proto uvicorn trusts
# (`--forwarded-allow-ips`; comma-separated IPs or CIDRs). Empty keeps the
# image default (127.0.0.1), which behind an ingress controller makes every
# request appear to come from the controller: per-IP rate limits, the
# failed-auth throttle and the admin lockout then collapse into one shared
# bucket. Set it to the ingress controller's pod CIDR, or "*" only when
# networkPolicy.ingressFrom already restricts who can reach the pod.
forwardedAllowIps: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: baselithcore.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# requests.memory is a promise to the scheduler and the input to the kernel's
# OOM victim score — a container is picked by how far it exceeds its request,
# not by how big it is. Understating it therefore packs the node *and* moves
# this pod to the front of the OOM queue, which is the worst of both. So the
# request tracks steady-state usage and the limit covers the peak.
#
# The numbers below are measured, not guessed: on a local k3d install an RQ
# worker running core's own document ingestion peaks at 1.1-1.45Gi, and the
# API pod is that same code plus the HTTP stack and every loaded plugin. The
# previous 512Mi/1Gi pair was below what a single ingestion needs.
#
# Re-measure for your own plugin set — that is what decides the number — and
# measure under load, never at rest, over more than one pod lifetime: the
# same deployment varies by a fifth run to run. For scale: an API pod with a
# plugin loading BGE-M3 plus a reranker sits at 3.0-3.7Gi steady, peaks at
# 3.1-4.5Gi under request load, and has touched 5.3Gi on a boot that
# downloaded the models.
resources:
  requests:
    # requests.cpu is not only a scheduling reservation: it is the HPA's
    # *denominator*. With `targetCPUUtilizationPercentage: 70` a 250m request
    # scales the deployment up the moment a pod passes 175m — and this app
    # idles around 65m but crosses that on any burst, including its own cold
    # start. The autoscaler then answers a burst one pod could absorb by
    # creating another pod that costs a multi-GB cold start to become useful.
    # 500m moves the trigger to 350m: above the idle band, below the 1.1-1.3
    # cores measured under real request load. Raise it further if your pods
    # genuinely run hotter — but move `targetCPUUtilizationPercentage` with it
    # deliberately, not by accident.
    cpu: 500m
    memory: 1536Mi
  limits:
    # No CPU limit on purpose. CPU is compressible: a limit cannot prevent
    # exhaustion, it can only throttle — and the worst moment to be throttled
    # is the cold start (plugin activation, embedder warmup) that an
    # autoscaler just triggered. Contention is already settled fairly by
    # requests.cpu, which sets the cgroup weight. Add limits.cpu back only
    # when a hard ceiling is a billing or noisy-neighbour *requirement*, and
    # never below the cold-start burst, which measures above 1 core.
    memory: 3Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Memory-based autoscaling is OFF on purpose, and turning it on is almost
  # always a mistake here. HPA computes utilization as usage/request, and this
  # pod's memory is dominated by a *constant* — resident model weights, plugin
  # state, the interpreter — that does not shrink when you add replicas. So a
  # pod sitting near its (correctly sized) request reads as permanently over
  # target, HPA scales to maxReplicas, each new pod loads the same constant,
  # the average never drops, and the deployment parks at maximum size forever
  # while paying several GB per replica. Memory pressure is a sizing problem,
  # solved by resources above; CPU is the signal that actually tracks load.
  targetMemoryUtilizationPercentage: null

  # Rendered verbatim into the HPA. The defaults are shaped by this app's cold
  # start: a new pod needs plugin activation plus embedder warmup before it
  # serves anything (up to the startupProbe's 300s budget), and it costs GBs.
  # So scale up in small steps — flooding in eight pods buys eight cold starts
  # competing for the same node, not eight times the capacity — and scale down
  # slowly, because every removed pod throws away a warm model cache that the
  # next scale-up has to rebuild from scratch.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180

# PodDisruptionBudget keeps a minimum available during voluntary disruptions
# (node drains, rollouts) — essential for the HA story.
#
# It has to stay strictly below the smallest replica count the deployment can
# reach, or the eviction API denies everything and node drains hang forever.
# The chart refuses to render a budget that can never be satisfied. Set either
# minAvailable or maxUnavailable, never both.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""
  # k8s 1.27+; older API servers drop the field. AlwaysAllow keeps a broken
  # pod from holding a drain hostage — see the comment in templates/pdb.yaml.
  unhealthyPodEvictionPolicy: AlwaysAllow

# Hardened pod/container security context. Matches the image's non-root
# appuser (uid 1000) and a read-only root filesystem.
#
# Together these satisfy the Pod Security Standards `restricted` profile, but
# satisfying it and having it enforced are different claims — and only the
# second one survives somebody adding a pod later. Enforcement is a label on
# the namespace, which this chart deliberately does not own (a chart that
# creates its own namespace fights `helm --create-namespace` and every GitOps
# tool). Put it wherever the namespace is created:
#
#   kubectl label namespace <ns> \
#     pod-security.kubernetes.io/enforce=restricted \
#     pod-security.kubernetes.io/enforce-version=latest \
#     pod-security.kubernetes.io/audit=restricted \
#     pod-security.kubernetes.io/warn=restricted
#
# Anything else you run in that namespace has to comply too — an in-cluster
# Postgres or Redis usually needs a uid and a couple of writable volumes
# before it does.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Writable scratch space when readOnlyRootFilesystem is true.
tmpVolumes:
  enabled: true
  sizeLimit: 256Mi

# Graceful shutdown: must exceed core.resilience GracefulShutdown timeout so
# in-flight requests drain before SIGKILL.
terminationGracePeriodSeconds: 45

# Host header sent on the three probes. TRUSTED_HOSTS mounts Starlette's
# TrustedHostMiddleware, which 400s any request whose Host it does not know —
# and the kubelet addresses the pod by IP, so without a Host header the probes
# fail and the pod never becomes ready. Left empty the chart uses the first
# ingress host, which is right whenever it also derived TRUSTED_HOSTS. Set this
# explicitly whenever you set config.TRUSTED_HOSTS yourself.
probeHost: ""

# Covers slow cold starts (plugin activation, embedder warmup): up to
# periodSeconds * failureThreshold = 300s before the pod is restarted.
# Liveness/readiness only start once this succeeds.
startupProbe:
  path: /health
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60

livenessProbe:
  path: /health
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  path: /health/ready
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Spread replicas across failure domains. The hostname constraint is what
# stops a single node taking the whole deployment with it; the zone one is
# what stops a single availability zone doing the same, and it is the half
# most charts forget.
topologySpreadConstraints:
  enabled: true
  # Harmless on a single-zone cluster — every node reports the same value for
  # topology.kubernetes.io/zone, so the constraint is trivially satisfied.
  zoneAware: true
  # ScheduleAnyway keeps a pod schedulable when the spread cannot be honoured
  # (a small cluster, a zone at capacity) — availability of the pod wins over
  # the shape of the spread. DoNotSchedule is the stronger guarantee and the
  # right choice once you genuinely have more nodes than replicas per zone;
  # set it there and understand that a pod may stay Pending instead.
  whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}
tolerations: []
affinity: {}

# -------------------------------------------------------------------------
# Background worker (core.task_queue RQ worker) — optional separate Deployment.
# -------------------------------------------------------------------------
worker:
  enabled: false
  replicaCount: 1
  # `baselith worker` is not a command: the CLI rejects it with
  # "invalid choice: 'worker'". The RQ consumer lives under the queue group.
  command:
    - baselith
    - queue
    - worker

  # A worker's own grace period, separate from the API's. RQ answers SIGTERM
  # with a *warm* shutdown: it stops taking new jobs and finishes the one in
  # flight. Inheriting the API's 45s — tuned for draining HTTP requests — means
  # SIGKILL lands in the middle of a job that was going to finish, and the work
  # comes back only if the job was written to be idempotent. Raise this above
  # your slowest job; lower it and you are choosing to lose work on every
  # rollout and node drain.
  terminationGracePeriodSeconds: 120

  # maxSurge 0: a queue consumer gains nothing from an extra pod during a roll,
  # and surging doubles a multi-GB footprint on the node for the length of the
  # rollout. Take one down, bring one up.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  # Queue-depth autoscaling via KEDA (requires the KEDA operator in the
  # cluster; the chart renders a ScaledObject, nothing more).
  #
  # CPU is the wrong signal for a queue consumer: a worker with a thousand
  # jobs waiting and one in flight looks exactly like an idle one to the HPA,
  # because the backlog lives in Redis, not in the pod. KEDA reads the list
  # length and drives a normal HPA from it.
  keda:
    enabled: false
    # **Read this before setting 0.** Scale-to-zero is KEDA's headline feature
    # and an idle worker reserves over a gigabyte, so it is tempting. But this
    # worker also hosts RQ's *scheduler*: at zero replicas nothing fires the
    # scheduled and cron jobs — including the ones that would have created the
    # queue depth to scale back up on. Zero is right only when every job is
    # enqueued by something else (the API, a webhook).
    minReplicaCount: 1
    maxReplicaCount: 5
    pollingInterval: 15
    # How long the backlog must stay empty before the last surplus replica
    # goes. A worker that has just loaded an embedder is expensive to discard.
    cooldownPeriod: 300
    scaleUpPodsPerMinute: 2
    redis:
      # host:port, not a URL, and **fully qualified**: KEDA connects from the
      # operator's own pod, in its own namespace, so a short Service name does
      # not resolve — the ScaledObject then sits Ready=False with "no such
      # host" and the worker silently never scales. Use
      # <service>.<namespace>.svc.cluster.local:<port>. Required when enabled;
      # the chart refuses to render without it.
      address: ""
      databaseIndex: "0"
      enableTLS: "false"
      # Name of an env var on the worker pod holding the password, if any.
      passwordFromEnv: ""
    # One trigger per RQ queue. `listLength` is jobs per replica: KEDA targets
    # depth/listLength replicas, so it reads as "how deep a backlog one worker
    # is allowed to own".
    queues:
      - name: default
        listLength: "5"

  # Off by default because the default is a single worker, and a budget over
  # one pod denies every eviction and hangs node drains. Turn it on together
  # with replicaCount >= 2; the chart refuses the unsatisfiable combination.
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  # Optional liveness probe, rendered verbatim into the worker container when
  # set. Leave empty and the worker has none: a hung RQ worker then keeps
  # running with its queue undrained, which is the current behaviour.
  #
  # RQ workers renew a heartbeat key in Redis and drop out of `Worker.all()`
  # once it expires, so "is this pod's worker still registered" is a real
  # liveness signal. It only works because the chart sets `RQ_WORKER_NAME` to
  # the pod name: RQ otherwise registers a random hex id that no probe can tie
  # back to the pod it is checking, and a probe matching on the hostname then
  # fails on a healthy worker and restarts it every failureThreshold periods.
  # Still validate against your own deployment before enabling — a probe that
  # cannot reach Redis restarts healthy workers just as effectively.
  #
  #   livenessProbe:
  #     exec:
  #       command:
  #         - python
  #         - -c
  #         - |
  #           import os, sys
  #           from redis import Redis
  #           from rq import Worker
  #           conn = Redis.from_url(os.environ["QUEUE_REDIS_URL"])
  #           me = os.environ["RQ_WORKER_NAME"]
  #           alive = any(w.name == me for w in Worker.all(connection=conn))
  #           sys.exit(0 if alive else 1)
  #     initialDelaySeconds: 60
  #     periodSeconds: 60
  #     timeoutSeconds: 10
  #     failureThreshold: 3
  livenessProbe: {}
  # An idle worker is the most misleading pod in the deployment: RQ forks a
  # child per job, so the parent that `kubectl top` shows sits at ~80Mi
  # forever while the fork is what actually allocates. Measured on a local k3d
  # install, one document-ingestion job takes the pod from 84Mi idle to
  # 1.1-1.45Gi — so size this for a worker doing its job, never for the
  # queue-empty reading.
  resources:
    requests:
      # Left at 250m against a measured 0.58-core peak during ingestion: a
      # worker's CPU is bursty by nature and nothing autoscales on it here
      # (queue depth does — see worker.keda), so the request is a share of a
      # contended node rather than a trigger.
      cpu: 250m
      memory: 1536Mi
    limits:
      # No CPU limit here either, and it matters more than on the API: an
      # embedding batch is exactly the compute burst a cap would throttle.
      memory: 3Gi

# -------------------------------------------------------------------------
# Telemetry (OpenTelemetry traces + metrics)
# -------------------------------------------------------------------------
# Off by default, and off means *nothing is instrumented*: no TracerProvider,
# no FastAPI/HTTPX/Redis auto-instrumentation, therefore no HTTP, database or
# client spans anywhere — including in-process consumers such as the
# BaselithControl "Traces" tab, which then correctly reports that the SDK is
# not active and shows an empty list. Turning tracing on is this block; it is
# not something the app infers from having the SDK installed.
telemetry:
  # Installs the providers and the auto-instrumentation at boot.
  enabled: false

  # OTLP/gRPC collector endpoint (e.g. "http://tempo.monitoring:4317",
  # "http://otel-collector:4317").
  #
  # EMPTY IS A SUPPORTED MODE, and the right one for a cluster with no trace
  # backend: the providers and every instrumentor are still installed, spans
  # are still produced and still reach in-process consumers (the Traces tab),
  # they simply are not shipped anywhere. Pointing the exporter at a collector
  # that is not deployed is strictly worse than leaving this empty — the gRPC
  # exporter retries every batch with backoff, burning CPU on the export
  # thread and filling the log, and you still have no trace backend.
  #
  # A collector outside this namespace also needs a NetworkPolicy egress rule
  # when networkPolicy.egress.enabled is on: presets.sameNamespace does not
  # cover it, and the export then fails silently at the CNI.
  otlpEndpoint: ""

  # Head-based sampling ratio, ParentBased(TraceIdRatio). 1.0 traces every
  # request: fine for a lab or a low-traffic staging, but on a busy deployment
  # it is the single most expensive knob here — every sampled span costs
  # attribute allocation, queue space and (with a collector) egress. Lower it
  # in production; the trace you keep is still a complete one, because the
  # decision is taken once at the root and inherited by every child.
  tracesSampleRate: 1.0

  # Push OTel-native metrics over OTLP. Independent of the Prometheus /metrics
  # scrape, which is always available and is what serviceMonitor uses — so
  # this is duplicate cost unless a collector actually consumes it. Requires
  # otlpEndpoint (metrics have no in-process consumer; the chart refuses the
  # combination rather than starting an export thread that exports nowhere).
  metricsEnabled: false

  # `deployment.environment` resource attribute on every span/metric. Empty
  # leaves the app default ("development"), which mislabels a production
  # deployment in whatever backend receives it.
  environment: ""

# -------------------------------------------------------------------------
# Configuration
# -------------------------------------------------------------------------
# Non-secret environment variables -> ConfigMap. Keys set here always win over
# the blocks above, so an operator can still drive TELEMETRY_* by hand.
config:
  CORE_LOG_LEVEL: INFO
  CORE_LOG_FORMAT: json
  CORE_LOG_STRUCTURED: "true"
  APP_ENV: production
  AUTH_REQUIRED: "true"
  SECURITY_HEADERS_ENABLED: "true"
  # NOTE: the secrets backend selector defaults to 'env' in code. It is NOT set
  # here on purpose: its key name ("SECRETS_BACKEND") trips ConfigMap-secret
  # scanners (Trivy KSV-0109) even though the value is a selector, not a secret.
  # To use mounted K8s secrets, add it via `extraEnv` instead:
  #   extraEnv:
  #     - name: SECRETS_BACKEND
  #       value: file

# Secret environment variables. Two mutually-compatible options:
#  1) inline:  populated into a chart-managed Secret (base64 at render time).
#  2) existingSecret: name of a pre-created Secret (recommended for prod / GitOps;
#     pairs with External Secrets Operator, Vault Agent, or sealed-secrets).
secrets:
  create: true
  existingSecret: ""
  # Provide via --set-string or a values file kept out of git.
  data: {}
    # SECRET_KEY: "..."
    # DATA_ENCRYPTION_KEYS: "v1:..."
    # DB_PASSWORD: "..."
    # ANTHROPIC_API_KEY: "..."

# Extra raw env (e.g. valueFrom references) appended verbatim to the container.
extraEnv: []

# Extra volumes / mounts, rendered verbatim into the api and worker pods.
# `readOnlyRootFilesystem: true` leaves only the /tmp mount writable, so any
# component that persists under the image tree (a plugin's own data directory,
# a Hugging Face cache under /app/models) needs a volume here or it fails at
# boot. Mount durable state on a PVC; caches can be an emptyDir.
#   extraVolumes:
#     - name: plugin-data
#       persistentVolumeClaim:
#         claimName: baselithcore-plugin-data
#   extraVolumeMounts:
#     - name: plugin-data
#       mountPath: /app/data
extraVolumes: []
extraVolumeMounts: []

# One-shot copies from the image into a mounted volume, run in an initContainer
# before the app starts. `readOnlyRootFilesystem: true` makes every path inside
# the image tree read-only, so a file the app *rewrites* at runtime has to live
# on a volume — pointed at by env — instead. The catch is that a fresh volume is
# empty, and the app needs the image's copy as its starting point:
#
#   configs/plugins.yaml is rewritten whenever a plugin is enabled or disabled
#   (`baselith plugin config set`, or any admin surface that does the same).
#   Left on the image tree every toggle fails with "Read-only file system";
#   moved to an empty volume every plugin boots unconfigured. It needs both
#   halves:
#
#     config:
#       PLUGIN_CONFIG_PATH: /app/data/configs/plugins.yaml   # must be under CWD
#     seedFromImage:
#       - from: /app/configs/plugins.yaml
#         to: /app/data/configs/plugins.yaml
#
# `from` may be a file or a directory. A destination that already exists is
# never touched, so restarts and upgrades keep whatever the running deployment
# wrote — a changed image default reaches an existing volume only if you delete
# the destination yourself.
seedFromImage: []

# Declarative plugin set. The other way round from `seedFromImage` above: that
# one makes configs/plugins.yaml writable so an admin can toggle plugins at
# runtime; this one makes the plugin set a property of the release. When
# `config` is non-empty it is rendered into a ConfigMap and mounted read-only
# over /app/configs/plugins.yaml in the api and worker pods (subPath, so the
# rest of configs/ stays as shipped). The app reads that path by default, so
# no PLUGIN_CONFIG_PATH is involved, and the pods roll whenever the content
# changes. Every console or CLI toggle then fails with "Read-only file
# system" — deliberately: the set of plugins a release runs is decided by
# whoever renders the values (a customer spec, a GitOps overlay), not by a
# click in a pod, and the running state can never drift from the manifest.
#
# The map is the plugins.yaml content verbatim: plugin name -> its block. Note
# the loader's rule (core/api/lifespan.py): when the file has any entries, a
# plugin absent from it is NOT loaded, so list every plugin the release needs,
# system plugins included.
#
#   plugins:
#     config:
#       auth: {enabled: true}
#       api_routers: {enabled: true}
#       baselithcontrol: {enabled: true, require_admin: false}
#       compliance: {enabled: true, require_admin: true}
#
# Mutually exclusive with `config.PLUGIN_CONFIG_PATH` and with a
# `seedFromImage` entry from /app/configs/plugins.yaml; the chart refuses to
# render the combination.
plugins:
  config: {}

# `helm test <release>` — the smoke test that asks the one question a
# successful install cannot answer: does a request reaching the Service get an
# answer. It retries rather than sampling once, because a cold start (plugin
# activation, embedder warmup) can outlast the first attempt and a flaky test
# is worse than no test.
tests:
  timeoutSeconds: 300

# ServiceMonitor for the Prometheus Operator (scrapes /metrics).
serviceMonitor:
  enabled: false
  interval: 15s
  path: /metrics
  labels: {}
  # Prometheus scrapes each pod by IP, and a ServiceMonitor endpoint has no
  # field for a Host header — so the scrape arrives as `Host: <pod-ip>`,
  # TrustedHostMiddleware answers 400, and the target sits down forever with
  # nothing but 400s in the app log. On (the default) the chart adds the pod's
  # own IP to TRUSTED_HOSTS through the downward API, which is the only name
  # the scrape can present. What that costs: a caller who can already reach the
  # pod directly on the cluster network may use the pod IP as a Host, so any
  # absolute URL the app builds from it would carry an in-cluster address —
  # not a name that resolves anywhere else. Turn it off only when you set
  # config.TRUSTED_HOSTS yourself and have made the pod IP trusted there.
  trustPodIP: true
  # /metrics is admin-basic-auth-protected by default (METRICS_AUTH_REQUIRED).
  # Point secretName at a Secret with the admin credentials so Prometheus can
  # scrape. Alternative: set METRICS_AUTH_REQUIRED=false in the app env and
  # restrict /metrics via NetworkPolicy instead.
  basicAuth: {}
  #  secretName: baselithcore-metrics-auth
  #  usernameKey: username
  #  passwordKey: password

# PrometheusRule for the Prometheus Operator — the alerts that go with the
# ServiceMonitor above. Off by default: a rule object referencing a Prometheus
# that is not there is dead YAML, and a chart that ships alerts nobody routed
# teaches operators to ignore the ones that do fire.
#
# `labels` is usually what decides whether the rules are picked up at all:
# kube-prometheus-stack selects PrometheusRule objects by label (commonly
# `release: <stack release>`), so an object without it is created, accepted and
# never evaluated. Check the Prometheus resource's `ruleSelector` before
# concluding the alerts do not work.
prometheusRule:
  enabled: false
  # Rules can live in the Prometheus namespace instead of the release's, for
  # setups whose ruleNamespaceSelector is narrow. Empty = the release namespace.
  namespace: ""
  labels: {}
  #  release: kube-prometheus-stack
  # Group evaluation interval. Empty = Prometheus' global default, which is the
  # right answer unless you have measured otherwise.
  interval: ""
  # Thresholds. Every one of them is a judgement about THIS deployment's
  # traffic, so they are values and not constants in the template.
  thresholds:
    # Ratios, not counts: an absolute error threshold is either useless on a
    # cell serving ten requests a minute or deaf on one serving ten thousand.
    # Measured on the RED HTTP counter, which is also the availability SLI in
    # deploy/prometheus/slo-rules.yml, so the two cannot disagree.
    httpErrorRatio: 0.05
    llmErrorRatio: 0.10
    # Fraction of NON-streaming requests slower than the 1s latency objective.
    # The streaming routes are excluded in the rule: they are designed to stay
    # open for minutes, so leaving them in makes the ratio a measure of how
    # much streaming a deployment does.
    httpSlowRatio: 0.05
    # Auth failures, rate-limit rejections and oversized requests share one
    # counter, so this is a spike detector, not a policy.
    securityEventsPerSecond: 1
    volumeUsedRatio: 0.85
    containerRestarts: 3
    # Longer than the daily schedule plus one missed run, so a single skipped
    # backup does not page and two do.
    backupMaxAgeHours: 26
  # Alert names to leave out, for the one a given deployment cannot act on —
  # silencing here rather than in Alertmanager keeps the reason in git.
  disabledAlerts: []
  #  - BaselithcoreHttpLatencyHigh
  # Extra rule objects, appended to the group verbatim. For deployment-specific
  # alerts that have no business in the chart.
  extraRules: []

# Pre-deploy Alembic migrations (helm hook Job). When enabled, api pods boot
# with DB_MIGRATIONS_ON_STARTUP=false — a bad migration fails the Job (and
# the upgrade) instead of crash-looping the ReplicaSet.
migrations:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# -------------------------------------------------------------------------
# Database roles.
# -------------------------------------------------------------------------
database:
  # Provision the least-privilege LOGIN role the application authenticates as,
  # in a pre-install/pre-upgrade Job that runs right after the migrations.
  #
  # Why it is not cosmetic: PostgreSQL skips a row-level-security policy for a
  # SUPERUSER, for a role with BYPASSRLS, and for the table *owner* when the
  # table lacks FORCE ROW LEVEL SECURITY — which migration 008 deliberately
  # does not set. Connecting the app as the owning role (what `DB_USER` is out
  # of the box, and what the bundled Postgres creates) therefore leaves
  # DB_RLS_ENABLED=true with no isolation whatsoever. `core.db.rls_posture`
  # refuses to boot in production when that is the case; this Job is the
  # remedy it points at.
  #
  # Turning it on means two credentials: `adminSecret` (the owner/superuser,
  # used only by the Job) and the app's own DB_PASSWORD, which the Job sets as
  # this role's password so the two cannot drift. Point the app at the role by
  # setting `config.DB_USER` (or `DB_USER` in `secrets.data`) to the same name.
  runtimeRole:
    enabled: false
    name: baselith_runtime
    host: postgres
    port: 5432
    database: baselithcore
    # psql/pg_isready only — no application code runs here.
    image: postgres:16-alpine
    # Owner (or superuser) credential. CREATE ROLE and GRANT are owner work:
    # the app's own least-privilege role cannot bootstrap itself.
    adminSecret:
      name: ""
      userKey: POSTGRES_USER
      passwordKey: POSTGRES_PASSWORD
    # Where the Job reads the password to give the runtime role. Defaults to
    # the release secret's DB_PASSWORD — the same value the app authenticates
    # with, so provisioning and connecting cannot disagree.
    passwordSecret:
      name: ""
      key: DB_PASSWORD
    # Same reasoning as the backup CronJob: a cluster coming back up runs its
    # hooks before CoreDNS is ready, and psql does not retry a failed name
    # resolution.
    waitForDatabaseSeconds: 300
    backoffLimit: 1
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

# NetworkPolicy: default-deny ingress except from the same namespace + ingress.
networkPolicy:
  enabled: false
  # Extra ports this release's own pods may reach on each other, on top of
  # containerPort. A plugin that runs a single-instance side process and has
  # every replica forward to it needs one: dbview elects one owner of its Node
  # child cluster-wide, and the other replicas dial it on 43117
  # (DBVIEW_INTERNAL_PORT). Without the port here those replicas answer 404 for
  # the console while the leader's replica serves it.
  #   selfIngressPorts: [43117]
  selfIngressPorts: []
  # Ingress peers allowed to reach the API port. Empty means "any pod in this
  # namespace" — which admits a compromised neighbour, and, more often, locks
  # out the two callers that actually matter, because both usually live
  # somewhere else: the ingress controller (its own namespace) and Prometheus
  # (the monitoring namespace). Turning networkPolicy on with this left empty
  # is how a deployment goes dark and every ServiceMonitor target goes red at
  # the same moment. Name them:
  #
  #   ingressFrom:
  #     - namespaceSelector:
  #         matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
  #       podSelector:
  #         matchLabels: {app.kubernetes.io/name: ingress-nginx}
  #     - namespaceSelector:
  #         matchLabels: {kubernetes.io/metadata.name: monitoring}
  #       podSelector:
  #         matchLabels: {app.kubernetes.io/name: prometheus}
  #
  # The kubelet's probes are not affected: they come from the node, and a
  # NetworkPolicy does not apply to host-network traffic to a pod on that node.
  ingressFrom: []
  egress:
    # Off by default because enabling it is deny-by-default outbound: anything
    # not listed below stops working, and the last mile is always deployment
    # knowledge. It is the half that matters for an agent runtime — with egress
    # unrestricted, a prompt-injected agent or a hostile tool result can reach
    # whatever the pod network routes to, cloud metadata included. Turn it on:
    # the presets below cover what a standard install of this chart needs.
    enabled: false
    # Keep DNS open, or every other rule fails to resolve. Assumes the standard
    # `k8s-app: kube-dns` label (CoreDNS); set false and add your own rule if
    # your cluster labels it differently.
    allowDNS: true
    # The rules a standard install needs, so switching egress on is a flag
    # rather than a YAML exercise nobody has time for — which is the real
    # reason egress policies stay off everywhere.
    presets:
      # Every pod in this release's namespace: the in-cluster Postgres, Redis /
      # FalkorDB and vector store the chart's own config points at.
      sameNamespace: true
      # Outbound TCP/443 to the public internet, with cloud metadata
      # (169.254.0.0/16) and the RFC1918 / CGNAT / loopback ranges carved out.
      # **Datastores outside the cluster live in those ranges**: a managed
      # Postgres, an internal object store or a private LLM gateway needs its
      # own entry under `rules` — the preset deliberately will not reach it.
      internetHttps: true
    # Verbatim NetworkPolicy egress rules. Example — in-namespace Postgres and
    # Redis plus HTTPS to the internet for LLM providers:
    #   rules:
    #     - to:
    #         - podSelector:
    #             matchLabels: {app.kubernetes.io/name: postgresql}
    #       ports: [{protocol: TCP, port: 5432}]
    #     - to:
    #         - ipBlock:
    #             cidr: 0.0.0.0/0
    #             except: [169.254.169.254/32]   # cloud metadata
    #       ports: [{protocol: TCP, port: 443}]
    rules: []

# Scheduled Postgres backups (CronJob). Writes gzipped pg_dump to a volume and
# prunes by age; with `offsite` on, every dump is then copied to an object
# store, which is what makes it a backup rather than a file on the node that
# just died. Disabled by default.
backup:
  enabled: false
  # Identity the backup pod runs as. Kept apart from the app's ServiceAccount
  # so a cloud role for the bucket (IRSA on EKS, Workload Identity on GKE,
  # AKS workload identity) is granted to the backup alone, never to the pods
  # that serve requests. `annotations` carries the binding
  # (`eks.amazonaws.com/role-arn`, `iam.gke.io/gcp-service-account`, ...).
  serviceAccount:
    create: false
    name: ""                     # defaults to <fullname>-backup when created
    annotations: {}
  # Extra labels on the backup pod. Some identity webhooks key on a pod
  # label rather than on the ServiceAccount alone: AKS workload identity
  # injects its token only into pods labelled
  # `azure.workload.identity/use: "true"`.
  podLabels: {}
  # Copy each dump to an object store with rclone. Any rclone backend works:
  # `remote` is the backend definition (every key becomes an
  # RCLONE_CONFIG_OFFSITE_<KEY> variable, so `type: s3, provider: AWS,
  # env_auth: true, region: eu-west-1` is an S3 remote authenticated through
  # the pod's cloud identity; `type: gcs, env_auth: true` a GCS one;
  # `type: azureblob, env_auth: true, account: <name>` Azure Blob; an S3-
  # compatible store such as OVH or MinIO adds `provider: Other` and
  # `endpoint`). `path` is "bucket/prefix" on that remote. Static keys, where
  # the provider has no pod identity, go in `credentialsSecret`: a Secret
  # whose keys are the same RCLONE_CONFIG_OFFSITE_* variables
  # (RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID / _SECRET_ACCESS_KEY for S3).
  #
  # The local `retentionDays` still applies to the volume; `offsite.retentionDays`
  # prunes the remote copy too, and 0 leaves that to the bucket's own lifecycle
  # rules (the platform Terraform sets those on the backups bucket).
  offsite:
    enabled: false
    image: rclone/rclone:1.75.1
    remote: {}
    path: ""
    retentionDays: 0
    credentialsSecret: ""
    extraArgs: []
  schedule: "0 2 * * *"          # daily at 02:00
  image: postgres:16-alpine
  retentionDays: 30
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  backoffLimit: 2
  # `concurrencyPolicy: Forbid` means a job that hangs blocks every schedule
  # after it, so the run is bounded. Has to cover waitForDatabaseSeconds plus
  # the dump of the largest database this is pointed at.
  activeDeadlineSeconds: 3600
  # How long to wait for the database to accept connections before the dump.
  # A CronJob replays its missed schedules when a cluster comes back up, so
  # the nightly run routinely starts mid-boot, ahead of CoreDNS: without this
  # pg_dump dies on the first name-resolution failure and the day is lost.
  waitForDatabaseSeconds: 300
  pg:
    host: postgres
    port: 5432
    database: baselithcore
    user: baselithcore
    passwordSecret:
      name: ""                   # defaults to the release secret
      key: DB_PASSWORD
  # Where dumps land. Replace with a persistentVolumeClaim for durability —
  # and null the emptyDir when you do. Values merge rather than replace, so a
  # claim added on top of this default renders a volume with two types and the
  # API server rejects the CronJob outright:
  #   backup:
  #     volume:
  #       emptyDir: null
  #       persistentVolumeClaim: {claimName: baselithcore-backups}
  volume:
    emptyDir: {}
    # persistentVolumeClaim:
    #   claimName: baselithcore-backups
