{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
# The application never talks to the Kubernetes API; a projected token in
# every pod is only a credential for an attacker who lands in one.
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
metadata:
  name: {{ include "baselithcore.serviceAccountName" . }}
  labels:
    {{- include "baselithcore.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
