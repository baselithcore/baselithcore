{{- if and .Values.backup.enabled .Values.backup.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
# The backup pod never calls the Kubernetes API. Its cloud identity (the
# `annotations` below bind an IAM role / GCP service account / Azure client
# id to this account) rides on a separate projected token the provider's
# webhook injects, so the Kubernetes token stays unmounted.
automountServiceAccountToken: false
metadata:
  name: {{ include "baselithcore.backupServiceAccountName" . }}
  labels:
    {{- include "baselithcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  {{- with .Values.backup.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
