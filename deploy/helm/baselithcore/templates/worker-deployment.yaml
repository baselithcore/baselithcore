{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "baselithcore.fullname" . }}-worker
  labels:
    {{- include "baselithcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.keda.enabled }}
  # Omitted when KEDA owns the count: leaving it here makes Helm and the
  # ScaledObject's HPA overwrite each other on every upgrade.
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "baselithcore.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  {{- with .Values.worker.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "baselithcore.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "baselithcore.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      # The worker's own period, not the API's: RQ finishes the job in flight
      # on SIGTERM, and cutting that short loses work. See worker.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.topologySpreadConstraints.enabled (gt (int .Values.worker.replicaCount) 1) }}
      topologySpreadConstraints:
        {{- include "baselithcore.topologySpread" (dict "root" . "component" "worker") | trim | nindent 8 }}
      {{- end }}
      {{- include "baselithcore.seedInitContainers" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "baselithcore.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # A crashed container's message comes from /dev/termination-log,
          # which nothing here writes — so the pod's status says nothing.
          # Falling back to the tail of the log puts the actual traceback in
          # `kubectl describe`, where the person debugging is already looking.
          terminationMessagePolicy: FallbackToLogsOnError
          command:
            {{- toYaml .Values.worker.command | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "baselithcore.fullname" . }}-config
            - secretRef:
                name: {{ include "baselithcore.secretName" . }}
                optional: true
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- with .Values.worker.livenessProbe }}
          # Opt-in. An RQ worker that hangs mid-job keeps its process alive, so
          # the kubelet's default process check never restarts it and the queue
          # silently stops draining. The probe that detects it has to know this
          # deployment's queue Redis URL and worker naming, which the chart
          # cannot infer — so the operator supplies (and validates) it rather
          # than inheriting a guess that would restart healthy workers.
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.tmpVolumes.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.tmpVolumes.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.tmpVolumes.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.tmpVolumes.enabled }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolumes.sizeLimit }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
