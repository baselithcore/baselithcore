{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "baselithcore.fullname" . }}
  labels:
    {{- include "baselithcore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "baselithcore.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    {{- with .Values.networkPolicy.ingressFrom }}
    # Operator-supplied peer selectors: name the ingress controller (or whatever
    # is actually allowed to reach the API) instead of the whole namespace.
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.containerPort }}
    {{- else }}
    # Default: any pod in the same namespace, which is what an in-namespace
    # ingress controller and the kubelet's probes need. Set
    # `networkPolicy.ingressFrom` to narrow this to the controller alone —
    # as written, a compromised neighbour in the namespace also qualifies.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  # Egress is the half that matters for an agent runtime. A NetworkPolicy with
  # no egress rules leaves outbound traffic unrestricted, so a prompt-injected
  # agent, a hostile tool result or a compromised dependency can reach anything
  # the pod network routes to — including cloud metadata and internal
  # services the SSRF guard does not sit in front of. Turning this on switches
  # the pod to deny-by-default outbound: everything it legitimately needs must
  # be listed below.
  egress:
    {{- if .Values.networkPolicy.egress.allowDNS }}
    # DNS first: without it every other rule fails to resolve.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- with .Values.networkPolicy.egress.rules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
