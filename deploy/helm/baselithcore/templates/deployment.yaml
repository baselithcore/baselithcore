{{- $probeHost := include "baselithcore.probeHost" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "baselithcore.fullname" . }}
  labels:
    {{- include "baselithcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "baselithcore.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        # Roll pods when config/secret content changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "baselithcore.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "baselithcore.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "baselithcore.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      {{- end }}
      containers:
        - name: api
          image: {{ include "baselithcore.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            - name: WEB_CONCURRENCY
              value: {{ .Values.webConcurrency | quote }}
            {{- with .Values.forwardedAllowIps }}
            - name: FORWARDED_ALLOW_IPS
              value: {{ . | quote }}
            {{- end }}
            {{- if gt (int .Values.webConcurrency) 1 }}
            # With >1 uvicorn worker /metrics must aggregate across processes,
            # otherwise each scrape reads a single worker's registry.
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus
            {{- end }}
            {{- if .Values.migrations.enabled }}
            # Migrations run in the pre-deploy hook Job (migrations-job.yaml);
            # pods must not repeat them at boot.
            - name: DB_MIGRATIONS_ON_STARTUP
              value: "false"
            {{- end }}
            {{- if and .Values.serviceMonitor.enabled .Values.serviceMonitor.trustPodIP }}
            # Prometheus addresses each pod by IP and a ServiceMonitor endpoint
            # has no field for a Host header, so the scrape arrives as
            # `Host: <pod-ip>` and TrustedHostMiddleware answers 400. The target
            # is then permanently down with nothing but 400s in the app log.
            # The pod's own IP is the only name the scrape can present, so it
            # goes into TRUSTED_HOSTS — here rather than in the ConfigMap,
            # because only the container env expands $(POD_IP). This entry
            # overrides the ConfigMap's; see serviceMonitor.trustPodIP.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TRUSTED_HOSTS
              value: {{ include "baselithcore.trustedHostsWithPodIP" . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "baselithcore.fullname" . }}-config
            - secretRef:
                name: {{ include "baselithcore.secretName" . }}
                optional: true
          # Gates liveness/readiness until the (potentially slow) lifespan —
          # plugin activation, embedder warmup — completes: a cold start slower
          # than livenessProbe's window no longer CrashLoops the pod.
          startupProbe:
            httpGet:
              {{- include "baselithcore.probeHttpGet" (dict "path" .Values.startupProbe.path "host" $probeHost) | nindent 14 }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              {{- include "baselithcore.probeHttpGet" (dict "path" .Values.livenessProbe.path "host" $probeHost) | nindent 14 }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              {{- include "baselithcore.probeHttpGet" (dict "path" .Values.readinessProbe.path "host" $probeHost) | nindent 14 }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          # Drain in-flight work before SIGTERM is delivered (belt-and-braces
          # with the app's GracefulShutdown handler).
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.tmpVolumes.enabled (gt (int .Values.webConcurrency) 1) .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.tmpVolumes.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if gt (int .Values.webConcurrency) 1 }}
            # Guarantees the multiprocess dir exists (and survives a
            # readOnlyRootFilesystem) regardless of the /tmp mount.
            - name: prometheus-multiproc
              mountPath: /tmp/prometheus
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.tmpVolumes.enabled (gt (int .Values.webConcurrency) 1) .Values.extraVolumes }}
      volumes:
        {{- if .Values.tmpVolumes.enabled }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolumes.sizeLimit }}
        {{- end }}
        {{- if gt (int .Values.webConcurrency) 1 }}
        - name: prometheus-multiproc
          emptyDir:
            sizeLimit: 64Mi
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
