{{/*
`helm test <release>` — proves the release actually serves, which is the one
thing `helm install` never tells you. A successful install means the objects
were accepted by the API server; it says nothing about whether a request
reaching the Service gets an answer.

Addresses the Service by its in-cluster FQDN on purpose: that name is always
in the derived TRUSTED_HOSTS, so a 400 here is a real failure rather than the
Host-header trap that catches probes and Prometheus scrapes.

`/health/ready` and not `/health`: the liveness path answers 200 as soon as
the process is up, while readiness returns 503 when the database is
unreachable — so this covers DNS, Service endpoints, the app's own lifespan
and the datastore in one request.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "baselithcore.fullname" . }}-smoke-test
  labels:
    {{- include "baselithcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    # Leave nothing behind on success; keep the failed pod so its logs can be
    # read, which is the only reason to run the test at all.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "baselithcore.serviceAccountName" . }}
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.pullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: smoke-test
      image: {{ include "baselithcore.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      terminationMessagePolicy: FallbackToLogsOnError
      # python, not curl: the interpreter is the one thing this image is
      # guaranteed to have, whatever the build variant strips out.
      command:
        - python
        - -c
        - |
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          url = "http://{{ include "baselithcore.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}/health/ready"
          # A smoke test that races the rollout is a flaky test. Until the
          # first pod passes its readiness probe the Service has no endpoints
          # and kube-proxy answers "connection refused" — which looks exactly
          # like a broken app. Retrying past a cold start (plugin activation,
          # embedder warmup) is the difference between testing the release and
          # testing the clock.
          deadline = time.monotonic() + {{ .Values.tests.timeoutSeconds }}
          attempt = 0
          last = ""
          while True:
              attempt += 1
              # Reset per attempt: otherwise a connection error on try 1 keeps
              # being reported over a later HTTP status, and the message names
              # the wrong failure.
              last = ""
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      body = response.read().decode("utf-8", "replace")
                      status = response.status
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  status = exc.code
              except Exception as exc:
                  body = ""
                  status = 0
                  last = f"{exc.__class__.__name__}: {exc}"

              if status == 200:
                  break
              detail = last or f"HTTP {status}"
              print(f"attempt {attempt}: {url} -> {detail}")
              if time.monotonic() >= deadline:
                  print(f"FAIL {url}: {detail}")
                  print(body[:2000])
                  sys.exit(1)
              time.sleep(5)

          print(f"{url} -> {status} after {attempt} attempt(s)")
          print(body[:2000])
          try:
              json.loads(body)
          except ValueError:
              print("FAIL: readiness answered 200 but the body is not JSON")
              sys.exit(1)
          print("OK")
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
      {{- if .Values.tmpVolumes.enabled }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      {{- end }}
  {{- if .Values.tmpVolumes.enabled }}
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi
  {{- end }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
