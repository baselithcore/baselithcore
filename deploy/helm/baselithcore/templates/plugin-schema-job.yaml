{{- if .Values.database.pluginSchemaInit.enabled }}
{{- /*
This Job reads the plugin set from PLUGIN_CONFIG_PATH, like the application —
but it is a hook pod, and it mounts none of the application's volumes. Point
that path at a writable volume and the file simply is not there when the Job
runs: `read_plugin_configs()` returns nothing, and every plugin is taken as
enabled with an EMPTY config block. A plugin that chooses its storage in that
block then builds the wrong one — an in-memory store instead of the Postgres
schema the deployment asked for — prints `<plugin>: schema ready`, creates no
table, and the Job exits 0. The application boots afterwards against a schema
that does not exist.

So the combination is refused here, the way plugins-configmap.yaml refuses its
own. The three ways out, in the order worth preferring:

  * `plugins.config` — the declarative set, rendered into a ConfigMap both this
    Job and the application read. The set stops depending on a file somebody
    may have edited in a pod.
  * leave PLUGIN_CONFIG_PATH inside the image (/app/configs/...), which the Job
    carries too.
  * `database.pluginSchemaInit.enabled: false`, which is only honest when every
    plugin's tables come from a migration — or when the deployment lets the
    serving process hold DDL (DB_RUNTIME_DDL=true), which a least-privilege
    role cannot do.
*/ -}}
{{- with (.Values.config).PLUGIN_CONFIG_PATH }}
{{- if not (hasPrefix "/app/configs/" .) }}
{{- fail (printf "database.pluginSchemaInit and config.PLUGIN_CONFIG_PATH=%s are mutually exclusive: the schema Job mounts no application volume, so it cannot read that file — it would take every plugin as enabled with an empty config and build the wrong schema, silently and with exit 0. Use plugins.config, or keep PLUGIN_CONFIG_PATH inside the image, or set database.pluginSchemaInit.enabled=false." .) }}
{{- end }}
{{- end }}
# Builds every enabled plugin's schema, at deploy time, as the table owner.
#
# A plugin that creates its tables from the serving process cannot run in a
# deployment that isolates tenants at the database: that application connects
# as a least-privilege role which owns nothing and holds no DDL — the only way
# a row-level-security policy applies to it — so the plugin fails on
# `permission denied for schema public`, or, once granted that, on
# `must be owner of table …`, which no grant fixes.
#
# Hook-weight 2: after Alembic (0) and after the runtime role exists (1), and
# before Helm applies the Deployment. A non-zero exit stops the release rather
# than starting an application against a half-built schema.
# Pre-deploy Alembic migration Job. Runs `alembic upgrade head` BEFORE the
# rollout: a bad migration fails this Job (and the helm upgrade) instead of
# crash-looping the whole ReplicaSet, and pods no longer contend on the
# migration advisory lock during rolling deploys. The api pods then boot with
# DB_MIGRATIONS_ON_STARTUP=false (set by deployment.yaml when this is on).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "baselithcore.fullname" . }}-plugin-schema
  labels:
    {{- include "baselithcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: plugin-schema
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.database.pluginSchemaInit.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.database.pluginSchemaInit.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "baselithcore.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: plugin-schema
    spec:
      {{- with .Values.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Deliberately NOT the release ServiceAccount: that one is an ordinary
      # resource Helm applies after its hooks, so referencing it here makes the
      # first install fail with "serviceaccount not found" until the Job's
      # deadline expires. The Job never calls the Kubernetes API anyway.
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: plugin-schema
          image: {{ include "baselithcore.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["baselith", "plugin", "schema-init"]
          # Hook-scoped copies (migrations-env.yaml), created at hook-weight -5.
          # The release's own ConfigMap/Secret do not exist yet on a first
          # install, and an envFrom that cannot resolve leaves the pod stuck
          # until activeDeadlineSeconds kills the install.
          envFrom:
            - configMapRef:
                name: {{ include "baselithcore.migrationConfigName" . }}
            - secretRef:
                name: {{ include "baselithcore.migrationSecretName" . }}
                optional: true
          {{- if .Values.database.runtimeRole.enabled }}
          # Alembic must NOT run as the runtime role. That role exists to have
          # row-level security apply to it, which is the same thing as saying it
          # owns nothing and holds no DDL — so a migration running as it fails on
          # the first CREATE, and the whole release with it. Worse, if it ever
          # did succeed it would own the new tables, and PostgreSQL exempts a
          # table's owner from its own policy: the deployment would come up
          # "isolated" with the isolation silently off.
          #
          # Env wins over envFrom, so these two entries put the owner back for
          # this Job only; the api and worker pods keep the least-privilege role
          # they read from the release ConfigMap.
          env:
            {{- if .Values.database.runtimeRole.adminUser }}
            - name: DB_USER
              value: {{ .Values.database.runtimeRole.adminUser | quote }}
            {{- else }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.runtimeRole.adminSecret.name | quote }}
                  key: {{ .Values.database.runtimeRole.adminSecret.userKey | quote }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.runtimeRole.adminSecret.name | quote }}
                  key: {{ .Values.database.runtimeRole.adminSecret.passwordKey | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.database.pluginSchemaInit.resources | nindent 12 }}
          {{- if .Values.tmpVolumes.enabled }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if .Values.tmpVolumes.enabled }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- end }}
      # The hook runs the same image against the same database as the app, so
      # it has to be schedulable wherever the app is. Without these it is not:
      # a nodeSelector that pins the pods to one node leaves the Job free to
      # land anywhere, and on a tainted or heterogeneous cluster it sits
      # Pending until activeDeadlineSeconds fails the whole release — with the
      # app itself perfectly schedulable.
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
