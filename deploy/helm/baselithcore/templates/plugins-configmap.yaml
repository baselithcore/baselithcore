{{- if .Values.plugins.config }}
{{- /*
A declarative plugin set: `plugins.config` is rendered into this ConfigMap and
mounted read-only over /app/configs/plugins.yaml in the api and worker pods,
shadowing the copy baked into the image. The app reads that path by default
(core/api/lifespan.py), so no PLUGIN_CONFIG_PATH is needed — and every CLI
and console surface that rewrites configs/plugins.yaml now fails with
"Read-only file system", which is the point: the set of plugins a release runs
is decided by whoever renders the values, not by a toggle in a pod.

The two mechanisms cannot be combined, so the conflicts are refused here rather
than discovered as an unexplained "the toggle does nothing" later.
*/ -}}
{{- if hasKey .Values.config "PLUGIN_CONFIG_PATH" }}
{{- fail "plugins.config and config.PLUGIN_CONFIG_PATH are mutually exclusive: the first mounts a read-only plugins.yaml over the image path, the second moves the file onto a writable volume. Pick one." }}
{{- end }}
{{- range .Values.seedFromImage }}
{{- if eq .from "/app/configs/plugins.yaml" }}
{{- fail "plugins.config and a seedFromImage entry from /app/configs/plugins.yaml are mutually exclusive: the seed would copy the chart-rendered file onto a volume the app never reads. Drop the seed entry." }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "baselithcore.pluginsConfigName" . }}
  labels:
    {{- include "baselithcore.labels" . | nindent 4 }}
data:
  plugins.yaml: |
    {{- toYaml .Values.plugins.config | nindent 4 }}
{{- if .Values.database.pluginSchemaInit.enabled }}
---
# The same set for the plugin-schema Job. Helm applies the ConfigMap above
# after its pre-install/pre-upgrade hooks, so the Job cannot mount it (and on
# an upgrade it would still hold the previous revision's set). Without this
# copy the Job read the image's plugins.yaml and ran init_schema() for every
# plugin in the image — building tables for plugins the release never loads,
# and failing the release on one that cannot run on a read-only rootfs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "baselithcore.pluginsHookConfigName" . }}
  labels:
    {{- include "baselithcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: plugin-schema
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  plugins.yaml: |
    {{- toYaml .Values.plugins.config | nindent 4 }}
{{- end }}
{{- end }}
