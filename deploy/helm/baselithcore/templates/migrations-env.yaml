{{- if .Values.migrations.enabled }}
# Env sources for the pre-deploy migration Job.
#
# Helm runs pre-install hooks BEFORE it applies the release's ordinary
# resources, so the Job cannot read the ConfigMap/Secret the app pods read:
# on a first install neither exists yet, the Job's pod is never admitted
# ("serviceaccount not found" / the ConfigMap it envFroms is missing) and the
# install dies on activeDeadlineSeconds. These hook-scoped copies are created
# at a lower hook weight than the Job and removed once it succeeds.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "baselithcore.migrationConfigName" . }}
  labels:
    {{- include "baselithcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  {{- include "baselithcore.configData" . | nindent 2 }}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
---
# Only the chart-managed Secret needs a copy. An externally-managed
# `secrets.existingSecret` already exists before Helm runs, so the Job
# references it directly.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "baselithcore.migrationSecretName" . }}
  labels:
    {{- include "baselithcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
