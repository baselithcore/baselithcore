# Adversarial regression corpus, sixth volume: Chinese typed in pinyin and
# Japanese in romaji, digits standing in for a CJK, Devanagari or Arabic
# letter, and the boundary between a request to reveal the assistant's own
# system prompt and a question about system prompts. Every pinyin, romaji and
# digit `blocked` case here passed the input guard before the zh-latn and
# ja-latn families (baselith/core/guardrails/romanized.py) and the digit
# stand-ins (baselith/core/guardrails/variants.py, normalize.py) existed. The
# system-prompt section pins both sides of the topic exemptions the reveal
# patterns learned (multilingual.py, config.py): its `allowed` cases were
# blocked before, its `blocked` cases must stay blocked.

# ----------------------------------------------- system-prompt questions
# A question *about* system prompts is not a request for this one. These
# were blocked when the reveal patterns took any words between verb and noun
# and ignored what followed the noun.

