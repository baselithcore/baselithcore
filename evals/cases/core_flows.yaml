# Deterministic regression cases for the core agentic flows.
#
# Each case asserts on a pre-recorded run (evals/runs/recorded_runs.json):
# output keywords, tool usage, call/latency/cost budgets. The suite never
# invokes an LLM — CI replays the recordings through TrajectoryEvaluator and
# fails when the pass rate drops below the gate threshold.
#
# When a flow legitimately changes (prompts, tool set, routing), update the
# matching recording in the same change — the unit guard
# tests/unit/core/evaluation/test_regression_gate_assets.py keeps the two
# files honest locally before CI does.

- case_id: rag_grounded_answer
  input: "What storage backends does BaselithCore support?"
  expected_keywords: ["Postgres", "Qdrant", "Redis"]
  forbidden_keywords: ["I don't know", "as an AI"]
  expected_tools: ["search_knowledge_base"]
  forbidden_tools: ["execute_code"]
  max_tool_calls: 3
  max_latency_ms: 15000
  max_cost_usd: 0.05

- case_id: rag_cites_sources
  input: "How does the memory hierarchy consolidate STM into LTM?"
  expected_keywords: ["consolidation", "STM", "LTM"]
  expected_tools: ["search_knowledge_base"]
  max_tool_calls: 3
  max_latency_ms: 15000
  max_cost_usd: 0.05

- case_id: scraper_flow_uses_scraper_only
  input: "Fetch the title of https://example.com and summarize it"
  expected_keywords: ["Example Domain"]
  expected_tools: ["scrape_url"]
  forbidden_tools: ["execute_code", "index_document"]
  max_tool_calls: 4
  max_latency_ms: 30000
  max_cost_usd: 0.10

- case_id: reasoning_plan_before_execute
