# Tool-discipline regression cases: call order, argument fidelity, refusals,
# grounding, budgets, multilingual behaviour and failure surfacing.
#
# Same contract as core_flows.yaml: every case is replayed against its curated
# reference run in evals/runs/recorded_runs.json by the deterministic gate.
# The recordings are reference trajectories (what a correct run looks like),
# kept in step with the prompts and tool set — change both together.

- case_id: order_plan_then_execute
  input: Plan and then run a script that lists the files in the workspace
  expected_tool_order:
  - plan_task
  - execute_code
  expected_tools:
  - plan_task
  - execute_code
  forbidden_tools:
  - scrape_url
  max_tool_calls: 3
  max_latency_ms: 30000
  max_cost_usd: 0.1
- case_id: order_search_before_answer
  input: Before answering, look up how checkpoints are stored and then explain it
  expected_tool_order:
  - search_knowledge_base
  expected_keywords:
  - checkpoint
  forbidden_tools:
  - execute_code
  max_tool_calls: 2
  max_latency_ms: 15000
  max_cost_usd: 0.05
- case_id: order_scrape_then_index
  input: Fetch https://example.com/changelog and index it into the knowledge base
  expected_tool_order:
  - scrape_url
  - index_document
  expected_tool_args:
    scrape_url:
      url: https://example.com/changelog
  forbidden_tools:
  - execute_code
  max_tool_calls: 3
  max_latency_ms: 45000
  max_cost_usd: 0.15
