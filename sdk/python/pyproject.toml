[build-system]
# >=77 for PEP 639 SPDX license metadata (the `license = "<expr>"` string form
# and `license-files`); 68 predates it and silently ignores both.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baselith-sdk"
# Read from baselith_sdk/version.py, which is what semantic-release rewrites on
# every release (see `.releaserc`). It used to be a static "0.1.0" here while
# version.py said 0.35.1: two versions for one package, and the one that would
# have reached an index was the frozen one. `attr:` is resolved statically by
# setuptools — version.py holds nothing but the assignment, so nothing is
# imported at build time.
dynamic = ["version"]
description = "Typed Python client for the BaselithCore API"
readme = "README.md"
# The client is deliberately broader than the server: it is a thin httpx +
# pydantic wrapper with no 3.10+ runtime construct, and the callers that talk
# to a BaselithCore deployment are not all on the framework's own 3.12 floor.
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["../../LICENSE"]
authors = [{ name = "BaselithCore" }]
keywords = ["baselith", "agentic", "ai", "sdk", "client"]
# Mirrors the tested surface: `requires-python` above admits 3.9 through 3.14,
# so the trove list says the same rather than under-reporting it. `Typing ::
# Typed` is the counterpart of the py.typed marker shipped below.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.urls]
Homepage = "https://baselithcore.xyz"
Documentation = "https://docs.baselithcore.xyz"
Repository = "https://github.com/baselithcore/baselithcore"

# PEP 735, matching the root project: test requirements are a development
# input resolved from this repository, not part of what the client publishes.
[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.dynamic]
version = { attr = "baselith_sdk.version.__version__" }

[tool.setuptools.packages.find]
include = ["baselith_sdk*"]

[tool.setuptools.package-data]
baselith_sdk = ["py.typed"]
