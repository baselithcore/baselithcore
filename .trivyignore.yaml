# Trivy vulnerability exceptions — accepted risk register
#
# Scope rules for this file:
#   * One entry per CVE, never a package- or path-wide mute.
#   * Every entry carries a `statement` explaining WHY no fix can be applied
#     and an `expired_at` date, so the finding resurfaces and gets re-argued
#     instead of decaying into a permanent blind spot.
#   * "Not fixed yet upstream" alone is not a reason. The reason must be a
#     structural block (an unliftable dependency cap, an unmaintained
#     transitive) plus a bounded blast radius.
#
# Two consumers, one register. The Trivy Scan job in
# .github/workflows/ci.yml passes `--ignorefile .trivyignore.yaml` explicitly
# and honours `expired_at` itself. pip-audit takes advisory ids on the command
# line instead, so the same job generates them with
# `scripts/audit_ignores.py`, which drops an entry the day its `expired_at`
# passes — an exception cannot outlive the argument that justified it.

vulnerabilities:
  # ----------------------------------------------------------------
  # transformers 4.57.6 — present only with the `mineru` extra installed
  # ----------------------------------------------------------------
  # `mineru[pipeline]` (the DEFAULT OCR backend — `PDF_OCR_BACKEND` defaults to
  # `mineru`) pins `transformers<5.0.0`. That cap is unchanged in mineru 3.4.5
  # (the newest stable) and still present in the 4.0.0a6 pre-release, so no
  # published mineru version lifts it. Within `<5.0.0` the newest release is
  # 4.57.6 — already what the lock resolves to — and none of the fixes below
  # was backported to the 4.x line, so there is no reachable fixed version.
  #
  # Honest scoping (default backend, NOT per-request opt-in): 4.57.6 is pulled
  # in only when an operator installs the heavy `mineru` extra (`pip install
  # baselith-core[mineru]` or `baselith plugin deps install document-sources`).
  # A base install has no transformers 4.x at all and OCR falls back to
  # tesseract. But once the extra is present, MinerU is the default document
  # OCR path, so treat the CVEs below as accepted risk on that path, bounded by:
  #   * Reachability: transformers here is exercised solely by mineru's own
  #     pipeline over documents already fetched to local disk; there is no
  #     network-facing transformers endpoint.
  #   * Untrusted-input hardening: the document_sources OCR path enforces
  #     byte/page/time caps and a bounded dedicated executor
  #     (MINERU_MAX_BYTES / MINERU_MAX_PAGES / MINERU_TIMEOUT_SECONDS), and the
  #     remote *-http-client server URL is scheme/host-validated, limiting the
  #     blast radius of a hostile document.
  #   * Blast radius on core: uv.lock records two transformers resolutions
  #     because `huggingface` and `mineru` are declared conflicting extras in
  #     [tool.uv].conflicts. The `huggingface` branch — the one core imports
  #     from (core/nlp/__init__.py,
  #     core/services/llm/providers/huggingface_provider.py) — resolves
  #     transformers 5.14.1 and is unaffected by any of them — it is already
  #     above every fixed version named below.
  #
  # Re-evaluate at expiry: if mineru has shipped a release accepting
  # transformers >=5.5.0, drop these entries and re-lock.
  - id: CVE-2026-4372
    paths:
      - uv.lock
    statement: >-
      Remote code execution in transformers, fixed in 5.3.0. Unreachable fix:
      mineru[pipeline] caps transformers<5.0.0 in every published release
      (3.4.4 and 4.0.0a4), and 4.57.6 is the newest 4.x with no backport.
      Present only when the heavy `mineru` extra is installed (MinerU is the
      default OCR backend then); exercised solely by mineru's own pipeline over
      local documents, under byte/page/time caps. The `huggingface` extra that
      core actually imports resolves transformers 5.12.1 (unaffected).
    expired_at: 2026-10-29
  - id: CVE-2026-5241
    paths:
      - uv.lock
    statement: >-
      Arbitrary code execution via an overridden trust_remote_code setting in
      transformers, fixed in 5.5.0. Same unreachable-fix situation as
      CVE-2026-4372: mineru[pipeline] caps transformers<5.0.0. Mitigating
      control on the core path — huggingface_trust_remote_code defaults to
      False and emits a security warning when enabled
      (core/config/services.py) — and the core huggingface branch resolves
      transformers 5.14.1, which carries the fix.
    expired_at: 2026-10-29
  - id: CVE-2026-9856
    paths:
      - uv.lock
    statement: >-
      Path traversal in transformers' save_pretrained: a crafted chat-template
      name escapes the target directory and writes arbitrary files. Fixed in
      5.10.0, which the mineru cap (<5.0.0) puts out of reach — same structural
      block as CVE-2026-4372 and CVE-2026-5241 above. Two things bound it
      further. Reachability: nothing in core/, plugins/, sdk/ or scripts/ calls
      save_pretrained at all, so the vulnerable entry point is not exercised by
      this project — only by mineru's own pipeline, over documents already on
      local disk. Blast radius: in uv.lock every dependency edge of the 4.57.6
      resolution is gated on `extra == 'extra-13-baselith-core-mineru'`, and
      the other branch resolves transformers 5.14.1, which is above the 5.10.0
      fix. Re-argued together with the two entries above at the shared expiry.
    expired_at: 2026-10-29

  # ----------------------------------------------------------------
  # accelerate 1.14.0 — present only with the `huggingface` extra installed
  # ----------------------------------------------------------------
  - id: CVE-2026-69112
    paths:
      # The lockfile (filesystem scan) and the installed distribution inside
      # the container image (image scan in release-image.yml / image_build),
      # which reports the same CVE against the dist-info path. Without the
      # second glob the accepted risk resurfaced as a code-scanning alert.
      - uv.lock
      - "**/site-packages/accelerate-*.dist-info/METADATA"
    statement: >-
      Path traversal in accelerate's load_checkpoint_in_model /
      load_checkpoint_and_dispatch: unsanitised `weight_map` entries in a
      sharded-checkpoint index let a crafted model repository read arbitrary
      files, or block indefinitely on a named pipe. The structural block is
      harder than the caps above — there is nothing to upgrade to. The
      advisory (GHSA-4j2p-28q2-5m79) names no patched version: the two
      upstream fix PRs (#4070, #4138) were closed unmerged, and 1.15.0
      (2026-09-09) shipped without them. It only falls outside the advisory's
      "<= 1.14.0" range, so bumping to it would silence the scanner without
      fixing anything — the lock stays at 1.14.0 and the risk stays declared.
      Reachability: nothing in core/, plugins/, sdk/ or scripts/ imports
      accelerate. It is reached only indirectly, by transformers'
      from_pretrained(..., device_map=...) in the local HuggingFace provider,
      which needs BOTH the `huggingface` extra installed AND
      LLM_HUGGINGFACE_LOCAL=true (default false); a base install has no
      accelerate at all and the Inference-API path never loads a checkpoint.
      Blast radius: exploitation requires the deployment to be pointed at a
      hostile model repository, and the model id is deployment configuration
      (LLM_MODEL, or a per-plugin LLM policy) — ChatRequest declares no model
      field and forbids extras, so no request can choose one. That is the same
      trust boundary the codebase already draws around model loading with
      LLM_HUGGINGFACE_TRUST_REMOTE_CODE (default false), which grants a
      strictly stronger capability (RCE) than this arbitrary-file-read.
      Re-argue at expiry: check the advisory for a first patched version and
      re-lock to it the day one exists.
    expired_at: 2026-10-09

  # ----------------------------------------------------------------
  # pip's own vendored tree — visible only since pip 26 ships an SBOM
  # ----------------------------------------------------------------
  # Both entries below come from ONE file: `pip/_vendor/bom.cdx.json`, the
  # CycloneDX SBOM that pip started shipping with 26.0. Trivy reads it and
  # reports all 19 vendored components as installed packages. pip 25.0.1 (what
  # `python:3.12-slim` ships) has no such file, so the same tree scanned clean
  # — measured both ways on the bare base image: 0 python-pkg findings before
  # the upgrade, these 2 after. The upgrade did not add either weakness; it
  # made pip's supply chain legible to the scanner, which is the point of an
  # SBOM. pip 25.0.1 vendored msgpack 1.1.0, equally inside the advisory's
  # "<= 1.2.0" range and equally unreported.
  #
  # Why pip is in the image at all, and cannot simply be dropped: the runtime
  # pip is what `baselith plugin deps install` runs, via `sys.executable -m
  # pip` (core/marketplace/installer.py). The Dockerfile upgrades it to
  # >=26.2.0 because 25.0.1 carries five advisories on exactly that code path
  # (CVE-2025-8869, CVE-2026-3219, CVE-2026-6357, CVE-2026-8643,
  # CVE-2026-13346 — symlink and archive handling during wheel installation,
  # and an index-driven arbitrary file write). Staying on 25.0.1 to avoid the
  # two entries below would trade five reachable install-path weaknesses for
  # one unreachable DoS and one package that is not installed.
  #
  # Neither entry carries `paths`. Trivy reports SBOM-derived components under
  # the aggregate "Python" target with PkgPath unset, so a path filter matches
  # nothing and silently stops suppressing. Do not "tighten" these by adding
  # one.
  - id: GHSA-6v7p-g79w-8964
    statement: >-
      msgpack 1.1.2, vendored in pip/_vendor/msgpack. Reusing an Unpacker after
      it has raised keeps reading past the buffer and can crash the process —
      a DoS when the same Unpacker is fed untrusted input repeatedly. Fixed in
      1.2.1. Unreachable fix: no released pip carries it. pip 26.2.1 is the
      newest release and vendors 1.1.2; pip's main branch has already bumped
      vendor.txt to msgpack==1.2.1, so the next release closes this without
      any change here. Blast radius: the single consumer is
      pip/_vendor/cachecontrol/serialize.py, which deserialises pip's OWN HTTP
      cache. Nothing in core/, plugins/, sdk/ or scripts/ imports msgpack, and
      the image installs no other copy. Reaching the vulnerable path means
      writing crafted msgpack into pip's cache directory first, which is
      already write access as the running user; production runs as appuser on
      a read-only root filesystem (readOnlyRootFilesystem), so the cache is not
      even persistent. Re-evaluate at expiry: if a pip release has shipped
      msgpack 1.2.1, drop this entry and raise the Dockerfile's pip floor.
    expired_at: 2026-10-29
  - id: CVE-2025-47273
    statement: >-
      Path traversal in setuptools' PackageIndex, reported against 70.3.0 and
      fixed in 78.1.1. There is nothing to upgrade, because setuptools 70.3.0
      is NOT INSTALLED: it appears only as a component of pip's vendored SBOM.
      pip lists it in _vendor/vendor.txt and bom.cdx.json as a build-time
      requirement, but ships no code for it — verified on the image,
      pip/_vendor/setuptools does not exist, and the base image has no
      setuptools module at all. The only real setuptools in this image is the
      one the Dockerfile installs into /install (>=83.0.0, well above the
      78.1.1 fix), which Trivy reports separately from its own dist-info and
      which is clean. So this is a scanner artifact of pip's SBOM, not an
      accepted risk — but it is kept on the same expiry as the entry above so
      both get re-checked together rather than decaying into a permanent mute.
      Re-evaluate at expiry by confirming pip still ships no setuptools code.
    expired_at: 2026-10-29
  - id: CVE-2026-59890
    statement: >-
      The SECOND advisory against the same phantom setuptools 70.3.0, and the
      reason this shape of entry will keep recurring: a MANIFEST.in exclusion
      bypass in sdist via an NFC/NFD Unicode normalization collision on macOS
      APFS/HFS+ (GHSA-h35f-9h28-mq5c), fixed in 83.0.0. Everything said for
      CVE-2025-47273 above applies unchanged — the version comes from pip's
      vendored SBOM, pip/_vendor/setuptools does not exist, and the only real
      setuptools in the image is the one the Dockerfile installs into /install
      at >=83.0.0, which is exactly at this advisory's fixed version. The
      advisory is also about building an sdist on macOS, which this Linux image
      does not do.
      Kept per-CVE rather than muting the package, deliberately: a
      setuptools-wide mute would also hide findings against that real 83.0.0
      copy, which is the one that could actually hurt. If a third phantom CVE
      shows up, revisit the SHAPE of the exception rather than adding a fourth
      — the honest fix would be Trivy learning that a vendored SBOM entry with
      no code on disk is not an installed package.
    expired_at: 2026-10-29

# ==================================================================
# Secret-scanner exceptions
# ==================================================================
# Different in kind from the CVE entries above, which are accepted RISK and
# therefore carry an expiry so they get re-argued. These are synthetic attack
# payloads: strings that exist precisely because a scanner-shaped secret is the
# input under test. There is nothing to fix and nothing to re-argue, so no
# `expired_at` — but the scope is kept as tight as the tool allows, one rule id
# pinned to one path, so a real credential of the same shape anywhere else in
# the tree still fails the scan. (gitleaks triages the same class of finding in
# .gitleaksignore, where entries are commit-scoped for the same reason.)
secrets:
  - id: github-pat
    paths:
      - evals/red_team/injection_variants.yaml
    statement: >-
      Red-team eval corpus. The case `out_github_token` feeds a token-shaped
      string to the OUTPUT guard and asserts it comes back redacted
      (`expect: redacted`), so the corpus cannot hold anything but a
      credential-looking literal. The value is a sequential-alphabet
      placeholder (ghp_ABCDEFGHIJ...123456), never an issued token, and the file
      is a fixture read by scripts/run_red_team_evals.py — it is not shipped in
      the wheel and grants access to nothing.
