id: baselithbot
entry_point: plugin:BaselithbotPlugin
name: baselithbot
version: 1.0.2
description: Autonomous multi-channel agent with OpenClaw-style skills, stealth browsing,
  desktop control, canvas (A2UI), voice, cron scheduling and secret-managed model
  routing. Composes browser-agent, vision, and MCP subsystems.
author: BaselithCore Team
repository: https://github.com/baselithcore/plugin-baselithbot
homepage: https://docs.baselithcore.xyz/plugins/baselithbot
license: AGPL-3.0-only
readiness: stable
icon: assets/logobg-baselithbot500.png
category: agent
min_core_version: 0.7.0
tags:
- browser
- automation
- openclaw
- stealth
- playwright
- agent
- computer-use
- desktop-control
- multi-channel
- voice
- canvas
- a2ui
- sessions
- sandbox
- tailscale
- skills
- mcp
- cron
required_resources:
- llm
- internet
optional_resources:
- storage
- docker
- tailscale
- postgres
- redis
python_dependencies:
- playwright>=1.45.0
- playwright-stealth>=1.0.6
- pyautogui>=0.9.54
- mss>=9.0.1
- Pillow>=10.0.0
- httpx>=0.27.0
- psutil>=5.9.0
- cryptography>=42.0.0
plugin_dependencies:
  browser_agent: '>=0.1.0'
# Declared capabilities. Browsing, webhooks and MCP all target URLs the
# operator or the model supplies, so the honest egress declaration is "any
# host" — that is still information: it says this plugin is an outbound one,
# unlike api-routers or goals. The secrets are the webhook-signing and
# replay-encryption keys it verifies inbound requests with.
# See mkdocs-site/docs/plugins/packaging.md#permissions.
permissions:
  network:
    egress:
    - '*'
  tools:
  - '*'
  secrets:
  - BASELITHBOT_INBOUND_GENERIC_SECRET
  - BASELITHBOT_REPLAY_ENCRYPTION_KEY
  - DISCORD_PUBLIC_KEY
  - SLACK_SIGNING_SECRET
  - TELEGRAM_WEBHOOK_SECRET
  filesystem:
  - configs/plugins.yaml
integrity_sha256: 01b2d0dc80417f9028ddc6417972b37f5ff784d45dce083c8816cc355cd01fa9
