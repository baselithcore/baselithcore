name: api-routers
version: 0.3.1
description: Opt-in HTTP routers mounted through the plugin contract - prompt catalog,
  WebSocket chat, async runs, and feature-gated webhooks, privacy (DSR), compliance,
  approvals and run controls. The core chat and admin routers are mounted by the app
  factory.
author: Baselith
tags:
- api
- routers
- fastapi
category: infrastructure
# Declared capabilities. This plugin mounts HTTP routers; it makes no outbound
# request, registers no tool and reads no credential of its own.
# See mkdocs-site/docs/plugins/packaging.md#permissions.
permissions:
  network:
    egress: []
  tools: []
  secrets: []
  filesystem: []
integrity_sha256: 1ed4f0f919e2331aa73e9b0af72b66559b78681803b3f86f2666b80009fcb81a
hash_surface_version: 5
