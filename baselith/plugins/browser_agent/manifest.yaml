name: browser_agent
version: 0.2.1
description: Browser automation and MCP browser tools powered by Playwright and VisionService
author: Baselith
tags:
- browser
- automation
- playwright
- mcp
category: ai
python_dependencies:
- playwright>=1.45.0
required_resources:
- llm
optional_resources:
- internet
# Declared capabilities. A browser navigates wherever it is pointed, so the
# egress set cannot be narrowed without breaking the plugin; the SSRF guard
# (loopback, private and link-local targets) still applies underneath.
# See mkdocs-site/docs/plugins/packaging.md#permissions.
permissions:
  network:
    egress:
    - '*'
  tools:
  - '*'
  secrets: []
  filesystem: []
integrity_sha256: 1a14f5bf1ca3ac9a37d9801837ee637e4b4f0ac06801e76250d60fc8d412ef76
hash_surface_version: 5
