
# json-file logs grow without bound by default: a chatty worker or a flood of
# edge 429s fills the host disk and takes every container with it. Rotated
# per service (50MB each), referenced below so no service can be added
# without it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Main service: API Backend
  api:
    build:
      # One Dockerfile for every environment (the `Dockerfile-slim` /
      # `Dockerfile-full` pair is gone): multi-stage, so the compiler
      # toolchain stays in the build stage and never ships.
      context: .
    container_name: baselith-core-api
    env_file: configs/.env.production
    environment:
      - APP_ENV=production
      - ENVIRONMENT=production
      - LOG_JSON=true
      - HOST=0.0.0.0
      - PORT=8000
      - DOCKER_HOST=tcp://${SANDBOX_DOCKER_HOST:?SANDBOX_DOCKER_HOST must be set}
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client
      - TELEMETRY_OTEL_ENDPOINT=http://jaeger:4317
      - SENTRY_DSN=${SENTRY_DSN}
      # uvicorn trusts X-Forwarded-For / -Proto only from these peers. The
      # image default (127.0.0.1) never matches the nginx gateway, whose
      # address on app_net is dynamic — so every request looked like it came
      # from the proxy and the per-IP rate limits, the failed-auth throttle
      # and the admin lockout all shared ONE bucket. The gateway gets a fixed
      # address (GATEWAY_IP, on the pinned app_net subnet below) and ONLY that
      # address is trusted: trusting the whole subnet let any other container
      # on app_net forge a client address or claim https.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-${GATEWAY_IP:-172.28.0.10}}
    volumes:
      - ${SANDBOX_CERTS_DIR:-./deploy/sandbox/client-certs}:/certs/client:ro
      - ./data:/app/data
      # The root filesystem is read-only below, as in the Helm chart. The
      # bundled baselithbot plugin keeps its secret-store master key, replay
      # database and workspace registry under its own directory; a named
      # volume shared with the worker, so both processes read ONE key (two
      # keys would decrypt nothing of each other's) and it survives a
      # re-pull. Any other plugin that writes under /app needs the same.
      - plugin_state:/app/plugins/baselithbot/.state
    networks:
      - app_net
      - obs_net
    # Health conditions, not a bare list: the plain form only waits for the
    # container to be *created*, so the API could start against a Postgres
    # still running initdb and take its first requests with a dead pool. The
    # worker already gated on health; the api did not.
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    init: true
    # Same posture as the Helm chart (readOnlyRootFilesystem, every
    # capability dropped): the image tree cannot be rewritten by the process
    # that runs it. Writable paths are listed explicitly — /tmp, the data
    # volume and the plugin state volume above; `baselith plugin enable`
    # (which rewrites configs/plugins.yaml) is a deploy-time change here, as
    # it is in Kubernetes.
    read_only: true
    # Tasks (processes AND threads) the cgroup may hold. Chromium, launched by
    # the browser agent, forks liberally; a fork bomb from a tool result or a
    # runaway thread pool is contained at this ceiling instead of at the host's.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          # Tasks (processes AND threads) the cgroup may hold — `pids_limit`
          # in Compose's own spelling, which it refuses next to a `deploy`
          # block. Chromium, launched by the browser agent, forks liberally;
          # a fork bomb from a tool result or a runaway thread pool is
          # contained here instead of at the host's limit. Every service
          # below carries one.
          pids: 1024
          cpus: '1.0'
          memory: 1G
    healthcheck:
      # No curl in the runtime stage (and pulling one in only for the probe
      # would widen the image): probe with the interpreter already there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Same budget as the image HEALTHCHECK (Dockerfile): the boot imports
      # torch, loads the cached embedder and reranker, runs the plugin loader
      # and opens the pools, and on the 1-CPU limit above that regularly
      # outlasts the 150s this used to say — the container was flagged
      # unhealthy mid-boot. The first success ends the period early, and
      # start_interval polls every 5s meanwhile so a fast boot is not held
      # to the 30s tick (Docker >= 25; ignored by older daemons).
      start_period: 300s
      start_interval: 5s

  # Cache and Message Queue
  # Graph Database and Cache (Redis compatible)
  falkordb:
    # Pinned: a `latest` re-pull silently changes the data plane.
    image: falkordb/falkordb:v4.20.4
    container_name: baselith-falkordb
    # REDIS_PASSWORD is REQUIRED here, like DB_PASSWORD: without it any
    # container on app_net (and any host process via the loopback publish)
    # had full RW access to the cache, the job queue (pickled RQ jobs — code
    # execution in the worker), the graph and the rate-limit counters.
    # configs/.env.production builds CACHE_REDIS_URL / QUEUE_REDIS_URL /
    # GRAPH_DB_URL from the same variable, so the app and the server cannot
    # disagree. It is embedded in a URL: use a URL-safe value
    # (`openssl rand -hex 32`), or percent-encode it.
    # Passed via REDIS_ARGS (not a command override) so the image's default
    # entrypoint keeps loading the FalkorDB graph module.
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      # redis-cli reads REDISCLI_AUTH, so the healthcheck authenticates
      # without putting the password on its command line (visible in `ps`).
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    # Publish to host loopback so a natively-deployed app (running on the host,
    # not in a container) can reach the cache/graph at 127.0.0.1. Bound to
    # 127.0.0.1 only — not exposed on any external interface. Harmless for the
    # all-in-container deployment (services still talk over app_net).
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - falkordb_data:/data
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          pids: 256
          cpus: '0.8'
          memory: 1G
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  # Relational Database
  postgres:
    # Same image as compose.yaml, deliberately. This was `postgres:16-alpine`
    # while the single-host stack ran `pgvector/pgvector:pg16`, so production
    # ran a different Postgres build from the one everything was developed
    # against, AND the documented optional backend
    # `VECTORSTORE_PROVIDER=pgvector` could not work here at all — the
    # extension simply was not in the image. pgvector/pgvector:pg16 is the
    # official postgres:16 plus that extension, nothing else.
    #
    # ⚠️ MIGRATING AN EXISTING VOLUME: alpine links musl, this image links
    # glibc, and the two sort text differently. The data files are compatible
    # (same major version), but every index on a text column is ordered by the
    # old collation and must be rebuilt, or lookups silently miss rows:
    #     docker compose -f compose.prod.yaml up -d postgres
    #     docker compose -f compose.prod.yaml exec postgres \
    #       psql -U baselithcore -d baselithcore -c 'REINDEX DATABASE baselithcore;'
    # A fresh deployment needs none of this.
    image: pgvector/pgvector:pg16
    # Publish to host loopback so a natively-deployed app (running on the host,
    # not in a container) can reach Postgres at 127.0.0.1. Bound to 127.0.0.1
    # only — not exposed on any external interface. Harmless for the
    # all-in-container deployment (services still talk over app_net).
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-baselithcore}
      - POSTGRES_USER=${DB_USER:-baselithcore}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    # One backend process per connection (DB_POOL_MAX_SIZE x api/worker
    # instances) plus the checkpointer, walwriter and friends; 512 leaves room
    # for max_connections=100 and never for a fork bomb.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # `cap_drop: ALL` alone does not work for this image: its entrypoint starts
    # as root, prepares (and chowns) the data directory, then drops to the
    # `postgres` user via gosu. Without these five, first boot fails in initdb
    # and the container restart-loops — the hardening looks applied while the
    # database never comes up. This is the minimal set for that sequence; the
    # dangerous ones (SYS_ADMIN, NET_RAW, SYS_PTRACE …) stay dropped.
    cap_add:
      - CHOWN           # chown the PGDATA volume on first boot
      - DAC_OVERRIDE    # read/write it before the ownership change lands
      - FOWNER          # chmod 0700 PGDATA as required by initdb
      - SETGID          # gosu: drop to the postgres group
      - SETUID          # gosu: drop to the postgres user
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          pids: 512
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d ${DB_NAME:-baselithcore} -U ${DB_USER:-baselithcore}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Vector Store
  # Absent until now, which left this stack with NO reachable vector store:
  # VectorStoreConfig defaults to provider "qdrant", configs/.env.production
  # pointed VECTORSTORE_QDRANT_HOST at `localhost` (inside the api container,
  # where nothing listens), and the pgvector alternative was unavailable
  # because of the Postgres image above. Nothing failed at boot — the store is
  # resolved lazily — so retrieval and long-term memory broke at request time,
  # on a stack whose whole point is that everything else is bundled.
  #
  # Point QDRANT_HOST at a managed instance to use one instead; this service
  # is then surplus and can be left out of `up` by naming the others.
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: baselith-qdrant
    # REQUIRED API key: Qdrant ships with no authentication, so any container
    # on app_net could read, overwrite or drop every collection (the RAG
    # corpus and long-term memory). The app sends the same value as
    # QDRANT_API_KEY (configs/.env.production). Without TLS the key crosses
    # app_net in clear — acceptable on this private bridge; set QDRANT_HTTPS
    # and a TLS-enabled instance for anything that leaves the host.
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
    # Loopback only, like the other stores: reachable from app_net by service
    # name, published on the host purely for operator tooling.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          pids: 512
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # The qdrant image ships no curl/wget; a bash TCP connect to the REST
      # port is the standard liveness probe for it.
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/6333" 2>/dev/null']
      interval: 10s
      timeout: 5s
      retries: 5

  # Worker for Async Tasks
  worker:
    build:
      context: .
    container_name: baselith-core-worker
    env_file: configs/.env.production
    command: python -m core.task_queue.worker
    environment:
      - APP_ENV=production
      - ENVIRONMENT=production
      - LOG_JSON=true
      - DOCKER_HOST=tcp://${SANDBOX_DOCKER_HOST:?SANDBOX_DOCKER_HOST must be set}
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client
      - TELEMETRY_OTEL_ENDPOINT=http://jaeger:4317
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - ${SANDBOX_CERTS_DIR:-./deploy/sandbox/client-certs}:/certs/client:ro
      - ./data:/app/data
      - plugin_state:/app/plugins/baselithbot/.state   # shared with api, see there
    networks:
      - app_net
      - obs_net
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    # The image HEALTHCHECK probes http://localhost:8000/health, which this
    # process never serves (it is an RQ consumer, not uvicorn): inherited, it
    # flagged the worker `unhealthy` 300s after every start, and a stack
    # where one container is always red teaches operators to ignore the
    # column. Disabled rather than replaced — an RQ heartbeat check needs the
    # queue Redis URL, which the Helm chart leaves to the operator for the
    # same reason (worker.livenessProbe).
    healthcheck:
      disable: true
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          pids: 1024
          cpus: '0.8'
          memory: 1G

  # Reverse Proxy
  gateway:
    # Pinned like the data-plane images: a floating `alpine` re-pull would
    # silently change the edge (TLS/HTTP behaviour, module set). Bump
    # deliberately, together with a re-run of `nginx -t` on nginx.conf.
    image: nginx:1.31.5-alpine
    container_name: baselith-gateway
    # IPv4 only, on purpose. A bare "80:80" also binds [::]:80, and on a
    # dual-stack host IPv6 clients reach nginx through docker-proxy with the
    # bridge gateway as their source address: every IPv6 client then shared
    # ONE rate-limit bucket (and, until it was removed, passed the private-
    # range allow-list on /metrics). Put a real IPv6 listener in front, or
    # run the daemon with userland-proxy off, before publishing on [::].
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/errors:/usr/share/nginx/errors:ro
    networks:
      app_net:
        # Fixed so the api service can trust exactly this peer
        # (FORWARDED_ALLOW_IPS). Must lie inside APP_NET_SUBNET — change the
        # two together.
        ipv4_address: ${GATEWAY_IP:-172.28.0.10}
    depends_on:
      - api
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NET_BIND_SERVICE alone is not enough: the master process starts as root
    # and `user nginx;` (deploy/nginx/nginx.conf) makes it fork its workers as
    # an unprivileged user, which needs SETUID/SETGID. Without them nginx exits
    # at startup with "setgid(101) failed (1: Operation not permitted)".
    cap_add:
      - NET_BIND_SERVICE  # bind :80 as a non-root worker
      - SETGID            # master -> worker privilege drop
      - SETUID
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp:size=32m,noexec,nosuid
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          pids: 128
          cpus: '0.5'
          memory: 256M
    healthcheck:
      # The gateway's own liveness (deploy/nginx/nginx.conf serves 204 on
      # this path itself); a proxied /health would report the backend and
      # flag nginx unhealthy during every api restart. busybox wget ships in
      # the alpine image.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/__gateway/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # === Inference services (optional; `--profile inference`) ===
  # Hugging Face Text Embeddings Inference, one server per model, mirroring
  # `inference.tei` of the Helm chart: configs/.env.production points
  # BASELITH_EMBEDDING_URL / BASELITH_RERANK_URL at these two by default, so
  # the api and worker load no model themselves. Without the profile those
  # URLs resolve to nothing and the first embedding call fails — point them
  # at your own servers instead. CPU image, linux/amd64 only; sized from the
  # same measurements as the chart (bge-m3 holds 6.7Gi at
  # --max-batch-tokens 4096, the reranker 3.9Gi). No token between the api
  # and these servers: app_net is a private bridge. The client sends a bearer
  # over plain HTTP only to loopback or single-label/cluster-internal hosts
  # (like tei-embed); anything that leaves the host needs TLS.
  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    container_name: baselith-tei-embed
    profiles: ["inference"]
    command: ["--model-id", "BAAI/bge-m3", "--port", "8080", "--max-batch-tokens", "4096"]
    environment:
      - HF_HOME=/data
      - HUGGINGFACE_HUB_CACHE=/data
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - tei_embed_models:/data
    networks:
      - app_net
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          pids: 512
          memory: 9G

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    container_name: baselith-tei-rerank
    profiles: ["inference"]
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--port", "8080"]
    environment:
      - HF_HOME=/data
      - HUGGINGFACE_HUB_CACHE=/data
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - tei_rerank_models:/data
    networks:
      - app_net
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          pids: 512
          memory: 6G

  # === Observability Stack ===
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: baselith-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - obs_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          pids: 256
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.5.5
    container_name: baselith-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./deploy/prometheus/slo-rules.yml:/etc/prometheus/slo-rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app_net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          pids: 256
    restart: unless-stopped
    logging: *logging

volumes:
  falkordb_data:
  postgres_data:
  qdrant_data:
  prometheus_data:
  plugin_state:
  tei_embed_models:
  tei_rerank_models:

networks:
  app_net:
    # Fixed subnet so the gateway can hold a fixed address (GATEWAY_IP) that
    # FORWARDED_ALLOW_IPS (api service above) trusts. Override APP_NET_SUBNET
    # if it collides with an existing network on the host, and move
    # GATEWAY_IP into the new subnet with it.
    ipam:
      config:
        - subnet: ${APP_NET_SUBNET:-172.28.0.0/24}
  obs_net:
