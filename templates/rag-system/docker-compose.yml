---
# Local services for development: `docker compose up -d`.
# Ports are published on loopback only.
services:
  # Vector store (VECTORSTORE_QDRANT_HOST / VECTORSTORE_PORT in .env)
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - '127.0.0.1:6333:6333'
      - '127.0.0.1:6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage

  # Redis protocol: embedding/search cache (CACHE_REDIS_URL in .env)
  redis:
    image: falkordb/falkordb:v4.20.4
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data

volumes:
  qdrant_data:
  redis_data:
