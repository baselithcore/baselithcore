# Local services for development: `docker compose up -d`.
# Credentials come from .env (DB_USER / DB_PASSWORD / DB_NAME), which
# `baselith init` generated for this project.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-baselithcore}
      POSTGRES_USER: ${DB_USER:-baselithcore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis protocol (cache, queue) plus the graph module GRAPH_DB_URL uses.
  redis:
    image: falkordb/falkordb:v4.20.4
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - '127.0.0.1:6333:6333'
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
