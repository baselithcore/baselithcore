  /v1/health:
    get:
      description: 'Liveness probe — process is up. Cheap, no dependency checks, no
        auth.


        Use for Kubernetes ``livenessProbe``: it must only fail if the process is

        wedged, never because a downstream dependency is unavailable (that is the

        readiness probe''s job). ``async def`` on purpose: a sync handler would

        dispatch every probe through the anyio threadpool to return a literal.'
      operationId: health_check_v1_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Health Check V1 Health Get
                type: object
          description: Successful Response
      summary: Health Check
      tags:
      - status
  /v1/health/ready:
    get:
      description: 'Readiness probe — checks critical dependencies (no auth).


        Returns HTTP 503 when the database is unreachable so Kubernetes removes the

        pod from Service endpoints (traffic draining) until it recovers. Redis is

        reported but advisory: the framework degrades to in-memory fallbacks, so it

        does not gate readiness. Results are cached (~30s) to bound probe overhead.'
      operationId: readiness_v1_health_ready_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Readiness V1 Health Ready Get
                type: object
          description: Successful Response
        '503':
          description: 'Not ready: the database is unreachable; the pod should be
            removed from Service endpoints until it recovers.'
      summary: Readiness
      tags:
      - status
