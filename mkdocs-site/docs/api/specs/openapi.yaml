components:
  schemas:
    ApprovalDecision:
      description: Reviewer decision payload for a paused run.
      properties:
        approved:
          title: Approved
          type: boolean
        approver:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Approver
        reason:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Reason
      required:
      - approved
      title: ApprovalDecision
      type: object
    AsyncRunRequest:
      description: Submission payload for an async agent run.
      properties:
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
        query:
          maxLength: 8000
          minLength: 1
          title: Query
          type: string
      required:
      - query
      title: AsyncRunRequest
      type: object
    ChatRequest:
      additionalProperties: false
      description: 'Request model for the agent.

        Contains the user query and, optionally, the conversation_id.

        The `stream` flag is accepted for compatibility, but the dedicated

        streaming endpoint is `/chat/stream`.'
      properties:
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
        kb_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Kb Label
        max_response_tokens:
          anyOf:
          - maximum: 16000.0
            minimum: 1.0
            type: integer
          - type: 'null'
          description: Upper bound on response tokens. Hard-capped at 16000 to prevent
            unbounded streams.
          title: Max Response Tokens
        query:
          maxLength: 8000
          minLength: 1
          title: Query
          type: string
        rag_only:
          default: false
          title: Rag Only
          type: boolean
        stream:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Stream
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      required:
      - query
      title: ChatRequest
      type: object
    CreateTenantRequest:
      description: Payload for creating a new tenant.
      properties:
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
      required:
      - id
      - name
      title: CreateTenantRequest
      type: object
    CreateWebhookRequest:
      description: Payload to register a webhook endpoint.
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        event_types:
          description: Event types to subscribe to; ['*'] for all
          items:
            type: string
          title: Event Types
          type: array
        headers:
          additionalProperties:
            type: string
          title: Headers
          type: object
        url:
          description: HTTPS endpoint that will receive events
          title: Url
          type: string
      required:
      - url
      title: CreateWebhookRequest
      type: object
    CreateWebhookResponse:
      description: Registration result. The signing ``secret`` is returned only once.
      properties:
        endpoint:
          additionalProperties: true
          title: Endpoint
          type: object
        secret:
          title: Secret
          type: string
      required:
      - endpoint
      - secret
      title: CreateWebhookResponse
      type: object
    DraftInstructionsRequest:
      description: Draft Art. 13 instructions from the records already on file.
      properties:
        monitoring_plan_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Monitoring Plan Id
        provider_contact:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Contact
        risk_file_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Risk File Id
        system_id:
          minLength: 1
          title: System Id
          type: string
      required:
      - system_id
      title: DraftInstructionsRequest
      type: object
    ForkRequest:
      description: Fork a run from the state recorded at ``version``.
      properties:
        new_run_id:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: New Run Id
        version:
          minimum: 1.0
          title: Version
          type: integer
      required:
      - version
      title: ForkRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LabelIn:
      description: Payload for promoting a label to a version.
      properties:
        version:
          maxLength: 100
          minLength: 1
          title: Version
          type: string
      required:
      - version
      title: LabelIn
      type: object
    LifecycleRequest:
      description: Move a registered system to a new lifecycle stage.
      properties:
        stage:
          minLength: 1
          title: Stage
          type: string
      required:
      - stage
      title: LifecycleRequest
      type: object
    ObservationRequest:
      description: A production measurement against a post-market monitoring plan.
      properties:
        context:
          additionalProperties: true
          title: Context
          type: object
        metric:
          minLength: 1
          title: Metric
          type: string
        value:
          title: Value
          type: number
      required:
      - metric
      - value
      title: ObservationRequest
      type: object
    PluginActionResponse:
      description: Response for plugin actions.
      properties:
        message:
          title: Message
          type: string
        plugin_name:
          title: Plugin Name
          type: string
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        success:
          title: Success
          type: boolean
      required:
      - success
      - message
      - plugin_name
      title: PluginActionResponse
      type: object
    PluginEnableRequest:
      description: Request to enable a plugin.
      properties:
        config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Optional plugin configuration
          title: Config
      title: PluginEnableRequest
      type: object
    PluginListResponse:
      description: Response for plugin listing.
      properties:
        active:
          title: Active
          type: integer
        disabled:
          title: Disabled
          type: integer
        failed:
          title: Failed
          type: integer
        plugins:
          items:
            additionalProperties: true
            type: object
          title: Plugins
          type: array
        total:
          title: Total
          type: integer
      required:
      - plugins
      - total
      - active
      - disabled
      - failed
      title: PluginListResponse
      type: object
    PluginReloadRequest:
      description: Request to reload a plugin.
      properties:
        config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Optional new configuration
          title: Config
      title: PluginReloadRequest
      type: object
    PluginStatusResponse:
      description: Response for plugin status.
      properties:
        dependency_graph:
          additionalProperties:
            items:
              type: string
            type: array
          title: Dependency Graph
          type: object
        lifecycle:
          additionalProperties: true
          title: Lifecycle
          type: object
      required:
      - lifecycle
      - dependency_graph
      title: PluginStatusResponse
      type: object
    PromptVersionIn:
      description: Payload for registering one prompt version.
      properties:
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Description
        labels:
          items:
            type: string
          title: Labels
          type: array
        template:
          maxLength: 200000
          minLength: 1
          title: Template
          type: string
        variables:
          items:
            type: string
          title: Variables
          type: array
        version:
          maxLength: 100
          minLength: 1
          title: Version
          type: string
      required:
      - version
      - template
      title: PromptVersionIn
      type: object
    PublishRequest:
      description: Body for ``POST /api/backstage/publish``.
      properties:
        admin_key:
          anyOf:
          - format: password
            type: string
            writeOnly: true
          - type: 'null'
          description: Legacy admin API key.
          title: Admin Key
        auth_token:
          anyOf:
          - format: password
            type: string
            writeOnly: true
          - type: 'null'
          description: 'Pre-issued JWT session token for the marketplace hub. Preferred:
            use ``github_token`` instead so the marketplace hub owns the exchange
            flow.'
          title: Auth Token
        github_token:
          anyOf:
          - format: password
            type: string
            writeOnly: true
          - type: 'null'
          description: GitHub OAuth access token for the submitting user. The framework
            exchanges it against the marketplace's ``/auth/github/exchange`` endpoint
            to obtain a JWT, matching the browser login flow (``/auth/login/github``).
            Typically forwarded by the Backstage Scaffolder via ``${{ secrets.USER_OAUTH_TOKEN
            }}``.
          title: Github Token
        plugin_path:
          description: Absolute path (on the framework host) to the plugin directory
            to zip and submit. Typically mounted from the Backstage Scaffolder workspace.
          maxLength: 4096
          minLength: 1
          title: Plugin Path
          type: string
        registry_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Deprecated and ignored. Both the token exchange and the submission
            always target the framework's OFFICIAL_MARKETPLACE_URL; accepting a caller-supplied
            hub URL would let a job-role key redirect the forwarded GitHub token (SSRF
            / credential exfiltration).
          title: Registry Url
      required:
      - plugin_path
      title: PublishRequest
      type: object
    RegisterSystemRequest:
      description: Declare an AI system for the registry.
      properties:
        annex_i_product:
          default: false
          title: Annex I Product
          type: boolean
        annex_iii_areas:
          items:
            type: string
          title: Annex Iii Areas
          type: array
        art6_derogations:
          items:
            type: string
          title: Art6 Derogations
          type: array
        deployers:
          items:
            type: string
          title: Deployers
          type: array
        description:
          default: ''
          title: Description
          type: string
        generates_synthetic_content:
          default: false
          title: Generates Synthetic Content
          type: boolean
        gpai_systemic_risk:
          default: false
          title: Gpai Systemic Risk
          type: boolean
        human_oversight_contacts:
          items:
            type: string
          title: Human Oversight Contacts
          type: array
        intended_purpose:
          default: ''
          title: Intended Purpose
          type: string
        interacts_with_humans:
          default: false
          title: Interacts With Humans
          type: boolean
        is_gpai_model:
          default: false
          title: Is Gpai Model
          type: boolean
        member_states:
          items:
            type: string
          title: Member States
          type: array
        models:
          items:
            type: string
          title: Models
          type: array
        name:
          minLength: 1
          title: Name
          type: string
        performs_profiling:
          default: false
          title: Performs Profiling
          type: boolean
        prohibited_practices:
          items:
            type: string
          title: Prohibited Practices
          type: array
        provider_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Name
        role:
          default: provider
          title: Role
          type: string
        version:
          default: 0.0.0
          title: Version
          type: string
      required:
      - name
      title: RegisterSystemRequest
      type: object
    RetentionRequest:
      description: Retention sweep horizon.
      properties:
        older_than_days:
          minimum: 0.0
          title: Older Than Days
          type: integer
      required:
      - older_than_days
      title: RetentionRequest
      type: object
    SubjectRequest:
      description: Identify the data subject for an export or erasure.
      properties:
        subject_id:
          minLength: 1
          title: Subject Id
          type: string
      required:
      - subject_id
      title: SubjectRequest
      type: object
    Tenant:
      description: "Data model representing a system tenant.\n\nAttributes:\n    id:\
        \ Unique tenant identifier (slug).\n    name: Human-readable display name.\n\
        \    status: Operational status (active, suspended, etc.).\n    created_at:\
        \ ISO timestamp of creation."
      properties:
        created_at:
          title: Created At
          type: string
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        status:
          title: Status
          type: string
      required:
      - id
      - name
      - status
      - created_at
      title: Tenant
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: Operator-minted key from API_KEYS_USER / _ADMIN / _JOB / _SCOPED.
      in: header
      name: X-API-Key
      type: apiKey
    BearerAuth:
      bearerFormat: JWT
      description: Access token issued by core.auth (AuthManager.create_token).
      scheme: bearer
      type: http
    HTTPBasic:
      scheme: basic
      type: http
info:
  title: Baselith-Core
  version: 0.31.0
openapi: 3.1.0
paths:
  /.well-known/agent.json:
    get:
      description: Standard A2A agent-card discovery endpoint.
      operationId: wellknown_agent_card__well_known_agent_json_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Wellknown Agent Card  Well Known Agent Json Get
                type: object
          description: Successful Response
      summary: Wellknown Agent Card
      tags:
      - A2A Discovery
  /a2a/agent-card:
    get:
      description: Alias for the agent card under the /a2a prefix.
      operationId: agent_card_alias_a2a_agent_card_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Agent Card Alias A2A Agent Card Get
                type: object
          description: Successful Response
      summary: Agent Card Alias
      tags:
      - A2A Discovery
  /admin:
    get:
      description: Restituisce la pagina Admin (protetta da Basic Auth).
      operationId: admin_page_admin_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - HTTPBasic: []
      summary: Admin Page
      tags:
      - admin
  /admin/data:
    get:
      description: 'Returns analytics/feedback data in JSON format (protected by Basic
        Auth).

        - Aggregated totals (positive, negative, percentages)

        - Daily time series

        - Recent feedback with metadata and sources

        - Most cited queries and documents in the selected period'
      operationId: admin_data_admin_data_get
      parameters:
      - description: Time window (in days) to consider for analytics. Use values >0.
        in: query
        name: days
        required: false
        schema:
          anyOf:
          - maximum: 365
            minimum: 1
            type: integer
          - type: 'null'
          default: 30
          description: Time window (in days) to consider for analytics. Use values
            >0.
          title: Days
      - description: Number of recent feedbacks to return.
        in: query
        name: recent_limit
        required: false
        schema:
          default: 20
          description: Number of recent feedbacks to return.
          maximum: 100
          minimum: 1
          title: Recent Limit
          type: integer
      - description: Maximum number of entries for popular queries/documents.
        in: query
        name: top_limit
        required: false
        schema:
          default: 10
          description: Maximum number of entries for popular queries/documents.
          maximum: 50
          minimum: 1
          title: Top Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBasic: []
      summary: Admin Data
      tags:
      - admin
  /admin/dlq:
    delete:
      description: Clear the entire dead-letter queue (Basic Auth).
      operationId: dlq_purge_all_admin_dlq_delete
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - HTTPBasic: []
      summary: Dlq Purge All
      tags:
      - admin
    get:
      description: List dead-lettered jobs, most-recently-failed first (Basic Auth).
      operationId: dlq_list_admin_dlq_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBasic: []
      summary: Dlq List
      tags:
      - admin
  /admin/dlq/{job_id}:
    delete:
      description: Drop a single dead-lettered job record (Basic Auth).
      operationId: dlq_purge_admin_dlq__job_id__delete
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBasic: []
      summary: Dlq Purge
      tags:
      - admin
    get:
      description: Return full detail (including traceback) for one dead-lettered
        job.
      operationId: dlq_get_admin_dlq__job_id__get
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBasic: []
      summary: Dlq Get
      tags:
      - admin
  /admin/dlq/{job_id}/replay:
    post:
      description: Re-enqueue a dead-lettered job onto its original queue (Basic Auth).
      operationId: dlq_replay_admin_dlq__job_id__replay_post
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBasic: []
      summary: Dlq Replay
      tags:
      - admin
  /admin/tenants:
    get:
      description: List tenants, newest first (paginated — the listing is never unbounded).
      operationId: list_tenants_admin_tenants_get
      parameters:
      - description: Page size
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Page size
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - description: Rows to skip
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Rows to skip
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Tenant'
                title: Response List Tenants Admin Tenants Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBasic: []
      summary: List Tenants
      tags:
      - admin
      - tenants
    post:
      description: Create a new tenant.
      operationId: create_tenant_admin_tenants_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBasic: []
      summary: Create Tenant
      tags:
      - admin
      - tenants
  /agent/async:
    post:
      description: Enqueue an agent run; returns the task id to poll (or subscribe).
      operationId: submit_async_run_agent_async_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncRunRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Submit Async Run Agent Async Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Submit Async Run
  /agent/status/{task_id}:
    get:
      description: Current TaskTracker record for the run (404 when unknown).
      operationId: async_run_status_agent_status__task_id__get
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          title: Task Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Async Run Status Agent Status  Task Id  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Async Run Status
  /api/backstage/entities:
    get:
      description: Returns the complete Backstage entity graph (System + Components
        + APIs) in the EntityProvider full-mutation format.  Poll this endpoint from
        a Backstage CustomEntityProvider or a scheduled sync job; it supports conditional
        requests via ETag / If-None-Match so an unchanged catalog costs a 304 instead
        of a full body.
      operationId: get_all_entities_api_backstage_entities_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Full Entity Provider payload
      tags:
      - Backstage Integration
  /api/backstage/entities/{plugin_name}:
    get:
      description: Returns the Backstage Component entity dict for one plugin.  The
        response body is valid YAML-serialisable content for a catalog-info.yaml file.
      operationId: get_entity_api_backstage_entities__plugin_name__get
      parameters:
      - in: path
        name: plugin_name
        required: true
        schema:
          title: Plugin Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Entity Api Backstage Entities  Plugin Name  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Single plugin catalog-info entity
      tags:
      - Backstage Integration
  /api/backstage/entities/{plugin_name}/patterns:
    get:
      description: Returns the Backstage label keys for all Agentic Design Patterns
        detected in the plugin's source code, manifest tags, and resource declarations.  Cached
        after first call; invalidated on hot-reload.
      operationId: get_plugin_patterns_api_backstage_entities__plugin_name__patterns_get
      parameters:
      - in: path
        name: plugin_name
        required: true
        schema:
          title: Plugin Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: string
                title: Response Get Plugin Patterns Api Backstage Entities  Plugin
                  Name  Patterns Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Detected Agentic Design Pattern labels
      tags:
      - Backstage Integration
  /api/backstage/health:
    get:
      description: Returns the operational status of the Backstage exporter.
      operationId: get_backstage_health_api_backstage_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
