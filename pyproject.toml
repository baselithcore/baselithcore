[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baselith-core"
dynamic = ["version"]
description = "A Modular Framework for Baselith-Core Orchestration featuring World Models (MCTS), Swarm, and Native MCP."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Gippo", email = "baselith.ai@gmail.com" }
]
license = "AGPL-3.0-only"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
keywords = ["ai", "agents", "framework"]

dependencies = [
  # Plugin-ecosystem surface: aiohttp, defusedxml, email-validator (pydantic
  # `EmailStr`), markdown-it-py, networkx and sse-starlette are consumed by
  # plugins, not by `core/` itself (core's own SSE path is hand-rolled in
  # core/middleware/optimization.py). Dropping one is a breaking change for
  # every plugin that installs `baselith-core` and expects it present — move it
  # into the owning plugin's extra first.
  "aiohttp>=3.9.0",
  "alembic>=1.13.0",
  "anthropic>=0.18.0",
  "argon2-cffi>=23.1.0",
  # Runtime, not test-only: core/security/encryption.py, core/tenancy/encryption.py,
  # and core/world_model/mandates.py (Ed25519) import it, as does the baselithbot
  # plugin (Fernet secret store).
  # >=50.0.0: CVE-2026-69247 (GHSA-g6cj-pr64-35w5) — PKCS#7 EnvelopedData
  # decryption leaked a Bleichenbacher oracle via distinguishable errors and
  # timing; present in 44.0.0–49.0.0, fixed in 50.0.0. Not reachable from this
  # codebase (we use Fernet/AESGCM/HKDF/Ed25519, never pkcs7_decrypt_*), but the
  # fix is free, so the floor moves rather than entering the accepted-risk register.
  "cryptography>=50.0.0",
  "defusedxml>=0.7.1,<1.0",
  "email-validator>=2.1.0",
  # >=0.140.13: earlier releases cap starlette<0.39, pinning consumers to
  # starlette 0.38.x — CVE-2024-47874, CVE-2026-48818, CVE-2026-54283, all
  # fixed in starlette 1.3.1 which only fastapi >=0.140 accepts.
  "fastapi>=0.140.13,<0.200",
  "fastapi-limiter<0.2.0,>=0.1.6",
  "httpx>=0.27.0,<1.0",
  "jsonschema>=4.23.0",
  "langchain-text-splitters>=1.1.0",
  "markdown-it-py>=3.0.0,<4.0",
  "networkx>=3.0",
  "numpy>=1.24.0",
  "ollama>=0.6.0,<1.0",
  "openai>=2.2.0",
  "opentelemetry-api>=1.21.0",
  "opentelemetry-exporter-otlp>=1.21.0",
  "opentelemetry-instrumentation-fastapi>=0.42b0",
  "opentelemetry-instrumentation-httpx>=0.42b0",
  "opentelemetry-instrumentation-redis>=0.42b0",
  "opentelemetry-sdk>=1.21.0",
  "orjson>=3.11.7,<4.0",
  "prometheus-client>=0.20.0,<1.0",
  "psycopg[binary,pool]>=3.2.1,<4.0",
  "pydantic-settings>=2.0.0",
  "PyJWT>=2.10.1,<3.0",
  # Direct, unguarded import in core/config/env.py, core/plugins/env.py,
  # core/plugins/loader.py and backend.py. It used to arrive only transitively
  # via pydantic-settings — declare it so a future pydantic-settings release
  # cannot break the boot path by dropping it.
  "python-dotenv>=1.0.0",
  # >=0.0.30: CVE-2026-42561 + CVE-2026-53539
  "python-multipart>=0.0.30",
  "PyYAML>=6.0",
  "redis[hiredis]>=5.0.7,<6.0",
  "rq>=1.15.0",
  "sentry-sdk[fastapi]>=2.0.0",
  "sse-starlette>=2.1.0",
  "structlog>=24.1.0",
  "uvicorn[standard]>=0.30.0,<1.0",
  "rich>=13.7.0",
  "rich-argparse>=1.4.0",
  "argcomplete>=3.2.0",
]

[project.urls]
Homepage = "https://github.com/baselithcore/baselithcore"
Repository = "https://github.com/baselithcore/baselithcore"
Documentation = "https://baselithcore.github.io/baselithcore"

[project.scripts]
baselith = "core.cli.__main__:main"

[project.optional-dependencies]
browser = [
  # >=1.62.0: the pin governs the *bundled browser engines*, which render
  # LLM/user-supplied URLs. 1.45.0 ships Chromium 127.0.6533.17, Firefox 127.0
  # and WebKit 17.4 (July 2024) — 24 Chromium majors of unpatched renderer
  # CVEs. 1.62.0 ships Chromium 151.0.7922.34, Firefox 153.0, WebKit 26.5.
  # A floor, not an exact pin: browser security fixes arrive as new playwright
  # releases, and an `==` here would block every one of them until we cut a
  # baselith-core release. Matches `plugins/baselithbot/pyproject.toml`.
  "playwright>=1.62.0",
]
documents = [
  # >=6.14.2: CVE-2026-59936 (DoS, crafted inline image) fixed in 6.14.1 and
  # CVE-2026-59935 (DoS, unterminated inline image) fixed in 6.14.2
  "pypdf>=6.14.2",
  "python-docx>=1.2.0,<2",
  # Floors, not `==`: these parse untrusted documents, so an exact pin blocks
  # any future upstream security release from reaching an install. No advisory
  # is currently open against either (checked via OSV) — the bump is off
  # 0.6.23 / 2.0.1 (2023-2024) and onto the current releases.
  # <2 on python-pptx: 1.0.0 was the first non-0.x release, cap the next major
  # like python-docx above.
  "python-pptx>=1.0.2,<2",
  "openpyxl==3.1.5",
  "xlrd>=2.0.2",
]
ocr = [
  # Floor rather than `==` for the same reason as the document parsers: this
  # rasterises untrusted PDFs and must be able to take upstream fixes.
  "pdf2image>=1.17.0",
  # 12.3.0: fixes a batch of HIGH-severity image/font parser flaws —
  # CVE-2026-54058/54059/54060 (McIdas AREA, PCF, font memory exhaustion),
  # CVE-2026-55379/55380 (BDF, GD 2.x), CVE-2026-59197/59199 (OOB write),
  # CVE-2026-59200 (PDF stream), CVE-2026-59204 (JPEG2000),
  # CVE-2026-59205 (ImageCms heap corruption)
  "Pillow==12.3.0",
  "pytesseract>=0.3.13",
]
mineru = [
  # Primary OCR backend (heavy: pulls torch/transformers/onnxruntime).
  # Pinned <4: we depend on the mineru.cli.common.do_parse API surface.
  "mineru[pipeline]>=3.4.4,<4",
]
web = [
  "beautifulsoup4>=4.14.2",
  # >=2.8.4: CVE-2026-49477 (ReDoS) + CVE-2026-49476 (memory exhaustion) in
  # the CSS selector parser, both fixed in 2.8.4
  "soupsieve>=2.8.4",
  # Keep in lockstep with the `browser` extra above (rationale documented there).
  "playwright>=1.62.0",
]
qdrant = [
  "qdrant-client>=1.15.1,<2.0",
]
rag = [
  "sentence-transformers==5.6.0",
]
nlp = [
  # Floor on the current 3.8.x patch (3.8.0 is from 2024) rather than `==`, so
  # the 3.8 patch stream stays reachable; <4 because spaCy 4 is a breaking
  # rewrite and `core/nlp/spacy_utils.py` targets the v3 pipeline API.
  "spacy>=3.8.15,<4",
]
gemini = [
  "google-genai>=1.16.0,<2.0",
]
# Exact token counting in `core/utils/tokens.py`. The import is guarded and
# falls back to a character-class heuristic, so this stays opt-in — install it
# when budget/cost accounting has to be exact rather than estimated.
tokenizer = [
  "tiktoken>=0.7.0",
]
# LLM-as-judge metrics in `core/evaluation/metrics.py` and
# `core/services/evaluation/service.py` (guarded import, gated on
# `evaluation_config.is_enabled`).
evaluation = [
  "deepeval>=2.0.0",
]
# Docker-backed code sandbox in `core/services/sandbox/` (guarded import; the
# service degrades to unavailable without it).
sandbox = [
  "docker>=7.0.0",
]
huggingface = [
  "huggingface-hub>=0.20.0",
  # >=5.3.0: CVE-2026-4372 (RCE) fixed in 5.3.0
  "transformers>=5.3.0",
  "accelerate>=0.25.0",
]
test = [
  "qdrant-client>=1.15.1,<2.0",
  "beautifulsoup4>=4.14.2",
  # >=2.8.4: CVE-2026-49477 (ReDoS) + CVE-2026-49476 (memory exhaustion) in
  # the CSS selector parser, both fixed in 2.8.4
  "soupsieve>=2.8.4",
  # >=6.14.2: CVE-2026-59936 (DoS, crafted inline image) fixed in 6.14.1 and
  # CVE-2026-59935 (DoS, unterminated inline image) fixed in 6.14.2
  "pypdf>=6.14.2",
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.21.0",
  # A hung async test must fail its own test, not stall the whole CI job.
  "pytest-timeout>=2.4.0",
  # Random test order every run: surfaces order-dependence that -n auto
  # otherwise hides until it flakes. Reproduce with -p randomly --randomly-seed=<seed>.
  "pytest-randomly>=4.1.0",
  # Property-based testing (core/resilience invariants).
  "hypothesis>=6.100",
  # Runtime OpenAPI conformance gate (tests/contracts).
  "schemathesis>=4.25",
]
# Load testing harness (tests/load/locustfile.py). Not needed for the unit
# suite — install to drive a running instance: `pip install -e ".[load]"`.
load = [
  "locust>=2.20.0",
]
dev = [
  "qdrant-client>=1.15.1,<2.0",
  "beautifulsoup4>=4.14.2",
  # >=2.8.4: CVE-2026-49477 (ReDoS) + CVE-2026-49476 (memory exhaustion) in
  # the CSS selector parser, both fixed in 2.8.4
  "soupsieve>=2.8.4",
  # >=6.14.2: CVE-2026-59936 (DoS, crafted inline image) fixed in 6.14.1 and
  # CVE-2026-59935 (DoS, unterminated inline image) fixed in 6.14.2
  "pypdf>=6.14.2",
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.21.0",
  "pytest-timeout>=2.4.0",
  "pytest-randomly>=4.1.0",
  "hypothesis>=6.100",
  "schemathesis>=4.25",
  # Exact pins: these two are CI gates. A floating spec lets a new upstream
  # release fail a branch that nobody touched (ruff 0.16.0 did exactly that by
  # formatting Python blocks inside Markdown). Keep in lockstep with the pins
  # in .github/workflows/ci.yml and .pre-commit-config.yaml.
  "ruff==0.15.5",
  "mypy==2.3.0",
  "ipython>=8.0.0",
  "pre-commit>=3.5.0",
  "types-PyYAML",
]
memory = [
  "supermemory>=0.1.0",
]
computer_use = [
  "mss>=9.0.0",
  # 12.3.0: see the `ocr` extra above for the CVE list fixed in this release
  "Pillow==12.3.0",
  "pyautogui>=0.9.54",
]

[tool.uv]
constraint-dependencies = [
  # GHSA-f4xh-w4cj-qxq8: arbitrary server-side file read in TracingMiddleware
  # (transitive via langchain-core)
  "langsmith>=0.8.18",
]
# `mineru[pipeline]` caps transformers at <5.0.0, while `huggingface` requires
# >=5.3.0 (CVE-2026-4372 RCE). The two extras are genuinely incompatible — they
# are separate opt-in capability groups, never installed together — so declare
# the conflict instead of relaxing the security pin.
conflicts = [
  [
    { extra = "huggingface" },
    { extra = "mineru" },
  ],
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "plugins*"]

[tool.setuptools.dynamic]
version = {attr = "core._version.__version__"}

[tool.setuptools.package-data]
"*" = [
    "static/**/*",
    "ui/dist/**/*",
    "manifest.yaml",
    "manifest.yml",
    "manifest.json",
    "README.md",
    "py.typed",
    "prompts/**/*.md",
    "examples/**/*.yaml",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", "node_modules", ".git", ".env", "examples"]

[tool.ruff]
target-version = "py312"
exclude = [
    "templates/",
    "frontend/",
    "examples/",
]

[tool.ruff.lint]
# Modern ruleset for an async orchestration engine. Default (E/F) only caught
# style + undefined names; these families add async-bug, bugbear, modernization,
# logging and perf coverage. Bandit (via pre-commit) still owns security scanning.
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "B",      # flake8-bugbear (likely bugs)
    "UP",     # pyupgrade (PEP 585/604 modern syntax)
    "ASYNC",  # flake8-async (blocking calls in async, etc.)
    "C4",     # flake8-comprehensions
    "LOG",    # flake8-logging
    "RUF",    # ruff-specific (incl. RUF006 asyncio-dangling-task)
]
ignore = [
    "E501",     # line length — owned by the formatter, not worth reflowing legacy
    "ASYNC109", # allow explicit `timeout` params on async funcs (deliberate API shape)
    "B008",     # FastAPI Depends()/Query() in defaults is the framework idiom
    # --- Backlog: valuable but too noisy to gate on today; fix incrementally. ---
    "ASYNC230", # blocking open() in async fns — needs anyio/aiofiles migration
    "ASYNC240", # blocking pathlib in async fns — needs anyio.Path migration
    "B905",     # zip() without explicit strict= — audit each call before flipping
    "B007",     # unused loop control variable
    "B024",     # ABC without abstract methods
    "UP007",    # Union[...] → X | Y  (residual, manual)
    "UP035",    # deprecated typing imports (residual)
    "UP040",    # TypeAlias → PEP 695 `type` statement
    "UP042",    # Enum(str) → StrEnum — changes base class semantics, migrate carefully
    "UP046",    # Generic[...] → PEP 695 class generics
    "UP047",    # Generic function → PEP 695 syntax
    "RUF001",   # ambiguous unicode (string) — legit in IT-language content
    "RUF002",   # ambiguous unicode (docstring)
    "RUF003",   # ambiguous unicode (comment)
    "RUF005",   # iterable unpacking over concatenation
    "RUF012",   # mutable class default — noisy with Pydantic/dataclass fields
    "RUF022",   # unsorted __all__ — cosmetic
    "RUF059",   # unused unpacked variable
    "C401",     # unnecessary generator (set)
    "C420",     # dict comprehension → dict.fromkeys
    "LOG015",   # logging on root logger
]

[tool.ruff.lint.per-file-ignores]
"core/observability/logging.py" = ["LOG004"]  # logging wrapper exception helper
"__init__.py" = ["F401"]        # re-exports are intentional public surface
# Test idioms: broad `pytest.raises`, bare-expression asserts, un-chained raises,
# dict()-literals and blocking sleeps are all fine in test code.
"tests/**" = ["B011", "B017", "B018", "B904", "C408", "UP031", "RUF013", "RUF043", "ASYNC251"]
"plugins/test-project/**" = ["B904", "RUF013"]   # in-repo test fixture plugin, not shipped
"scripts/**" = ["ASYNC250", "RUF013"]            # one-off admin scripts; blocking sleep is fine
"migrations/**" = ["E402"]      # alembic env import ordering is fixed by the template

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
disable_error_code = ["import-untyped", "import-not-found"]
exclude = [
    "templates/",
    "examples/",
    "frontend/",
    "build/",
    "dist/",
    "plugins/",
    "scripts/",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers",
    "psutil",
    "pytesseract",
    "docker",
    "docker.errors",
    "docker.models.containers",
    "docker.types",
    "structlog",
    "structlog.contextvars",
    "opentelemetry",
    "opentelemetry.instrumentation.fastapi",
    "opentelemetry.instrumentation.redis",
    "opentelemetry.instrumentation.httpx",
    "supermemory",
    "supermemory.*",
]
ignore_errors = true

[tool.coverage.run]
# Branch coverage: a line that only ever takes one side of its condition is
# not "covered". The percentage drops vs line-only measurement — the gate in
# pytest.ini is calibrated against branch numbers.
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
