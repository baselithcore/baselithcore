name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'mkdocs-site/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mkdocs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Least privilege at workflow level; the deploy job escalates on its own
# (pages + id-token), and build only needs pages:write for site enablement.
permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages with `enablement: true` creates the Pages site.
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
        with:
          enablement: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.x'

      - name: Install Zensical
        run: pip install zensical==0.0.51

      - name: Build documentation
        working-directory: mkdocs-site
        run: zensical build --clean

      - name: Create CNAME file
        run: echo "docs.baselithcore.xyz" > mkdocs-site/site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4
        with:
          path: mkdocs-site/site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
