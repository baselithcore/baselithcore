# Scheduled LLM-as-judge eval run — quality signal, NOT a merge gate.
#
# The deterministic eval gates run on every PR (ci.yml). Judge scoring is
# nondeterministic and needs provider credentials, so it runs here nightly:
# a red run is a quality regression signal for maintainers, and never blocks
# a merge. Skips green when no credentials are configured (forks).
name: Nightly Judge Evals

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  judge_evals:
    name: LLM-as-Judge Eval Run
    runs-on: ubuntu-latest
    # 45, not 30: the judge now scores each case k=3 times and takes the median
    # (see EVAL_JUDGE_SAMPLES below), so the wall clock is roughly 3x what this
    # budget was set for — minus whatever the parallelism below wins back.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install --group test -e .
      - name: Run judge evals
        env:
          # Unset secrets leave these empty; the script then skips green.
          LLM_PROVIDER: openai
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Judge scoring is nondeterministic: a single sample makes a case flip
          # verdict between nightly runs on noise alone, which is how a quality
          # signal turns into background alarm nobody reads. k=3 with a median
          # discards the odd outlier.
          EVAL_JUDGE_SAMPLES: "3"
          # ... and 3x the calls only costs 3x the wall clock if they are
          # serial. Bounded rather than unbounded so a large corpus cannot
          # stampede the provider into rate-limiting the whole run.
          EVAL_JUDGE_MAX_PARALLEL: "4"
        run: python scripts/run_judge_evals.py --report judge-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: judge-eval-report
          path: judge-report.json
          if-no-files-found: ignore
          retention-days: 30
