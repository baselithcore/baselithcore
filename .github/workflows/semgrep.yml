# Semgrep static analysis using the public OSS rulesets (no token required).
# Two-tier posture: every finding is uploaded to the Security → Code scanning
# tab, and ERROR-severity findings additionally FAIL the build — a confirmed
# injection/deserialization hit must block the merge, not sit in a tab.
name: Semgrep

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "27 4 * * 1" # Mondays 04:27 UTC

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep==1.171.0

      - name: Scan (report — all severities)
        # Public rulesets fetched from the registry (no SEMGREP_APP_TOKEN needed).
        # No `--error`: findings of any severity exit 0 here (they surface in
        # code scanning), but a scanner crash still fails the job.
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --metrics off

      - name: Gate (blocking — ERROR severity)
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config p/secrets \
            --severity ERROR --error \
            --metrics off

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4
        with:
          sarif_file: semgrep.sarif
