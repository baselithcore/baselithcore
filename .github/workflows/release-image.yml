name: Release Container Image

# Build, push, sign, and attest the container image.
#
# Trigger history, worth keeping: `release: published` alone NEVER fired. The
# release is created by semantic-release using `secrets.GITHUB_TOKEN`, and
# GitHub deliberately does not start workflow runs from events raised by that
# token (its recursion guard). Five releases shipped with zero images pushed,
# while the Helm chart's default `image.repository` already pointed at
# ghcr.io/baselithcore/baselithcore. `workflow_call` is therefore the real
# entry point: ci.yml invokes it inside the same run as the release, so no
# second event is needed.
#
# That call is currently OPT-IN and off by default — ci.yml gates the
# `release_image` job on the repository variable RELEASE_IMAGE_ENABLED, because
# the build is long and its post-push CVE gate fails releases for reasons
# unrelated to the change being shipped. `workflow_dispatch` below is the
# supported way to cut an image by hand in the meantime; pass the git tag.
on:
  workflow_call:
    inputs:
      tag:
        description: "Git tag to build, e.g. v0.31.0 (the leading v is stripped for the image tag)"
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git branch, tag, or SHA to build"
        required: true
        type: string
      tag:
        description: "Docker image tag to publish (for example docker-runtime-test)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Why this is three jobs and not one
  #
  # The single job built `linux/amd64,linux/arm64` on one amd64 runner, which
  # means the arm64 half runs under QEMU emulation: torch, ~100 apt packages,
  # a Chromium install and two model downloads, all interpreted. That leg
  # dominated the wall clock and the billed minutes.
  #
  # Each platform now builds on a runner of its own architecture — GitHub
  # offers arm64 hosted runners (`ubuntu-24.04-arm`) — and a final job merges
  # the two into one multi-arch index. Same manifest for pullers, natively
  # compiled, and the two legs run in parallel instead of in sequence.
  #
  # They are written out rather than expressed as a matrix on purpose: a matrix
  # cannot hand two per-platform digests to a later job (matrix job outputs
  # overwrite each other), and the alternative — passing them as artifacts —
  # would add two more third-party actions to pin.
  # ---------------------------------------------------------------------------
  meta:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
      publish_latest: ${{ steps.meta.outputs.publish_latest }}
    steps:
      - name: Resolve image tag
        id: meta
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          TAG="${INPUT_TAG:-${RELEASE_TAG:-latest}}"
          # Strip a leading 'v' if present (v0.12.0 -> 0.12.0).
          TAG="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "publish_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_latest=true" >> "$GITHUB_OUTPUT"
          fi

  build-amd64:
    name: Build linux/amd64
    needs: [meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push the platform image by digest
      id-token: write         # SLSA provenance
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Pin to the release TAG, not to the SHA that started the run. When
          # ci.yml calls this workflow, that SHA is the commit *before*
          # semantic-release bumped the version — checking it out would ship an
          # image tagged 0.31.0 whose core/_version.py still said 0.30.0. The
          # tag is pushed by the release job before this one starts. A manual
          # dispatch supplies its source independently through `ref`.
          ref: ${{ inputs.ref || inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          # The repository's one Dockerfile: multi-stage, so the compiler
          # toolchain stays in the build stage. Local, dev and production all
          # build this same file — there is no second variant to drift.
          file: Dockerfile
          platforms: linux/amd64
          # No tags: the platform image is pushed by digest and only the merge
          # job below names it, so neither leg can leave a half-finished
          # single-arch image sitting on the release tag.
          outputs: type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Layer cache in the registry, per platform. Without it every release
          # re-downloaded torch and the model weights and reinstalled Chromium
          # from scratch; the Dockerfile keeps those layers above the source
          # COPYs, so a release that only changes code now reuses all of them.
          # Registry rather than type=gha: the cache for this image is several
          # GB and would be evicted from the 10GB Actions cache continuously.
          cache-from: type=registry,ref=${{ needs.meta.outputs.image }}:buildcache-amd64
          cache-to: type=registry,ref=${{ needs.meta.outputs.image }}:buildcache-amd64,mode=max
          # `org.opencontainers.image.source` is what links the GHCR package to
          # this repository: without it the package shows up unattached (absent
          # from the repo's Packages sidebar, inheriting none of its settings).
          # The rest is provenance a puller can read straight off the manifest.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.title=BaselithCore
            org.opencontainers.image.description=Modular orchestration engine for production-grade agentic AI
          # SLSA provenance + SBOM attached to the platform image at push time;
          # `imagetools create` carries both into the merged index.
          provenance: mode=max
          sbom: true

  build-arm64:
    name: Build linux/arm64
    needs: [meta]
    # Native arm64 hosted runner. The previous single-job build cross-built
    # this platform under QEMU on an amd64 runner, which is where most of the
    # wall clock went. If this label is ever unavailable to the repository the
    # job fails fast here, rather than silently shipping an amd64-only index.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ needs.meta.outputs.image }}:buildcache-arm64
          cache-to: type=registry,ref=${{ needs.meta.outputs.image }}:buildcache-arm64,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.title=BaselithCore
            org.opencontainers.image.description=Modular orchestration engine for production-grade agentic AI
          provenance: mode=max
          sbom: true

  publish:
    name: Merge manifest, sign (cosign), scan, attest
    needs: [meta, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # write the multi-arch index
      id-token: write         # keyless cosign (Sigstore OIDC)
      attestations: write     # GitHub artifact attestations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Only .trivyignore.yaml is read here; the scan targets the pushed
          # digest, not the working tree.
          ref: ${{ inputs.ref || inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3
      - name: Merge the two platform images into one index
        id: merge
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          TAG: ${{ needs.meta.outputs.tag }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          PUBLISH_LATEST: ${{ needs.meta.outputs.publish_latest }}
        run: |
          set -euo pipefail
          # Annotate the INDEX as well as the platform manifests: GHCR reads
          # the source link off whichever manifest the tag points at, and that
          # is the index here.
          TAG_ARGS=(-t "${IMAGE}:${TAG}")
          if [ "${PUBLISH_LATEST}" = "true" ]; then
            TAG_ARGS+=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.version=${TAG}" \
            "${TAG_ARGS[@]}" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"
          # The index digest is what gets signed and attested — not either
          # platform digest, which a puller of the tag never resolves to.
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Sign image (keyless / Sigstore OIDC)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          IMAGE: ${{ needs.meta.outputs.image }}
          COSIGN_YES: "true"
        run: |
          cosign sign "${IMAGE}@${DIGEST}"

      # Post-push gate: a HIGH/CRITICAL finding fails the release loudly.
      # (Scanning pre-push would forgo the multi-arch manifest; the signed
      # digest is immutable either way, and a red release is the signal.)
      - name: Scan released image (Trivy)
        env:
          TRIVY_VERSION: 0.71.0
          # Keep in lockstep with TRIVY_VERSION (and the copy in ci.yml).
          TRIVY_SHA256: 30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814
          IMAGE: ${{ needs.meta.outputs.image }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          set -euo pipefail
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          ./trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --ignorefile .trivyignore.yaml "${IMAGE}@${DIGEST}"

      - name: Generate GitHub artifact attestation (provenance)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1
        with:
          subject-name: ${{ needs.meta.outputs.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
