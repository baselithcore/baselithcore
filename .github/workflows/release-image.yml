name: Release Container Image

# Build, push, sign, and attest the container image.
#
# Trigger history, worth keeping: `release: published` alone NEVER fired. The
# release is created by semantic-release using `secrets.GITHUB_TOKEN`, and
# GitHub deliberately does not start workflow runs from events raised by that
# token (its recursion guard). Five releases shipped with zero images pushed,
# while the Helm chart's default `image.repository` already pointed at
# ghcr.io/baselithcore/baselithcore. `workflow_call` is therefore the real
# entry point: ci.yml invokes it inside the same run as the release, so no
# second event is needed. The other two triggers stay as escape hatches — a
# release published by a human (their token does start runs) and a manual
# re-run for a tag.
on:
  workflow_call:
    inputs:
      tag:
        description: "Git tag to build, e.g. v0.31.0 (the leading v is stripped for the image tag)"
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build (defaults to the release/tag name)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-sign:
    name: Build, push, sign (cosign) + provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write         # keyless cosign (Sigstore OIDC) + SLSA provenance
      attestations: write     # GitHub artifact attestations
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Pin to the release TAG, not to the SHA that started the run. When
          # ci.yml calls this workflow, that SHA is the commit *before*
          # semantic-release bumped the version — checking it out would ship an
          # image tagged 0.31.0 whose core/_version.py still said 0.30.0. The
          # tag is pushed by the release job before this one starts. Empty (a
          # bare workflow_dispatch) keeps the default ref.
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Resolve image tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${INPUT_TAG:-${RELEASE_TAG:-latest}}"
          # Strip a leading 'v' if present (v0.12.0 -> 0.12.0).
          TAG="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          # Multi-stage runtime (no build toolchain in the shipped layers).
          # Dockerfile-slim remains the local/dev single-stage build.
          file: Dockerfile-full
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          # `org.opencontainers.image.source` is what links the GHCR package to
          # this repository: without it the package shows up unattached (absent
          # from the repo's Packages sidebar, inheriting none of its settings).
          # The rest is provenance a puller can read straight off the manifest.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.title=BaselithCore
            org.opencontainers.image.description=Modular orchestration engine for production-grade agentic AI
          # SLSA provenance + SBOM attached to the image at push time.
          provenance: mode=max
          sbom: true

      - name: Sign image (keyless / Sigstore OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
          COSIGN_YES: "true"
        run: |
          cosign sign "${IMAGE}@${DIGEST}"

      # Post-push gate: a HIGH/CRITICAL finding fails the release loudly.
      # (Scanning pre-push would forgo the multi-arch manifest; the signed
      # digest is immutable either way, and a red release is the signal.)
      - name: Scan released image (Trivy)
        env:
          TRIVY_VERSION: 0.71.0
          # Keep in lockstep with TRIVY_VERSION (and the copy in ci.yml).
          TRIVY_SHA256: 30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          ./trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --ignorefile .trivyignore.yaml "${IMAGE}@${DIGEST}"

      - name: Generate GitHub artifact attestation (provenance)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
