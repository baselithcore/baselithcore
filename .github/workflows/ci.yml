name: BaselithCore CI

# ------------------------------------------------------------------
# Where the gates are defined
# ------------------------------------------------------------------
# Every gate that is fast and hermetic — no network, no database, no built
# artifact, no importable app — is defined in .pre-commit-config.yaml and runs
# here through the single `quality_gates` job. ruff, mypy, bandit,
# markdownlint, prettier and the scripts/check_*.py gates are NOT invoked by
# this file: it would be a second copy of their arguments, free to drift from
# the one developers run, which is exactly how this workflow used to disagree
# with a green `git commit`. Add a gate by adding a hook.
#
# What stays here is what a hook genuinely cannot do, and each such job says
# why in its own comment: the full git history (gitleaks), the network
# (pip-audit, dependency-review, trivy), a resolved dependency graph (uv lock),
# an importable app (docs_consistency --routes, openapi_drift), a built wheel
# (package_smoke), a container image, or the test suite itself. The complete
# list is mirrored in mkdocs-site/docs/advanced/quality-gates.md.
#
# ------------------------------------------------------------------
# Tool version pinning policy
# ------------------------------------------------------------------
# Every developer tool installed by this workflow is pinned to an exact
# version. Floating installs (`pip install ruff`) make CI non-reproducible:
# an upstream release can turn a previously green branch red without a
# single line of repo code changing. That is exactly what happened with
# ruff 0.16.0, which began formatting Python code blocks embedded in
# Markdown and failed `ruff format --check` on 93 untouched docs.
#
# The pins that are duplicated on purpose — gitleaks here and in the hook
# config, ruff/mypy in the hook config and in pyproject's `dev` extra — are
# compared by scripts/check_tool_pins.py, which is itself one of the hooks.
# Bump versions deliberately, in their own PR, so the diff that adapts to
# a new tool release is reviewable on its own.
# ------------------------------------------------------------------

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # A merge queue re-runs the checks against the PR rebased onto the CURRENT
  # tip, which is the only place a semantic conflict shows up: two PRs that are
  # each green in isolation and red together. Without this trigger the queue has
  # no required checks to wait on and either refuses to enqueue or merges
  # unverified — so the one event the queue exists for never runs CI.
  merge_group:

# Least privilege by default; jobs that write (release, publish, SARIF
# upload) escalate with their own job-level permissions block.
permissions:
  contents: read

# One run per ref: superseded pushes stop burning runners. Never cancel
# main - the release job runs there. Never cancel a merge_group run either: its
# ref (refs/heads/gh-readonly-queue/...) is not main, so the expression below
# would have cancelled it, and a cancelled queue check reads as failed - which
# drops the PR out of the queue instead of merging it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

jobs:
  # ============================================================
  # 📝 LINTING
  # ============================================================
  quality_gates:
    # ------------------------------------------------------------------
    # Every fast, hermetic gate — run from .pre-commit-config.yaml, which is
    # their only definition.
    # ------------------------------------------------------------------
    # This job replaces seven that each re-implemented a hook: `Lint Markdown`,
    # `Lint Python (Ruff)`, `Architecture Boundaries`, the three `Type Check`
    # jobs and `Plugin Integrity`, plus the bandit step of the security job.
    # Each of them installed its own copy of a tool and spelled out its own
    # argv next to a hook that ran the same tool differently, with a comment
    # asking a human to keep the two in step. That is not a mechanism, and the
    # drift it allowed is the reason a developer could watch `git commit` go
    # green and the pipeline go red on an unchanged tree:
    #
    #   * mypy ran PER FILE in the hook and per PACKAGE here, so a signature
    #     change staged without its callers type-checked locally and could not
    #     type-check here;
    #   * bandit scanned the staged files in the hook and `core plugins sdk
    #     scripts` in full here;
    #   * ruff's exclusions were written twice, in two syntaxes;
    #   * `Lint Markdown` carried `continue-on-error: true`, so the pipeline was
    #     also, in one place, laxer than the laptop.
    #
    # There is now one list of gates, one set of arguments, one dependency set.
    # `pre-commit run --all-files` is what runs here, what `git push` runs
    # through the `full-tree` hook, and a superset of what `git commit` runs.
    # Adding a gate means adding a hook; nothing needs to be added here.
    #
    # A hook that rewrites a file (ruff --fix, prettier --write) fails under
    # pre-commit, and --show-diff-on-failure prints what it would have written,
    # so a formatting miss reads as a diff instead of "exit code 1".
    name: Quality Gates (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          # Pinned to the same interpreter as `default_language_version` in
          # .pre-commit-config.yaml. mypy's verdict depends on the version it
          # runs under, so this is part of the gate, not a build detail.
          python-version: '3.12'
      - name: Install pre-commit
        # Pinned like every other tool this workflow installs (see the policy
        # note at the top). scripts/check_tool_pins.py — itself one of the
        # hooks below — fails the build if this version drops under the floor
        # the config or the `dev` extra declares.
        run: pip install pre-commit==4.6.1
      - name: Cache hook environments
        # Without this every run rebuilds a mypy venv, a node install for
        # prettier/markdownlint and the ruff wheel. The config file's hash is
        # the whole key: any change to a rev, an arg or an
        # additional_dependencies list must invalidate the cache, and nothing
        # else can change what the environments contain.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.12-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run every hook over the whole tree
        env:
          # The gitleaks hook scans the STAGED diff (`gitleaks git --pre-commit
          # --staged`). Nothing is staged in a CI checkout, so here it would
          # bootstrap a Go toolchain to scan zero bytes and report success — a
          # green light for a check that did not run. The `gitleaks` job below
          # scans the full history instead, which is strictly stronger and is
          # the only form of the check that means anything off a developer's
          # machine.
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  zizmor:
    # Static analysis for the workflows themselves. Everything else in this
    # file gates the application; nothing gated the CI definition, which is the
    # one part of the repository that runs with a token. zizmor catches the
    # classes that matter here: `${{ }}` expansion of attacker-controllable
    # values into a `run:` block (template injection), a checkout that leaves
    # credentials in .git/config for later steps, over-broad `permissions:`,
    # and unpinned `uses:`.
    #
    # Deliberate exceptions are `# zizmor: ignore[rule]` comments at the site,
    # each with the reason next to it — never a blanket allowlist in a config
    # file nobody reads.
    name: Workflow Lint (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Audit workflow definitions
        run: |
          uv pip install --system zizmor==1.30.1
          # --offline: no GitHub API calls. The online mode resolves referenced
          # actions through the API, which makes the result depend on rate
          # limits and on repositories we do not control — a gate that can turn
          # red without a change in this tree is not a gate. Every audit that
          # needs only the workflow text still runs.
          zizmor --offline .github/workflows/

  helm_lint:
    # The chart is a shipped artifact: `helm install` against it is the
    # documented deployment path, and its appVersion is the released image tag.
    # Nothing validated it, so a template that renders invalid YAML — or valid
    # YAML the API server rejects — was only discovered by an operator applying
    # it to a real cluster.
    name: Helm Chart (lint + kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
        with:
          version: v3.20.0
      - name: helm lint (default and production values)
        # Both value sets: the production overlay turns on the ingress, the
        # NetworkPolicy, the worker Deployment and the ServiceMonitor, none of
        # which the default render exercises.
        run: |
          helm lint deploy/helm/baselithcore
          helm lint deploy/helm/baselithcore \
            -f deploy/helm/baselithcore/values-production.yaml
      - name: Render and validate against the Kubernetes schemas
        env:
          KUBECONFORM_VERSION: 0.8.0
          # From the release's CHECKSUMS file. Same posture as the gitleaks and
          # Trivy steps: a binary fetched over the network is verified before it
          # runs, and a tampered or unavailable download fails the job rather
          # than silently skipping the gate.
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          # -strict rejects unknown fields, which is what catches a typo'd key
          # that a cluster would accept and then ignore. The CRDs-catalog
          # schema location resolves the out-of-tree kinds the chart emits
          # (monitoring.coreos.com ServiceMonitor/PrometheusRule, keda.sh
          # ScaledObject); -ignore-missing-schemas keeps a catalog gap from
          # failing the build, while every in-tree Kubernetes kind is still
          # validated strictly.
          # --kube-version must match kubeconform's -kubernetes-version: helm
          # uses it to resolve .Capabilities.KubeVersion and the
          # apiVersion-availability guards in the templates, so without it helm
          # renders against ITS built-in default while kubeconform validates
          # against 1.29 — two different clusters, and a chart that renders a
          # deprecated apiVersion for the target would slip through.
          validate() {
            helm template baselithcore deploy/helm/baselithcore \
              --kube-version 1.29.0 "$@" \
              | /tmp/kubeconform \
                  -strict \
                  -summary \
                  -ignore-missing-schemas \
                  -kubernetes-version 1.29.0 \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                  -
          }
          validate
          validate -f deploy/helm/baselithcore/values-production.yaml

  docs_consistency:
    name: Docs ↔ Code Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Install locked dependencies
        run: |
          uv export --frozen --extra test --no-emit-project \
            --format requirements-txt -o /tmp/requirements-test.txt
          uv pip install --system --no-config --require-hashes \
            -r /tmp/requirements-test.txt
          uv pip install --system --no-deps -e .
      - name: Docs claims vs code (imports, paths, links, env, CLI, routes)
        run: python scripts/check_docs_consistency.py --routes
      - name: Changed core modules have their docs page touched
        if: github.event_name == 'pull_request'
        # BASE_REF goes through the environment, not through `${{ }}` inside the
        # run block: expression interpolation splices the value into the shell
        # script BEFORE bash parses it, so a branch name containing shell
        # metacharacters would execute as code in a job that can read the
        # checkout. An env var is expanded by bash as data.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_docs_sync.py "origin/${BASE_REF}"

  openapi_drift:
    # The checked-in sdk/openapi.json (and its mkdocs copy) must match what
    # create_app() actually serves — schema drift fails the build instead of
    # silently shipping a stale contract.
    name: OpenAPI Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Install package
        run: uv pip install --system -e .
      - name: Regenerate and diff OpenAPI schema
        run: |
          PYTHONPATH=. python scripts/export_openapi.py sdk/openapi.json
          cp sdk/openapi.json mkdocs-site/docs/api/specs/openapi.json
          git diff --exit-code -- sdk/openapi.json mkdocs-site/docs/api/specs/openapi.json

  sdk:
    # Client SDKs are part of the shipped surface: build + test them so a
    # server-side change that breaks the published clients fails here.
    name: Client SDKs (Python + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: SDK contract vs OpenAPI
        # Every route the hand-written clients call must exist in the committed
        # spec, and both clients must call the same set.
        run: python scripts/check_sdk_contract.py --list && python scripts/check_sdk_contract.py
      - name: Test Python SDK
        run: |
          pip install -e sdk/python pytest==8.3.4
          python -m pytest sdk/python/tests -q
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
      - name: Build + test TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test

  evals:
    # Deterministic eval regression gate: replays evals/runs/ recordings
    # against evals/cases/ trajectory cases. No LLM call, no API key, no
    # network — a change that breaks an agent-flow contract (tools used,
    # output keywords, call/latency/cost budgets) fails this job.
    name: Eval Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Install package
        run: uv pip install --system -e .
      - name: Run deterministic eval gate
        run: python scripts/run_regression_evals.py

  red_team:
    # Adversarial regression gate: replays evals/red_team/ through the
    # guardrail surfaces (input guard, indirect-injection scanner, output
    # guard). No LLM call, no API key, no network. A jailbreak that was
    # blocked last quarter and passes today is a regression — this is the
    # only job that notices. An empty corpus fails the gate.
    name: Red-Team Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Install package
        run: uv pip install --system -e .
      - name: Run red-team gate
        run: python scripts/run_red_team_evals.py --report red-team-report.json
      - name: Upload red-team report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: red-team-report
          path: red-team-report.json

  fairness:
    # Bias-examination gate (EU AI Act Art. 10(2)(f)/(g), Art. 15): group
    # fairness metrics over the labelled datasets in evals/fairness/. No LLM
    # call, no API key, no network. An empty dataset directory fails the job —
    # an examination that examines nothing is the failure mode this prevents.
    name: Bias Examination Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Install package
        run: uv pip install --system -e .
      - name: Run bias examination gate
        run: python scripts/run_fairness_evals.py --report fairness-report.json
      - name: Upload fairness report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: fairness-report
          path: fairness-report.json

  # ============================================================
  # 🔒 SECURITY
  # ============================================================
  uv_lock_check:
    name: Lockfile Check (uv)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.12.0"
      # A stale uv.lock means pyproject.toml changed without re-locking:
      # builds stop being reproducible. Regenerate with `uv lock`.
      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

  dependency_review:
    # Gates the DIFF, which is the one thing the other supply-chain jobs do not
    # do. pip-audit and Trivy answer "is anything we install vulnerable today",
    # and both are happy to stay green while a PR introduces a new dependency
    # that is merely not-yet-known-bad. This one answers "what is this PR
    # adding, and is it something we would have accepted on purpose" — it
    # compares the base and head dependency graphs and fails on a newly
    # introduced vulnerable or badly licensed package, at review time, when
    # removing it is still cheap.
    #
    # Requires the repository's Dependency graph to be enabled (Settings →
    # Code security). Without it the action errors rather than passing
    # vacuously, which is the correct failure direction for a security gate.
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # pull_request only: the action diffs a base against a head, and a push or
    # a merge_group run has no PR to diff.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Review dependency changes introduced by this PR
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4
        with:
          fail-on-severity: high
          # No PR comment: that needs pull-requests:write, and this job has no
          # reason to hold a write token. The findings are in the job log and
          # in the check annotation.
          comment-summary-in-pr: never

  gitleaks:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Full history: a credential committed and later removed still leaks.
          fetch-depth: 0
          # Read-only job: no reason to leave the job token in .git/config,
          # where any later step (or a compromised action) could push with it.
          persist-credentials: false
      - name: Run gitleaks over the full git history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1

  security_scan:
    # Bandit used to run here too, over `core plugins sdk scripts`, while the
    # hook scanned only the staged files. It is now the `bandit` hook — same
    # argv, one definition — and runs in `quality_gates`. What is left here is
    # the part a hook cannot do: resolving dependencies and querying an
    # advisory database over the network.
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality_gates]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Dependency Vulnerability Scan
        run: |
          uv pip install --system -e . pip-audit==2.10.1
          # Blocking: a known-vulnerable installed dependency fails the PR.
          # Exceptions come from .trivyignore.yaml, the one accepted-risk
          # register, via scripts/audit_ignores.py — which drops an entry once
          # its `expired_at` passes, so an exception cannot outlive the argument
          # that justified it. (The base install has no `mineru` or
          # `huggingface` extra, so none of the registered CVEs is present
          # here; the flags are passed for symmetry with the locked pass.)
          pip-audit --skip-editable $(python scripts/audit_ignores.py)
          # Second, blocking pass over the LOCKED set with every extra the
          # images can install — all but `mineru`, which conflicts with
          # `huggingface` and whose accepted CVEs are tracked in
          # .trivyignore.yaml. The base install above never sees torch,
          # transformers, pypdf or playwright, so a CVE in an extra used to
          # surface only through Trivy. --no-deps: the export is fully pinned,
          # so nothing is resolved or installed.
          uv export --frozen --all-extras --no-extra mineru --no-dev \
            --no-emit-project --no-hashes --format requirements-txt \
            -o /tmp/lock-audit.txt
          pip-audit --no-deps -r /tmp/lock-audit.txt \
            $(python scripts/audit_ignores.py)

  # ------------------------------------------------------------
  # Software Bill of Materials (SBOM) — CycloneDX
  # ------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality_gates]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom==7.3.1
          # Resolve the project's dependencies and emit a standards-compliant SBOM.
          pip install -e .
          # cyclonedx-py 'environment' scans the active venv; flags are
          # --output-format / --output-file (NOT --outfile).
          cyclonedx-py environment --output-format JSON --output-file sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90

  # ------------------------------------------------------------
  # Filesystem vulnerability + secret scan — Trivy (report mode)
  # Results land in the GitHub Security tab; does not block the build.
  # ------------------------------------------------------------
  trivy_scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality_gates]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      # One resilient step: download the Trivy release tarball directly (no
      # install.sh / GitHub API, which rate-limits), scan, and always emit a
      # SARIF. Report-mode — never blocks the build.
      #
      # `backstage-portal/yarn.lock` is excluded from the dependency scan. The
      # Backstage developer portal is a vendored dev-only tool (it is NOT part
      # of the published `baselith-core` wheel or the release container image),
      # and its transitive npm tree is authored upstream by Backstage — not by
      # us. That tree drags in advisories we cannot action without a Backstage
      # release, most notably the abandoned `vm2` package (no patched version
      # exists; pulled in only as a build-time transitive of
      # @backstage/config-loader -> typescript-json-schema). Left in, it floods
      # the Security → Code scanning tab with ~70 unactionable findings and
      # drowns out real signal for the shipped product, so its lockfile is an
      # accepted exclusion. Secret/misconfig scanning of the
      # portal source is unaffected — only its lockfile is skipped.
      #
      # `--ignorefile .trivyignore.yaml` applies the accepted-risk register at
      # the repo root. It is passed explicitly rather than relying on Trivy's
      # implicit lookup so the exception set is visible in the job definition.
      # Entries there are per-CVE and carry an expiry date — see the file.
      - name: Trivy filesystem scan
        env:
          TRIVY_VERSION: 0.71.0
          # Keep in lockstep with TRIVY_VERSION; from the release's
          # trivy_<version>_checksums.txt. Same posture as the gitleaks step:
          # a scanner fetched over the network is verified before it runs,
          # and an unavailable or tampered download fails the job instead of
          # silently skipping the supply-chain gate.
          TRIVY_SHA256: 30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          # backstage-portal/ is a VENDORED Backstage developer-portal app: its
          # transitive npm tree (yarn.lock) is upstream Backstage's dependency
          # set, is excluded from the shipped `baselith-core` wheel, and is not
          # part of the core package's supply chain — so it is skipped in both
          # scans. Its JS-dep CVEs are tracked/updated with Backstage, not here.
          SKIP_DIRS=".venv,node_modules,**/node_modules,**/.venv,backstage-portal"
          # Full report (vuln + secret + misconfig) → SARIF for the Security
          # tab. Report-only (--exit-code 0): IaC/secret findings stay visible
          # but do not gate the build.
          /tmp/trivy fs \
               --scanners vuln,secret,misconfig \
               --severity HIGH,CRITICAL \
               --format sarif \
               --output trivy-results.sarif \
               --skip-dirs "$SKIP_DIRS" \
               --ignorefile .trivyignore.yaml \
               --exit-code 0 \
               .
          # Guarantee a valid SARIF exists so the (always) upload step succeeds.
          if [ ! -f trivy-results.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > trivy-results.sarif
          fi
          # Supply-chain gate (--exit-code 1): fail ONLY on dependency
          # vulnerabilities not accepted in .trivyignore.yaml. Scoped to `vuln`
          # so pre-existing IaC/secret findings (reported above) never gate.
          /tmp/trivy fs \
               --scanners vuln \
               --severity HIGH,CRITICAL \
               --skip-dirs "$SKIP_DIRS" \
               --ignorefile .trivyignore.yaml \
               --exit-code 1 \
               .
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  package_smoke:
    name: Package Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality_gates]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install build backend
        run: |
          python -m pip install build==1.5.0 setuptools==83.0.0 wheel==0.47.0
      - name: Build distributions
        # SOURCE_DATE_EPOCH makes the build reproducible. Without it, setuptools
        # stamps "now" into every zip/tar member, so the same commit built twice
        # produces two artifacts with different hashes — which makes the build
        # provenance attestation on the release unverifiable by anyone who tries
        # to rebuild it. The commit's own author date is the canonical choice
        # (it is what `git log -1 --format=%ct` returns and it is stable for a
        # given commit).
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
          python -m build --no-isolation
      - name: Validate distribution artifacts
        run: python scripts/check_distribution_artifacts.py

  # ============================================================
  # 🧪 TEST
  # ============================================================
  frontend_test:
    # `core/static/frontend/js/api.js` is the SSE client the shipped chat UI
    # runs: it reassembles `/chat/stream` frames across arbitrary chunk
    # boundaries. Its tests existed and nothing ran them, so the regressions
    # they pin (a CRLF line split exactly at the \r/\n boundary, `event: error`
    # leaking into the transcript as ordinary text) were only ever caught by
    # whoever happened to run `node --test` locally.
    #
    # No npm install and no `cache:` key: the module under test has zero
    # dependencies and the directory has no package.json, so there is no
    # lockfile to cache against and `cache: 'npm'` would fail looking for one.
    name: Frontend JS Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
      - name: Run node --test
        # Discover rather than naming api.test.mjs: a second test module added
        # next to it must be picked up without editing CI, which is exactly how
        # the first one came to be unrun.
        #
        # Discovered with `find` and passed as explicit paths, not handed to
        # `--test` as a glob. A `--test` glob that matches nothing exits 0 with
        # zero tests — so a renamed or moved file would turn this gate green
        # while verifying nothing, which is worse than the hole it closes. The
        # emptiness check below is the whole point of doing it this way.
        run: |
          FILES="$(find core/static/frontend/js -name '*.test.mjs' | sort)"
          if [ -z "$FILES" ]; then
            echo "::error::no *.test.mjs found under core/static/frontend/js"
            exit 1
          fi
          echo "Running:"
          echo "$FILES"
          echo "$FILES" | xargs node --test

  python_test:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # evals/red_team/fairness in the needs graph: the three quality gates
    # block the test→release path structurally, not only when configured as
    # required checks in branch protection. zizmor, helm_lint, ui_build and
    # frontend_test join them for the same reason — a gate that nothing depends
    # on is advisory, and a workflow audit, a chart that will not render, a
    # stale dashboard bundle or a broken SSE client in the shipped chat UI are
    # all things that must not reach a release. frontend_test is safe to depend
    # on because it carries no `if:` and therefore runs on every trigger.
    #
    # dependency_review is deliberately NOT here: it only runs on
    # pull_request, so listing it would make every push to main skip
    # python_test (a skipped dependency blocks the dependent job).
    needs: [quality_gates, docs_consistency, security_scan, package_smoke, evals, red_team, fairness, zizmor, helm_lint, ui_build, frontend_test]
    # 3.14 is NOT here. requires-python is >=3.12 with no upper cap, so it is
    # worth testing — but until every upstream dep publishes wheels it can only
    # run advisory, and an advisory leg is `continue-on-error`, which means it
    # cannot fail the build no matter what it finds. Running it on every push
    # and every PR spent ~2.7 minutes a run producing information nothing is
    # gated on, and the same commits flow through both develop and main, so it
    # was ~11 minutes per change set. It now runs once a night in nightly.yml
    # (`forward_compat`), which is where this repo already keeps its
    # forward-looking non-blocking signal. Move it back into this matrix — WITH
    # the advisory flags dropped — the day it is ready to block.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: baselith
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Run Tests
        env:
          POSTGRES_DB: test_db
          DB_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          CACHE_REDIS_URL: redis://localhost:6379/1
        run: |
          # Install the LOCKED set, not a fresh resolution. `-e ".[test]"`
          # re-resolved every dependency to whatever was newest that morning,
          # so uv.lock described a combination CI never exercised — and a lock
          # nothing installs from is a lock nothing validates. Exporting it
          # with hashes also makes the test environment reproducible and
          # tamper-evident.
          #
          # --no-config: `uv pip install` would otherwise apply
          # [tool.uv] constraint-dependencies from pyproject.toml, which are
          # unpinned ranges and therefore rejected in --require-hashes mode.
          # Their effect is already baked into the pinned export.
          uv export --frozen --extra test --no-emit-project \
            --format requirements-txt -o /tmp/requirements-test.txt
          uv pip install --system --no-config --require-hashes \
            -r /tmp/requirements-test.txt
          # The project itself, without deps: they all came from the lock above.
          uv pip install --system --no-deps -e .
          # Coverage XML on every run so PRs get a Codecov delta, not just main.
          pytest -n auto --cov=core --cov-report=xml:coverage.xml --cov-report=term -q
      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # 🏗️ BUILD
  # ============================================================
  ui_build:
    # `plugins/baselithbot/ui/dist/` is COMMITTED and is the only thing the
    # wheel ships (ui/src and ui/node_modules are excluded in pyproject.toml).
    # A committed build output that nothing rebuilds is a build output that
    # drifts: a change to ui/src/ that was never rebuilt ships the previous
    # bundle, and the dashboard silently serves stale code for a release.
    #
    # This rebuilds it from a clean `npm ci` and fails if the result differs
    # from what is committed — the same shape as the openapi_drift gate.
    name: BaselithBot UI Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: plugins/baselithbot/ui/package-lock.json
      - name: Install, typecheck and build
        working-directory: plugins/baselithbot/ui
        # npm ci, not npm install: it installs the locked tree exactly and
        # fails on a lockfile that disagrees with package.json, rather than
        # quietly resolving something new and rewriting the lock.
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Committed dist/ matches a clean rebuild
        # `git status --porcelain`, not `git diff`: dist/ is covered by a
        # `dist/` line in .gitignore and its bundles are tracked only because
        # they were force-added. `git diff` sees modifications and deletions of
        # those tracked files but is blind to ADDED ones — and an added file is
        # the normal shape of this drift, because the bundle names are
        # content-hashed, so a source change produces a new filename rather
        # than a changed one. --porcelain reports tracked and untracked alike.
        run: |
          DRIFT="$(git status --porcelain -- plugins/baselithbot/ui/dist)"
          if [ -n "$DRIFT" ]; then
            echo "::error::plugins/baselithbot/ui/dist is out of date."
            echo "Run 'npm ci && npm run build' in plugins/baselithbot/ui and commit dist/."
            echo "$DRIFT"
            exit 1
          fi

  # ============================================================
  # 🐳 CONTAINER IMAGE
  # ============================================================
  image_build:
    # The container image had no check anywhere in CI: it was built for the
    # first time during a release, which made the release the place where a
    # broken Dockerfile, a lockfile the image cannot install, or a base image
    # that has collected CVEs was discovered. That is the worst possible moment
    # — the version is already tagged and the changelog already written.
    #
    # This job builds the same Dockerfile the release builds, on PRs, and runs
    # the same CVE gate against the result before anything is pushed anywhere.
    name: Container Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [quality_gates]
    permissions:
      contents: read
      packages: write   # only used on main, to WRITE the shared buildcache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Full history: the change detection below needs a merge-base with
          # the target branch, which a shallow clone does not have.
          fetch-depth: 0
          persist-credentials: false

      # Seconds, no Docker daemon work, so it runs on every PR regardless of
      # what changed: BuildKit's own Dockerfile linter (deprecated syntax,
      # undefined build args, casing, unpinned copies).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Lint Dockerfile
        run: docker buildx build --check --target runtime .

      # A full image build is ~30 minutes cold, so it is scoped to the inputs
      # that can actually change what the image CONTAINS: the Dockerfile, the
      # ignore file, and the dependency surface (pyproject.toml drives the
      # extras, uv.lock pins the resolved set). A change under core/ or
      # plugins/ only invalidates the thin source layers at the very top of the
      # image, which the release build reproduces from cache in seconds — not
      # worth half an hour on every PR.
      #
      # `[image-build]` anywhere in the commit message forces a run, for the
      # case where the reasoning above is wrong.
      - name: Decide whether to build
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            RANGE="$(git merge-base "origin/${BASE_REF}" HEAD)...HEAD"
          else
            RANGE="HEAD~1...HEAD"
          fi
          CHANGED="$(git diff --name-only "${RANGE}" 2>/dev/null || echo Dockerfile)"
          # Read with git into a shell variable, NOT through an Actions
          # expression: a commit message is attacker-controlled text, and
          # interpolating github.event.head_commit.message into a run block is
          # the classic Actions script injection. Compared with grep -F, so it
          # is never evaluated as a pattern either.
          MSG="$(git log -1 --format=%B)"

          BUILD=false
          if printf '%s\n' "${CHANGED}" | grep -qE '^(Dockerfile|\.dockerignore|pyproject\.toml|uv\.lock)$'; then
            BUILD=true
          elif printf '%s\n' "${MSG}" | grep -qF '[image-build]'; then
            BUILD=true
            echo "Forced by [image-build] in the commit message."
          fi
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "Image inputs changed: ${BUILD}"

      - name: Log in to GHCR
        if: steps.decide.outputs.build == 'true'
        # Read access to the layer cache below. A pull request from a FORK gets
        # a read-only GITHUB_TOKEN, which is enough for that and not enough for
        # the cache write, which is why the write is gated to main pushes.
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (amd64, no push)
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          # Loaded into the local daemon so the scan below needs no registry
          # round trip — nothing this job builds ever leaves the runner.
          load: true
          tags: baselithcore:ci
          # Shares the release build's cache ref on purpose, in both
          # directions: a PR READS the layers the last main build produced (so
          # a Dockerfile-only change does not re-download torch and Chromium),
          # and a main push WRITES them back. That write is what keeps the
          # cache warm between releases — previously it was refreshed only when
          # a release ran, so the first build after a quiet month started cold.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-amd64
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}:buildcache-amd64,mode=max', github.repository) || '' }}

      # The same gate the release runs, at the same severity and against the
      # same accepted-risk register. A base image that has collected fixable
      # HIGH/CRITICAL findings now turns a PR red — which is a thing somebody
      # can fix by bumping the base digest — instead of a release.
      - name: Scan built image (Trivy)
        if: steps.decide.outputs.build == 'true'
        env:
          TRIVY_VERSION: 0.71.0
          # Keep in lockstep with TRIVY_VERSION (and the copies in
          # trivy_scan above and in release-image.yml).
          TRIVY_SHA256: 30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          /tmp/trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --ignorefile .trivyignore.yaml baselithcore:ci

      # Cheap assertions about things that have silently broken before, and
      # that no unit test can see because they are properties of the IMAGE.
      - name: Smoke-test the image
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail

          # The console script the Helm worker Deployment runs
          # (`["baselith", "queue", "worker"]`). A released image once shipped
          # without it and that pod could only CrashLoop.
          docker run --rm --entrypoint baselith baselithcore:ci --version

          # There must be exactly ONE importable copy of the source. The
          # project distribution is installed into /install-app for its entry
          # points, and pip also materialises core/ and plugins/ there; with
          # /install-app ahead of /app on PYTHONPATH, which copy won depended
          # on the working directory. The Dockerfile deletes them, so `core`
          # must resolve under /app from ANY cwd.
          for wd in / /app /tmp; do
            RESOLVED="$(docker run --rm --workdir "$wd" --entrypoint python \
              baselithcore:ci -c 'import core; print(core.__file__)')"
            echo "cwd=${wd} -> ${RESOLVED}"
            case "${RESOLVED}" in
              /app/core/*) ;;
              *) echo "::error::core resolved to ${RESOLVED} with cwd=${wd}, expected /app/core"; exit 1 ;;
            esac
          done

          # CPU-only means CPU-only. The Dockerfile filters CUDA wheels out of
          # the exported lock, and this is the assertion that the filter still
          # matches what torch pulls: cuda-bindings/cuda-pathfinder slipped
          # past a pattern that only looked for `nvidia`.
          docker run --rm --entrypoint sh baselithcore:ci -c '
            if ls /install/lib/python3.12/site-packages | grep -qE "^(nvidia|cuda)"; then
              echo "CUDA packages present in a CPU-only image:" >&2
              ls /install/lib/python3.12/site-packages | grep -E "^(nvidia|cuda)" >&2
              exit 1
            fi'

          # Every capability the image installs must be able to RUN in it. The
          # spaCy stack is ~160MB and delivers nothing without its model: the
          # image shipped for a long time with core/nlp falling back to a blank
          # sentencizer, which no test could see.
          docker run --rm --entrypoint python baselithcore:ci -c '
          import spacy
          nlp = spacy.load("en_core_web_sm")
          assert "ner" in nlp.pipe_names, nlp.pipe_names
          print("spaCy pipeline:", nlp.pipe_names)'

          # The browser the image installs must be the one the code launches.
          # The Dockerfile passes `--only-shell` to drop the 641MB full
          # Chromium, and which of the two binaries `headless=True` resolves to
          # is a Playwright implementation detail that has flipped between
          # versions: trying the opposite flag produced "Executable doesn't
          # exist at .../chromium_headless_shell-*/chrome-linux/headless_shell"
          # from every call site. A lockfile bump can flip it back, and nothing
          # but this catches that — the unit tests all mock Playwright.
          docker run --rm --entrypoint python baselithcore:ci -c '
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content("<h1>ok</h1>")
              assert page.inner_text("h1") == "ok"
              browser.close()
          print("playwright: headless launch ok")'

      - name: Report image size
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          SIZE="$(docker image inspect baselithcore:ci --format '{{.Size}}')"
          {
            echo "### Container image"
            echo
            echo "Uncompressed size: **$(numfmt --to=iec --suffix=B "${SIZE}")**"
            echo
            echo '| Layer | Size |'
            echo '| --- | ---: |'
            docker history baselithcore:ci --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' \
              | awk -F'\t' '$1 != "0B" {gsub(/\|/, "\\|", $2); print "| `" substr($2, 1, 90) "` | " $1 " |"}' \
              | head -20
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # 🚀 RELEASE
  # ============================================================
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python_test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write        # provenance attestation (Sigstore OIDC)
      attestations: write    # actions/attest-build-provenance
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      # Consumed by `release_image` below, which needs the version to tag the
      # container image with (no leading `v` — the image job strips one anyway).
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4  # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          # persist-credentials stays ON here (the default), unlike every other
          # job: semantic-release pushes the version bump, the changelog and the
          # tag back to the branch, which needs the token in .git/config. That
          # is what zizmor's `artipacked` audit flags, and the suppression above
          # is the deliberate answer: this job cannot do its work without the
          # credential, and it uploads only dist/, never the .git directory.
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4  # v4
        with:
          # Pinned: these run with contents:write + id-token:write *before*
          # the package is built and attested, so an unpinned plugin resolved
          # from npm at run time could rewrite dist/ and still get provenance.
          # Bump deliberately (majors track the action's semantic-release 24).
          extra_plugins: |
            @semantic-release/git@11.0.1
            @semantic-release/github@12.0.9
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/changelog@7.0.0
            conventional-changelog-conventionalcommits@10.4.0
            @semantic-release/exec@7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install uv and build package
        if: steps.semantic.outputs.new_release_published == 'true'
        # SOURCE_DATE_EPOCH: same reasoning as `package_smoke` above, and it
        # matters more here — these are the artifacts that get a Sigstore
        # provenance attestation and go to PyPI. An attestation over a build
        # nobody can reproduce bit-for-bit proves only that OUR runner made it,
        # not that the source produces it. `git log -1` runs after
        # semantic-release has committed the version bump, so the epoch is the
        # release commit's, not the pre-release one's.
        run: |
          pip install uv==0.12.0
          uv pip install --system build==1.5.0
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
          python3 -m build

      - name: Generate release SBOM and attach to the GitHub Release
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.semantic.outputs.new_release_version }}
        run: |
          uv pip install --system cyclonedx-bom==7.3.1
          cyclonedx-py environment --output-format JSON --output-file sbom.json
          # The 90-day CI artifact is not a release asset; this one lives with
          # the release for as long as the release exists.
          gh release upload "$TAG" sbom.json --clobber

      - name: Attest build provenance for the Python artifacts
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1
        with:
          subject-path: 'dist/*'

      - name: Upload artifacts
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: python-package-dist
          path: dist/
          retention-days: 7

  # ============================================================
  # 📦 PUBLISH
  # ============================================================
  publish_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [release]
    if: needs.release.outputs.new_release_published == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/baselith-core # Package name
    permissions:
      id-token: write # Essential for OIDC
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: python-package-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1
        with:
          # No token needed if Trusted Publishing is configured on PyPI
          print-hash: true
          # PEP 740: publish sigstore attestations for every dist file.
          attestations: true

  release_image:
    # The container image half of a release, and the reason it is invoked from
    # HERE rather than left to its own `release: published` trigger: that event
    # is raised by semantic-release using GITHUB_TOKEN, and GitHub does not
    # start workflow runs from it (recursion guard). The image workflow had
    # therefore never run once across five releases, while the Helm chart's
    # default image.repository already pointed at ghcr.io/baselithcore/
    # baselithcore. Calling it inside this run needs no extra event and no
    # extra token.
    name: Release Container Image  # zizmor: ignore[self-repository]
    # (zizmor prefers the newer `$/.github/...` self-reference syntax for the
    # `uses:` below. The `./` form is the documented, universally supported one
    # and this is a reusable-workflow call that already resolves inside this
    # repository at this commit — switching spelling buys nothing and risks a
    # release path that is exercised once per release.)
    needs: [release]
    # ON by default, with a kill switch. It was the other way round — opt-in on
    # a RELEASE_IMAGE_ENABLED variable — because the build is the longest job
    # in the pipeline and its Trivy gate failed whole releases on base-image
    # CVEs unrelated to the change being shipped. Nobody ever set the variable,
    # so the Helm chart kept pointing `image.repository` at a GHCR package that
    # no release had ever published. An opt-in that stays off is not a safety
    # feature, it is a broken deployment path.
    #
    # Both reasons are gone:
    #   * The Dockerfile applies Debian security updates as its last layer, so
    #     a pinned base no longer drifts into CVEs between digest bumps.
    #   * The CVE gate runs in release-image.yml's `scan` job, BEFORE any tag
    #     is created, so a finding stops the image from being published rather
    #     than reddening a release that already shipped one.
    #   * `image_build` above builds and scans the same Dockerfile on every PR
    #     that touches its inputs, so a base-image problem surfaces on a branch
    #     where it can be fixed.
    #
    # RELEASE_IMAGE_DISABLED (Settings -> Secrets and variables -> Actions ->
    # Variables) set to "true" turns it off again without a commit. Unset
    # evaluates to the empty string, so the default is on.
    if: >-
      needs.release.outputs.new_release_published == 'true'
      && vars.RELEASE_IMAGE_DISABLED != 'true'
    uses: ./.github/workflows/release-image.yml
    # A called workflow's GITHUB_TOKEN is scoped by the CALLER, so the grants
    # the image job needs are declared here. GITHUB_TOKEN itself is passed
    # automatically — no `secrets: inherit`, since that is the only secret the
    # called workflow reads (GHCR login).
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign + SLSA provenance
      attestations: write # actions/attest-build-provenance
      # A called workflow's jobs cannot grant themselves more than the CALLER
      # allows, so every scope any job in release-image.yml needs has to appear
      # here. Its `scan` job uploads the image SARIF to code scanning; without
      # this line that upload is denied, `scan` fails, and because `publish`
      # needs it the release would produce no image at all.
      security-events: write # Trivy SARIF -> code scanning
    with:
      # The git TAG, so the image job checks out the bumped tree rather than
      # the pre-release SHA that started this run. `v` is stripped again on the
      # other side to form the image tag.
      tag: v${{ needs.release.outputs.new_release_version }}
