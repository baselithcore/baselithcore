name: BaselithCore CI

# ------------------------------------------------------------------
# Tool version pinning policy
# ------------------------------------------------------------------
# Every developer tool installed by this workflow is pinned to an exact
# version. Floating installs (`pip install ruff`) make CI non-reproducible:
# an upstream release can turn a previously green branch red without a
# single line of repo code changing. That is exactly what happened with
# ruff 0.16.0, which began formatting Python code blocks embedded in
# Markdown and failed `ruff format --check` on 93 untouched docs.
#
# Keep these pins in sync with the local toolchain:
#   - ruff  -> .pre-commit-config.yaml (ruff-pre-commit rev) and the
#              `dev` extra in pyproject.toml
#   - mypy  -> .pre-commit-config.yaml (mirrors-mypy rev)
# Bump versions deliberately, in their own PR, so the diff that adapts to
# a new tool release is reviewable on its own.
# ------------------------------------------------------------------

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege by default; jobs that write (release, publish, SARIF
# upload) escalate with their own job-level permissions block.
permissions:
  contents: read

# One run per ref: superseded pushes stop burning runners. Never cancel
# main - the release job runs there.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================
  # 📝 LINTING
  # ============================================================
  markdownlint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 'lts/*'
      - name: Run markdownlint
        run: |
          npm install -g markdownlint-cli2
          markdownlint-cli2 --config .markdownlint.yaml .
        continue-on-error: true

  python_lint:
    name: Lint Python (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Lint with Ruff
        run: |
          uv pip install --system ruff==0.15.5
          ruff check . --exclude templates,examples
          ruff format --check . --exclude templates,examples

  architecture_boundaries:
    name: Architecture Boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Check Sacred Core boundaries
        run: python scripts/check_architecture_boundaries.py
      - name: Check 500-line file size cap
        run: python scripts/check_file_size.py
      - name: Check eval-corpus ratchet
        run: |
          pip install pyyaml
          python scripts/check_eval_baseline.py

  openapi_drift:
    # The checked-in sdk/openapi.json (and its mkdocs copy) must match what
    # create_app() actually serves — schema drift fails the build instead of
    # silently shipping a stale contract.
    name: OpenAPI Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Install package
        run: uv pip install --system -e .
      - name: Regenerate and diff OpenAPI schema
        run: |
          PYTHONPATH=. python scripts/export_openapi.py sdk/openapi.json
          cp sdk/openapi.json mkdocs-site/docs/api/specs/openapi.json
          git diff --exit-code -- sdk/openapi.json mkdocs-site/docs/api/specs/openapi.json

  sdk:
    # Client SDKs are part of the shipped surface: build + test them so a
    # server-side change that breaks the published clients fails here.
    name: Client SDKs (Python + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Test Python SDK
        run: |
          pip install -e sdk/python pytest==8.3.4
          python -m pytest sdk/python/tests -q
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
      - name: Build + test TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test

  evals:
    # Deterministic eval regression gate: replays evals/runs/ recordings
    # against evals/cases/ trajectory cases. No LLM call, no API key, no
    # network — a change that breaks an agent-flow contract (tools used,
    # output keywords, call/latency/cost budgets) fails this job.
    name: Eval Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Install package
        run: uv pip install --system -e .
      - name: Run deterministic eval gate
        run: python scripts/run_regression_evals.py

  red_team:
    # Adversarial regression gate: replays evals/red_team/ through the
    # guardrail surfaces (input guard, indirect-injection scanner, output
    # guard). No LLM call, no API key, no network. A jailbreak that was
    # blocked last quarter and passes today is a regression — this is the
    # only job that notices. An empty corpus fails the gate.
    name: Red-Team Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Install package
        run: uv pip install --system -e .
      - name: Run red-team gate
        run: python scripts/run_red_team_evals.py --report red-team-report.json
      - name: Upload red-team report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: red-team-report
          path: red-team-report.json

  fairness:
    # Bias-examination gate (EU AI Act Art. 10(2)(f)/(g), Art. 15): group
    # fairness metrics over the labelled datasets in evals/fairness/. No LLM
    # call, no API key, no network. An empty dataset directory fails the job —
    # an examination that examines nothing is the failure mode this prevents.
    name: Bias Examination Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Install package
        run: uv pip install --system -e .
      - name: Run bias examination gate
        run: python scripts/run_fairness_evals.py --report fairness-report.json
      - name: Upload fairness report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: fairness-report
          path: fairness-report.json

  type_check:
    name: Type Check (MyPy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Type Check
        run: |
          uv pip install --system mypy==2.3.0 redis==5.3.1 types-requests==2.33.0.20260712 types-setuptools==83.0.0.20260724 pydantic==2.13.4 pydantic-settings==2.14.2
          mypy core --ignore-missing-imports --incremental --fast-module-lookup

  type_check_plugins:
    name: Type Check Official Plugins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Type Check Official Plugins
        run: |
          uv pip install --system mypy==2.3.0 redis==5.3.1 types-requests==2.33.0.20260712 types-setuptools==83.0.0.20260724 pydantic==2.13.4 pydantic-settings==2.14.2
          python scripts/check_official_plugin_typing.py

  type_check_core_resilience:
    name: Type Check Core Resilience
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Type Check Core Resilience
        run: |
          uv pip install --system mypy==2.3.0 redis==5.3.1 types-requests==2.33.0.20260712 types-setuptools==83.0.0.20260724 pydantic==2.13.4 pydantic-settings==2.14.2
          python scripts/check_core_resilience_typing.py

  plugin_integrity:
    name: Plugin Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install runtime deps for hashing
        run: pip install pyyaml==6.0.3
      - name: Verify manifest integrity_sha256 matches source tree
        run: python scripts/check_plugin_integrity.py

  # ============================================================
  # 🔒 SECURITY
  # ============================================================
  requirements_sync:
    name: requirements.txt ↔ pyproject.toml sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      # requirements.txt is the Docker-install mirror of pyproject specs; its
      # header demands they stay identical. This makes that promise a gate.
      - name: Check spec equivalence
        run: python scripts/check_requirements_sync.py

  uv_lock_check:
    name: Lockfile Check (uv)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.0"
      # A stale uv.lock means pyproject.toml changed without re-locking:
      # builds stop being reproducible. Regenerate with `uv lock`.
      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

  gitleaks:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Full history: a credential committed and later removed still leaks.
          fetch-depth: 0
      - name: Run gitleaks over the full git history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1

  security_scan:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python_lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Security Scan
        run: |
          uv pip install --system bandit==1.9.4
          # Full first-party surface: plugins hold the subprocess/browser/
          # inbound-webhook code, sdk and scripts ship to users/CI — none of
          # them may go unscanned.
          bandit -r core plugins sdk scripts -ll --exclude tests --skip B101
      - name: Dependency Vulnerability Scan
        run: |
          uv pip install --system -e . pip-audit==2.10.1
          # Blocking: a known-vulnerable installed dependency fails the PR.
          # (The base install has no `mineru` extra, so the accepted
          # transformers CVEs in .trivyignore.yaml are not present here.)
          pip-audit --skip-editable

  # ------------------------------------------------------------
  # Software Bill of Materials (SBOM) — CycloneDX
  # ------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python_lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom==7.3.1
          # Resolve the project's dependencies and emit a standards-compliant SBOM.
          pip install -e .
          # cyclonedx-py 'environment' scans the active venv; flags are
          # --output-format / --output-file (NOT --outfile).
          cyclonedx-py environment --output-format JSON --output-file sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90

  # ------------------------------------------------------------
  # Filesystem vulnerability + secret scan — Trivy (report mode)
  # Results land in the GitHub Security tab; does not block the build.
  # ------------------------------------------------------------
  trivy_scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python_lint]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # One resilient step: download the Trivy release tarball directly (no
      # install.sh / GitHub API, which rate-limits), scan, and always emit a
      # SARIF. Report-mode — never blocks the build.
      #
      # `backstage-portal/yarn.lock` is excluded from the dependency scan. The
      # Backstage developer portal is a vendored dev-only tool (it is NOT part
      # of the published `baselith-core` wheel or the release container image),
      # and its transitive npm tree is authored upstream by Backstage — not by
      # us. That tree drags in advisories we cannot action without a Backstage
      # release, most notably the abandoned `vm2` package (no patched version
      # exists; pulled in only as a build-time transitive of
      # @backstage/config-loader -> typescript-json-schema). Left in, it floods
      # the Security → Code scanning tab with ~70 unactionable findings and
      # drowns out real signal for the shipped product, so its lockfile is an
      # accepted exclusion. Secret/misconfig scanning of the
      # portal source is unaffected — only its lockfile is skipped.
      #
      # `--ignorefile .trivyignore.yaml` applies the accepted-risk register at
      # the repo root. It is passed explicitly rather than relying on Trivy's
      # implicit lookup so the exception set is visible in the job definition.
      # Entries there are per-CVE and carry an expiry date — see the file.
      - name: Trivy filesystem scan
        run: |
          set +e
          TRIVY_VERSION=0.71.0
          curl -sfL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz \
            && tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          # Resilience: if the download/extract failed, skip the scan without
          # failing the build (a flaky release mirror must not redden every PR).
          if [ ! -x /tmp/trivy ]; then
            echo "Trivy download unavailable; emitting empty SARIF (scan skipped)."
            echo '{"version":"2.1.0","runs":[]}' > trivy-results.sarif
            exit 0
          fi
          # backstage-portal/ is a VENDORED Backstage developer-portal app: its
          # transitive npm tree (yarn.lock) is upstream Backstage's dependency
          # set, is excluded from the shipped `baselith-core` wheel, and is not
          # part of the core package's supply chain — so it is skipped in both
          # scans. Its JS-dep CVEs are tracked/updated with Backstage, not here.
          SKIP_DIRS=".venv,node_modules,**/node_modules,**/.venv,backstage-portal"
          # Full report (vuln + secret + misconfig) → SARIF for the Security
          # tab. Report-only (--exit-code 0): IaC/secret findings stay visible
          # but do not gate the build.
          /tmp/trivy fs \
               --scanners vuln,secret,misconfig \
               --severity HIGH,CRITICAL \
               --format sarif \
               --output trivy-results.sarif \
               --skip-dirs "$SKIP_DIRS" \
               --ignorefile .trivyignore.yaml \
               --exit-code 0 \
               .
          # Guarantee a valid SARIF exists so the (always) upload step succeeds.
          if [ ! -f trivy-results.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > trivy-results.sarif
          fi
          # Supply-chain gate (--exit-code 1): fail ONLY on dependency
          # vulnerabilities not accepted in .trivyignore.yaml. Scoped to `vuln`
          # so pre-existing IaC/secret findings (reported above) never gate.
          /tmp/trivy fs \
               --scanners vuln \
               --severity HIGH,CRITICAL \
               --skip-dirs "$SKIP_DIRS" \
               --ignorefile .trivyignore.yaml \
               --exit-code 1 \
               .
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  package_smoke:
    name: Package Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [architecture_boundaries, python_lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install build backend
        run: |
          python -m pip install build==1.5.0 setuptools==83.0.0 wheel==0.47.0
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Validate distribution artifacts
        run: python scripts/check_distribution_artifacts.py

  # ============================================================
  # 🧪 TEST
  # ============================================================
  python_test:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # evals/red_team/fairness in the needs graph: the three quality gates
    # block the test→release path structurally, not only when configured as
    # required checks in branch protection.
    needs: [architecture_boundaries, type_check, type_check_plugins, type_check_core_resilience, security_scan, package_smoke, evals, red_team, fairness]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
        experimental: [false]
        include:
          # requires-python is >=3.12 with no upper cap: 3.14 runs advisory
          # until every upstream dep publishes wheels, then moves to blocking.
          - python-version: '3.14'
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: baselith
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv==0.12.0
      - name: Run Tests
        env:
          POSTGRES_DB: test_db
          DB_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv pip install --system -e ".[test]" pytest-xdist==3.8.0
          # Coverage XML on every run so PRs get a Codecov delta, not just main.
          pytest -n auto --cov=core --cov-report=xml:coverage.xml --cov-report=term -q
      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # 🏗️ BUILD
  # ============================================================


  # ============================================================
  # 🚀 RELEASE
  # ============================================================
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python_test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write        # provenance attestation (Sigstore OIDC)
      attestations: write    # actions/attest-build-provenance
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4  # v4
        with:
          extra_plugins: |
            @semantic-release/git
            @semantic-release/github
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/changelog
            conventional-changelog-conventionalcommits
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install uv and build package
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          pip install uv==0.12.0
          uv pip install --system build==1.5.0
          python3 -m build

      - name: Generate release SBOM and attach to the GitHub Release
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.semantic.outputs.new_release_version }}
        run: |
          uv pip install --system cyclonedx-bom==7.3.1
          cyclonedx-py environment --output-format JSON --output-file sbom.json
          # The 90-day CI artifact is not a release asset; this one lives with
          # the release for as long as the release exists.
          gh release upload "$TAG" sbom.json --clobber

      - name: Attest build provenance for the Python artifacts
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1
        with:
          subject-path: 'dist/*'

      - name: Upload artifacts
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: python-package-dist
          path: dist/
          retention-days: 7

  # ============================================================
  # 📦 PUBLISH
  # ============================================================
  publish_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [release]
    if: needs.release.outputs.new_release_published == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/baselith-core # Package name
    permissions:
      id-token: write # Essential for OIDC
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: python-package-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1
        with:
          # No token needed if Trusted Publishing is configured on PyPI
          print-hash: true
          # PEP 740: publish sigstore attestations for every dist file.
          attestations: true
