# Dependabot: keep the supply chain moving without hand-tracking advisories.
#
# Everything the CI pins by exact version or SHA is covered here, so a pinned
# toolchain does not quietly age into a known-vulnerable one. Updates are
# grouped per ecosystem (one PR per week instead of one per package) and the
# existing gates decide whether they merge: `uv lock --check`, pip-audit,
# Trivy, the locked-install test matrix and the OpenAPI drift gate all run on
# the Dependabot branch like on any other PR.
#
# Not covered on purpose:
#   - Base-image digests in Dockerfile-slim / Dockerfile-full: refreshed
#     deliberately (see the comment above each FROM) — a digest bump is a
#     rebuild + re-scan, not a routine update.
#   - backstage-portal/: a vendored upstream app, not part of the shipped
#     package (see .github/workflows/ci.yml, Trivy job).
version: 2
updates:
  # Python — pyproject.toml + uv.lock (the lock CI installs from).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    # Majors stay individual PRs: they need a human to read the changelog.

  # GitHub Actions — every `uses:` is SHA-pinned; Dependabot moves the SHA and
  # the trailing `# vN` comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

  # TypeScript SDK (published client).
  - package-ecosystem: "npm"
    directory: "/sdk/typescript"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    labels: ["dependencies", "sdk"]
    groups:
      sdk-minor-and-patch:
        update-types: ["minor", "patch"]

  # BaselithBot dashboard (ui/dist ships in the wheel).
  - package-ecosystem: "npm"
    directory: "/plugins/baselithbot/ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    labels: ["dependencies", "baselithbot"]
    groups:
      ui-minor-and-patch:
        update-types: ["minor", "patch"]
