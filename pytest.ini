[pytest]
minversion = 6.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=core
    --cov-report=term-missing
    --cov-report=html:htmlcov
; Branch coverage (see [tool.coverage.run]); 75 = current 76.7% minus margin.
; Ratchet upward as coverage grows — never down.
    --cov-fail-under=75
; Hung test fails itself instead of stalling the job until the CI timeout.
timeout = 120
timeout_method = thread
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    contract: marks tests as contract tests
    chaos: marks fault-injection resilience tests (deselect with '-m "not chaos"')
asyncio_mode = auto
