[pytest]
minversion = 6.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=core
    --cov=baselith
    --cov-report=term-missing
    --cov-report=html:htmlcov
; Branch coverage (see [tool.coverage.run]); 78 = current ~79% minus margin.
; Ratchet upward as coverage grows — never down. A gate parked several points
; below the real number is a gate that permits a silent regression: coverage
; could fall from 79 to 75 without anything turning red.
    --cov-fail-under=78
; Hung test fails itself instead of stalling the job until the CI timeout.
timeout = 120
timeout_method = thread
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    contract: marks tests as contract tests
    chaos: marks fault-injection resilience tests (deselect with '-m "not chaos"')
    real_llm: test may build a real LLM client (opts out of the local-inference guard)
asyncio_mode = auto
